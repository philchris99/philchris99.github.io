# Cloudflare Worker: Web-App + API + Zeitsteuerung
name = "apartment-strauss-team"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Im Dashboard eingetragene Variablen bei neuen Versionen NICHT löschen
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# Alle 5 Minuten: Buchungen aus Smoobu holen, Fristen prüfen (überfällig ab 12 bzw. 15 Uhr)
[triggers]
crons = ["*/5 * * * *"]

# Datenbank (Cloudflare → D1)
[[d1_databases]]
binding = "DB"
database_name = "apartment-strauss-team"
database_id = "db137fcd-ad7d-4aa7-92d4-61985c6657a3"

# Geheimnisse NICHT hier eintragen, sondern im Dashboard unter
# Worker → Einstellungen → Variablen und Geheimnisse:
#   SMOOBU_API_KEY    – API-Key aus Smoobu
#   SMOOBU_API_SECRET – zugehöriges Secret (HMAC-Anmeldung)
#   APP_SECRET        – langes Zufallspasswort (signiert Anmeldungen, 40+ Zeichen)
#   ADMIN_PASSWORD    – Passwort für /admin (Auftraggeber); ohne dieses gilt APP_SECRET
