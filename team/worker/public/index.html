<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strauss Team">
<meta name="theme-color" content="#1E3A4C">
<link rel="icon" href="/logo.svg">
<title>Strauss Team</title>
<style>
/* ==========================================================================
   MARKE – hier Farben von Apartment Strauss eintragen, Logo = public/logo.svg
   ========================================================================== */
:root {
  --brand: #1E3A4C;        /* Hauptfarbe (Buttons, Überschriften) */
  --brand-ink: #FFFFFF;    /* Schrift auf Hauptfarbe */
  --accent: #B8925A;       /* feine Akzente (Linien, Heute-Markierung) */
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;   /* Überschriften */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* Text */
  /* ------------------------------------------------------------------------ */
  --bg: #F4F2EE; --card: #FFFFFF; --text: #1D2328; --muted: #66707A; --line: #E2DDD5;
  --head-bg: #FFFFFF;
  --open: #9A6A12; --open-bg: #FBF0DC; --ok: #2D7050; --ok-bg: #E2F1E8;
  --done: #4B5663; --done-bg: #ECEFF2; --bad: #B03535; --bad-bg: #FBE6E6;
  --new: #B03535;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --brand: #7FA7BF; --brand-ink: #0F1B23; --accent: #D0AC72;
    --bg: #121618; --card: #1C2226; --text: #E9ECEE; --muted: #9AA4AC; --line: #2E363C;
    --open: #E5B460; --open-bg: #3A2D16; --ok: #72C99A; --ok-bg: #173026;
    --done: #B4BDC7; --done-bg: #262D33; --bad: #F08C8C; --bad-bg: #3D1D1D; --new: #F08C8C;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 16px/1.5 var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Kopf: bleibt hell, damit das Logo in beiden Modi lesbar ist */
header { background: var(--head-bg); border-bottom: 2px solid var(--accent); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; position: sticky; top: 0; z-index: 5; }
.head { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head img { height: 40px; width: auto; display: block; }
.head .who { text-align: right; font-size: 13px; color: #66707A; line-height: 1.3; }
.head .who b { color: #1D2328; display: block; font-size: 14px; }
.head .who button { margin-top: 4px; min-height: 28px; padding: 2px 10px; font-size: 12px; background: #fff; color: #1D2328; border-color: #D8D2C8; }

main { max-width: 820px; margin: 0 auto; padding: 8px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
h1 { font: 400 26px/1.2 var(--serif); color: var(--brand); text-wrap: balance; }
h2 { font: 400 22px/1.2 var(--serif); color: var(--brand); text-wrap: balance; }
.section { margin-top: 26px; scroll-margin-top: 80px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.section-head .meta { font-variant-numeric: tabular-nums; }
.today .section-head, .next .section-head { border-bottom: 2px solid var(--accent); }
.meta { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.greeting { margin-top: 18px; }
.greeting p { margin-top: 2px; }

button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.danger.armed { background: var(--bad); color: #fff; }
button.small { min-height: 34px; padding: 5px 11px; font-size: 14px; }
button.link { border: 0; background: none; color: var(--brand); padding: 0; min-height: 0; text-decoration: underline; }
button:disabled { opacity: .55; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 90px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.check input { width: 20px; height: 20px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 14px; margin-top: 6px; }

/* Auf einen Blick */
.glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.glance.three { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; min-height: 0; display: block; width: 100%; }
.tile b { display: block; font: 400 30px/1.1 var(--serif); font-variant-numeric: tabular-nums; color: var(--brand); }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.25; display: block; margin-top: 2px; }
.tile.warn { border-color: var(--bad); background: var(--bad-bg); }
.tile.warn b { color: var(--bad); }
.tile.text b { font: 600 15px/1.25 var(--sans); color: var(--text); overflow-wrap: break-word; hyphens: auto; }
.todo { margin-top: 12px; border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 14px; padding: 12px 14px; }
.todo b { color: var(--bad); }
.todo ul { list-style: none; margin-top: 6px; display: grid; gap: 4px; }
.todo li button { text-align: left; width: 100%; background: var(--card); border-color: var(--line); font-size: 15px; }

/* Reinigungskarten */
.task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; scroll-margin-top: 80px; }
.task.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.task.is-new { border-left: 6px solid var(--new); }
.task.is-next { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.task.muted { background: var(--done-bg); border-color: var(--line); box-shadow: none; }
.task.muted h3, .task.muted .meta { color: var(--muted); }
.task h3 { font: 600 19px/1.3 var(--sans); }
.task .when { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 3px 10px; white-space: nowrap; background: var(--done-bg); color: var(--done); }
.chip.new { background: var(--new); color: #fff; letter-spacing: .05em; }
.chip.next { background: var(--accent); color: #fff; }
.s-offen { color: var(--open); background: var(--open-bg); }
.s-bestätigt { color: var(--ok); background: var(--ok-bg); }
.s-erledigt { color: var(--done); background: var(--card); border: 1px solid var(--line); }
.s-storniert { color: var(--muted); background: var(--card); text-decoration: line-through; }
.chip.alert { color: var(--bad); background: var(--bad-bg); }
.chip.manual { color: var(--brand); background: transparent; border: 1px solid var(--brand); }
.origin { margin-top: 6px; font-size: 13px; color: var(--muted); }
.note { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions > button { flex: 1 1 160px; }
.day { margin: 16px 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Meldungen */
.report { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.report.resolved { opacity: .6; }
.report p { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.thumbs button { width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); padding: 0; min-height: 0; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.report-form { margin-top: 12px; display: grid; gap: 10px; }
.filepick { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed var(--muted); border-radius: 10px; padding: 12px; cursor: pointer; color: var(--muted); font-size: 15px; }
.filepick input { display: none; }

/* Galerie */
.gallery { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 15, .94); display: flex; flex-direction: column; color: #fff; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.gallery .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 15px; }
.gallery .bar button, .gallery .nav { background: rgba(255, 255, 255, .12); color: #fff; border: 0; }
.gallery .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; touch-action: pan-y; }
.gallery .stage img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 6px; }
.gallery .navs { display: flex; justify-content: center; gap: 12px; padding: 12px; }
.gallery .nav { min-width: 110px; }

/* Übersicht / Formulare */
.notice { border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice.bad { color: var(--bad); background: var(--bad-bg); }
.notice.info { background: var(--card); border: 1px solid var(--line); }
.empty { color: var(--muted); padding: 6px 0 2px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panel + .panel { margin-top: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
.codebox { margin-top: 12px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--card); }
.codebox .code { font: 600 34px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--brand); margin: 6px 0; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; padding: 10px 0; color: var(--brand); font-weight: 600; }
code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.danger-zone { border: 1px dashed var(--bad); }
.login { max-width: 420px; margin: 40px auto 0; }
.login input.pin { font: 600 30px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .3em; text-align: center; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; z-index: 30; }
@media (max-width: 520px) { .glance { grid-template-columns: repeat(2, 1fr); } .glance.three { grid-template-columns: repeat(3, 1fr); } .head img { height: 34px; } .tile b { font-size: 26px; } }
</style>
</head>
<body>
<header><div class="head"><img src="/logo.svg" alt="Apartment Strauss"><div class="who" id="who"></div></div></header>
<main id="app"><p class="empty" style="margin-top:24px">Wird geladen …</p></main>
<div class="gallery" id="gallery" hidden role="dialog" aria-modal="true" aria-label="Fotos">
  <div class="bar"><span id="g-count"></span><button type="button" id="g-close">Schließen ✕</button></div>
  <div class="stage" id="g-stage"><img id="g-img" alt="Foto zur Meldung"></div>
  <div class="navs"><button type="button" class="nav" id="g-prev">‹ Zurück</button><button type="button" class="nav" id="g-next">Weiter ›</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const utc = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (iso, n) => { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const fmt = (iso) => { const d = utc(iso); return `${WD[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.`; };
  const fmtLong = (iso) => { const d = utc(iso); return `${WDL[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${d.getUTCFullYear()}`; };
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr' : '–';
  const ADMIN = location.pathname.replace(/\/+$/, '') === '/admin';

  // ---- Anmeldung: Sitzung im Browser merken ---------------------------------
  // ?u=&k= (Link aus der Push-Nachricht) meldet ebenfalls an.
  const params = new URLSearchParams(location.search);
  let auth = null;
  const store = {
    get() { try { return localStorage.getItem('team-auth'); } catch (e) { return null; } },
    set(v) { try { v ? localStorage.setItem('team-auth', v) : localStorage.removeItem('team-auth'); } catch (e) { /* ohne Speicher */ } },
  };
  if (params.get('u') && params.get('k')) {
    auth = params.get('u') + '.' + params.get('k');
    store.set(auth);
    history.replaceState(null, '', location.pathname);
  } else {
    auth = store.get();
  }
  const photoUrl = (id) => `/api/photos/${encodeURIComponent(id)}?a=${encodeURIComponent(auth)}`;

  let data = null;
  let newCode = null;         // gerade erzeugter Code (nur einmal anzeigen)
  let editCleaner = null;     // Reinigungskraft in Bearbeitung
  const openForms = new Set(); // Reinigungen mit offenem Meldungsformular
  let toastTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
  }

  async function api(path, method, body, noAuth) {
    const headers = {};
    if (!noAuth && auth) headers.Authorization = 'Bearer ' + auth;
    let payload = body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    const res = await fetch(path, { method: method || 'GET', headers, body: payload });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || 'Fehler ' + res.status + ' – bitte erneut versuchen'), { status: res.status });
    return json;
  }

  // Beim automatischen Aktualisieren nichts überschreiben, was gerade eingetippt wird
  const busyEditing = () => openForms.size > 0 || !!editCleaner || !!document.querySelector('#app [data-dirty]') || !$('gallery').hidden;

  async function refresh(force) {
    if (!auth) return showLogin();
    if (!force && busyEditing()) return;
    try {
      data = Object.assign({}, data, await api('/api/me'));
      if (ADMIN && data.user.role !== 'owner') return showLogin();
      render();
    } catch (e) {
      if (e.status === 401) { store.set(null); auth = null; return showLogin(); }
      toast(e.message);
    }
  }
  function update(next) { data = Object.assign({}, data, next); render(); }

  function showLogin() {
    $('who').innerHTML = '';
    $('app').innerHTML = ADMIN ? `
      <form class="panel login" id="admin-login">
        <div class="eyebrow">Apartment Strauss</div><h1 style="margin:4px 0 10px">Admin-Anmeldung</h1>
        <label class="field">Passwort <input id="admin-pw" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button class="primary" type="submit">Anmelden</button></div>
        <p class="meta" style="margin-top:12px">Für Reinigungskräfte: <a href="/">zur Anmeldung mit Code</a></p>
      </form>` : `
      <form class="panel login" id="code-login">
        <div class="eyebrow">Apartment Strauss · Team</div><h1 style="margin:4px 0 6px">Anmelden</h1>
        <p class="meta" style="margin-bottom:12px">Bitte den persönlichen 6-stelligen Code eingeben.</p>
        <input id="code" class="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="••••••" aria-label="Persönlicher Code" required>
        <div class="actions"><button class="primary" type="submit">Anmelden</button></div>
        <p class="meta" style="margin-top:12px">Tipp: Danach über „Teilen → Zum Home-Bildschirm“ als App ablegen – du bleibst angemeldet.</p>
      </form>`;
    const first = document.querySelector('#app input');
    if (first) first.focus();
  }

  // ---- Bausteine ------------------------------------------------------------
  function nameOf(id) {
    const c = (data.cleaners || []).find((x) => x.id === id);
    return c ? c.name : id === data.user.id ? data.user.name : 'Reinigungskraft';
  }
  function dayWord(iso) {
    if (iso === data.today) return 'Heute';
    if (iso === addDays(data.today, 1)) return 'Morgen';
    if (iso === addDays(data.today, -1)) return 'Gestern';
    return fmt(iso);
  }
  const isActive = (t) => t.status === 'offen' || t.status === 'bestätigt';
  const isNew = (t) => t.status === 'offen' && t.date >= data.today;

  function statusChip(t) {
    if (t.status === 'offen' && t.escalated) return '<span class="chip alert">nicht bestätigt!</span>';
    const label = { offen: 'noch nicht bestätigt', bestätigt: 'bestätigt', erledigt: 'erledigt ✓', storniert: 'entfällt' }[t.status] || t.status;
    return `<span class="chip s-${esc(t.status)}">${label}</span>`;
  }

  function reportHtml(t, r, owner) {
    const ids = r.photos.join(',');
    return `<div class="report${r.resolved ? ' resolved' : ''}">
      <div class="meta"><b>${esc(nameOf(r.by))}</b> · ${fmtTime(r.at)}${r.resolved ? ' · behoben' : ''}</div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ''}
      ${r.photos.length ? `<div class="thumbs">${r.photos.map((p, i) => `<button type="button" data-gallery="${esc(ids)}" data-index="${i}" aria-label="Foto ${i + 1} von ${r.photos.length} öffnen"><img src="${photoUrl(p)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
      ${owner && !r.resolved ? `<div class="actions"><button class="small" data-resolve="${esc(t.id)}" data-report="${esc(r.id)}">Als behoben markieren</button></div>` : ''}
    </div>`;
  }

  function taskCard(t, owner, opts) {
    opts = opts || {};
    const active = isActive(t);
    const muted = !active;
    const nu = !owner && isNew(t);
    const cls = ['task', muted ? 'muted' : '', nu ? 'is-new' : '', opts.next && !nu ? 'is-next' : '',
      owner && t.status === 'offen' && (t.escalated || t.date === data.today) ? 'urgent' : ''].filter(Boolean).join(' ');
    const who = owner ? (t.assignedTo ? `übernommen von <b>${esc(nameOf(t.assignedTo))}</b>` : (active ? 'noch niemand eingetragen' : '')) : '';
    const chips = [
      nu ? '<span class="chip new">NEU</span>' : '',
      opts.next ? '<span class="chip next">Als Nächstes</span>' : '',
      statusChip(t),
      t.sameDayArrival && active ? '<span class="chip alert">Wechseltag – Anreise am selben Tag</span>' : '',
      t.manual ? '<span class="chip manual">zusätzliche Reinigung</span>' : '',
    ].join('');
    let actions = '';
    if (!owner && t.status === 'offen') actions += `<button class="primary" data-confirm="${esc(t.id)}">Bestätigen – ich übernehme</button>`;
    if (!owner && t.status === 'bestätigt') actions += `<button class="primary" data-done="${esc(t.id)}">Erledigt melden</button>`;
    if (!owner && t.status !== 'storniert') actions += `<button data-toggle-report="${esc(t.id)}">${openForms.has(t.id) ? 'Meldung schließen' : 'Hinweis / Problem melden'}</button>`;
    if (owner && t.manual && active) actions += `<button class="danger small" data-cancel="${esc(t.id)}">Reinigung absagen</button>`;
    const origin = t.createdAt ? `Eingetragen ${fmtTime(t.createdAt)} · ${t.source === 'manuell' ? 'manuell hinzugefügt' : 'automatisch aus Smoobu'}${t.changedAt ? ` · Datum geändert ${fmtTime(t.changedAt)}` : ''}` : '';
    return `<article class="${cls}" id="task-${esc(t.id)}">
      <div class="eyebrow"><span class="when">${esc(dayWord(t.date))}</span> · ${t.manual ? 'Reinigung' : 'Check-out'}</div>
      <h3>${esc(t.apartmentName)}</h3>
      <div class="meta">${fmtLong(t.date)}${t.guest ? ' · ' + esc(t.guest) : ''}${who ? ' · ' + who : ''}</div>
      <div class="chips">${chips}</div>
      ${origin ? `<div class="origin">${origin}</div>` : ''}
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
      ${(t.reports || []).map((r) => reportHtml(t, r, owner)).join('')}
      ${actions ? `<div class="actions">${actions}</div>` : ''}
      ${!owner && openForms.has(t.id) ? `<form class="report-form" data-report-form="${esc(t.id)}">
          <label class="field">Was fehlt, was ist kaputt, was ist zu tun?
            <textarea name="text" id="text-${esc(t.id)}" placeholder="z. B. Handtücher fehlen, Glühbirne im Bad defekt …"></textarea></label>
          <label class="filepick">Fotos hinzufügen (optional, max. 5)<input type="file" name="photo" id="photo-${esc(t.id)}" accept="image/*" multiple></label>
          <div class="meta" data-preview></div>
          <button class="primary" type="submit">Meldung senden</button>
        </form>` : ''}
      ${owner && t.history ? `<details class="meta" style="margin-top:8px"><summary>Verlauf</summary>${t.history.map((h) => `<div>${fmtTime(h.at)} – ${esc(h.text)}</div>`).join('')}</details>` : ''}
    </article>`;
  }

  const list = (items, owner, empty, nextId) => items.length ? items.map((t) => taskCard(t, owner, { next: t.id === nextId })).join('') : `<p class="empty">${empty}</p>`;
  const section = (id, title, sub, body, cls) =>
    `<section class="section ${cls || ''}" id="${id}"><div class="section-head"><h2>${title}</h2><span class="meta">${sub || ''}</span></div>${body}</section>`;
  const tile = (target, value, label, warn, text) =>
    `<button type="button" class="tile${warn ? ' warn' : ''}${text ? ' text' : ''}" data-jump="${target}"><b>${value}</b><span>${label}</span></button>`;
  const logList = (entries, showTo) => entries.length
    ? entries.map((n) => `<div class="report"><div class="meta">${fmtTime(n.at)}${showTo ? ' → ' + esc(n.toName) : ''}</div><p><b>${esc(n.title)}</b><br>${esc(n.body)}</p></div>`).join('')
    : '<p class="empty">Noch keine Nachrichten.</p>';

  function pushSetup() {
    return `<details class="more"><summary>Push-Nachrichten einrichten</summary><div class="panel">
      <ol style="margin-left:18px; display:grid; gap:8px">
        <li>App <b>ntfy</b> aus dem App Store bzw. Google Play installieren.</li>
        <li>In der App auf „+“ tippen und diesen Kanal abonnieren:<br><code id="topic">${esc(data.topic)}</code> <button class="small" data-copy="topic">Kopieren</button></li>

  // ---- Reinigungskraft ------------------------------------------------------
  function renderCleaner() {
    const t0 = data.today;
    const tasks = data.tasks.filter((t) => t.status !== 'storniert' || t.date >= t0);
    const upcoming = tasks.filter((t) => t.date >= t0);
    const past = tasks.filter((t) => t.date < t0).reverse();
    const fresh = upcoming.filter(isNew);
    const today = upcoming.filter((t) => t.date === t0 && t.status !== 'storniert');
    const todayOpen = today.filter(isActive).length;
    const next = upcoming.find(isActive);

    // Plan nach Tagen gruppiert (erledigte grau, abgesagte durchgestrichen)
    const byDay = {};
    for (const t of upcoming.filter((x) => !isNew(x) && x.date <= addDays(t0, 30))) (byDay[t.date] = byDay[t.date] || []).push(t);
    const plan = Object.keys(byDay).sort().map((d) =>
      `<div class="day">${esc(dayWord(d))}${d !== t0 && d !== addDays(t0, 1) ? '' : ' · ' + fmt(d)}</div>${list(byDay[d], false, '', next && next.id)}`).join('');
    const later = upcoming.filter((t) => !isNew(t) && t.date > addDays(t0, 30));

    return `
      <div class="greeting"><h1>Hallo ${esc(data.user.name)}</h1><p class="meta">${fmtLong(t0)}</p></div>
      <div class="glance three">
        ${tile('neu', fresh.length, fresh.length === 1 ? 'neu – bitte bestätigen' : 'neu – bitte bestätigen', fresh.length > 0)}
        ${tile('plan', today.length ? `${today.length - todayOpen}/${today.length}` : '0', today.length ? 'heute erledigt' : 'heute nichts')}
        ${tile(next ? 'task-' + next.id : 'plan', next ? esc(next.apartmentName) : '–', next ? 'als Nächstes · ' + esc(dayWord(next.date)) : 'nichts geplant', false, true)}
      </div>
      ${fresh.length ? section('neu', 'Neu – bitte bestätigen', fresh.length + ' offen',
        fresh.map((t) => taskCard(t, false, { next: next && t.id === next.id })).join(''), 'next') : ''}
      ${section('plan', 'Mein Plan', 'bestätigt & erledigt', plan || `<p class="empty">${fresh.length ? 'Noch nichts bestätigt – bitte oben bestätigen.' : 'Keine Reinigungen geplant.'}</p>`, 'today')}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, false, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, false, '')}</details>` : ''}
      <p class="meta" style="margin-top:16px">Bitte neue Reinigungen spätestens bis ${esc(data.escalationTime)} Uhr am Reinigungstag bestätigen.</p>
      ${pushSetup()}
      <details class="more"><summary>Meine Nachrichten</summary>${logList(data.log, false)}</details>`;
  }

    return section('team', 'Team', data.cleaners.length + ' Reinigungskräfte', `

        <p class="meta">Bitte jetzt notieren und persönlich weitergeben – der Code wird nur einmal angezeigt.

        <div class="actions"><button class="primary" type="submit">Anlegen und Code erzeugen</button></div>
      </form>`);

  function renderOwner() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const tasks = data.tasks;
    const live = tasks.filter((t) => t.status !== 'storniert');
    const today = tasks.filter((t) => t.date === t0);
    const tomorrow = tasks.filter((t) => t.date === t1);
    const soon = tasks.filter((t) => t.date > t1 && t.date <= t14);
    const later = tasks.filter((t) => t.date > t14);
    const past = tasks.filter((t) => t.date < t0).reverse();
    const unconfirmed = live.filter((t) => t.status === 'offen' && t.date >= t0);
    const alarms = unconfirmed.filter((t) => t.escalated);
    const reports = data.openReports || [];
    const apartments = data.apartments || [];
    const todayLive = today.filter((t) => t.status !== 'storniert');

    // Handlungsbedarf: Alarme, unbestätigt in den nächsten 2 Tagen, offene Meldungen
    const urgent = [
      ...alarms.map((t) => [`task-${t.id}`, `Alarm: ${t.apartmentName} – ${dayWord(t.date)} nicht bestätigt`]),
      ...unconfirmed.filter((t) => !t.escalated && t.date <= t1).map((t) => [`task-${t.id}`, `${t.apartmentName} – ${dayWord(t.date)}: noch niemand eingetragen`]),
      ...(!data.hasOwnerCode ? [['team', 'Eigenen 6-stelligen Admin-Code festlegen (für die Anmeldung auf der Startseite)']] : []),
      ...(!data.cleaners.length ? [['team', 'Noch keine Reinigungskraft angelegt – bitte unter „Team“ hinzufügen']] : []),

    const reportsBody = reports.length ? reports.map((r) => `<article class="task">
        <div class="eyebrow">${esc(dayWord(r.date))} · ${fmtLong(r.date)}</div><h3>${esc(r.apartmentName)}</h3>

        <label class="field">Datum <input id="m-date" type="date" required min="${t0}" value="${t1}"></label>
      </div>
      <label class="field" style="margin-top:10px">Hinweis für die Reinigungskraft (optional)

      <div class="actions"><button class="primary" type="submit">Eintragen und Reinigungskraft benachrichtigen</button></div>

    return `
      ${data.syncError ? `<div class="notice bad"><span><b>Abgleich mit Smoobu gestört:</b> ${esc(data.syncError)}</span><button class="small" data-jump="system">Details</button></div>` : ''}
      <div class="greeting"><h1>${fmtLong(t0)}</h1><p class="meta">Stand ${esc(data.time)} Uhr · Smoobu zuletzt ${fmtTime(data.lastSync)}</p></div>
      <div class="glance">
        ${tile('heute', todayLive.length, 'Check-outs heute')}
        ${tile('heute', unconfirmed.length, 'noch nicht bestätigt', unconfirmed.some((t) => t.date <= t1))}
        ${tile('meldungen', reports.length, 'offene Meldungen', reports.length > 0)}
        ${tile('heute', alarms.length, 'Alarme', alarms.length > 0)}
      </div>
      ${urgent.length ? `<div class="todo"><b>Handlungsbedarf</b><ul>${urgent.map(([id, text]) => `<li><button type="button" data-jump="${esc(id)}">${esc(text)}</button></li>`).join('')}</ul></div>` : ''}
      ${section('heute', 'Heute', fmt(t0), list(today, true, 'Heute stehen keine Reinigungen an.'), 'today')}
      ${section('meldungen', 'Offene Meldungen', reports.length ? reports.length + ' offen' : '', reportsBody)}
      ${section('morgen', 'Morgen', fmt(t1), list(tomorrow, true, 'Morgen stehen keine Reinigungen an.'))}
      ${section('bald', 'Nächste 14 Tage', '', list(soon, true, 'Keine Reinigungen.'))}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, true, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, true, '')}</details>` : ''}
      ${section('manuell', 'Reinigung hinzufügen', 'manuell', manualForm)}
      ${teamSection()}
      ${pushSetup()}
      <details class="more"><summary>Verschickte Nachrichten</summary>${logList(data.log, true)}</details>
      <details class="more" id="system"><summary>System &amp; Smoobu</summary>
        <div class="panel">
          <p class="meta">Letzter Smoobu-Abgleich: <b>${fmtTime(data.lastSync)}</b>${data.lastSyncCount != null ? ` · ${data.lastSyncCount} Buchungen` : ''}. Automatisch alle 15 Minuten.</p>
          <div class="actions"><button class="small" data-sync>Jetzt abgleichen</button><button class="small" data-diagnose>Diagnose</button></div>
          <div id="diagnose"></div>
          <p class="meta" style="margin-top:10px">Optional für sofortige Aktualisierung – Webhook-Adresse für Smoobu:<br><code id="hook">${esc(data.webhookUrl)}</code> <button class="small" data-copy="hook">Kopieren</button></p>
        </div>
        <div class="panel scroll"><b>Wohnungen aus Smoobu (${apartments.length})</b><table>
          ${apartments.map((a) => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.id)}</code></td></tr>`).join('') || '<tr><td class="meta">Erscheinen nach dem ersten Abgleich.</td></tr>'}</table></div>
      </details>
      ${data.allowReset ? `<section class="section"><div class="panel danger-zone">
        <div class="eyebrow">Testphase</div><h2 style="margin-top:4px">Alles zurücksetzen</h2>
        <p class="meta" style="margin:6px 0 10px">Löscht alle Reinigungen, Bestätigungen, Meldungen, Fotos und Nachrichten und lädt die Buchungen frisch aus Smoobu. Das Team und die Anmeldecodes bleiben erhalten. Es werden keine Push-Nachrichten verschickt.</p>
        <form id="reset-form" class="form-grid"><label class="field">Zur Bestätigung <b>ZURÜCKSETZEN</b> eingeben
          <input id="reset-confirm" autocomplete="off" placeholder="ZURÜCKSETZEN"></label>
          <button class="danger" type="submit">Alles zurücksetzen</button></form>
      </div></section>` : ''}`;
  }

  function render() {
    $('who').innerHTML = `<b>${esc(data.user.name)}</b>${data.user.role === 'owner' ? 'Admin' : 'Reinigung'} · ${esc(data.time)} Uhr<br><button type="button" data-logout>Abmelden</button>`;
    $('app').innerHTML = data.user.role === 'owner' ? renderOwner() : renderCleaner();
  }

  // ---- Galerie ----------------------------------------------------------------
  const gallery = { ids: [], index: 0, x: null };
  function showPhoto() {
    $('g-img').src = photoUrl(gallery.ids[gallery.index]);
    $('g-count').textContent = `Foto ${gallery.index + 1} von ${gallery.ids.length}`;
    $('g-prev').hidden = $('g-next').hidden = gallery.ids.length < 2;
  }
  function openGallery(ids, index) {
    gallery.ids = ids; gallery.index = index;
    showPhoto();
    $('gallery').hidden = false;
    document.body.style.overflow = 'hidden';
    $('g-close').focus();
  }
  function closeGallery() { $('gallery').hidden = true; document.body.style.overflow = ''; $('g-img').removeAttribute('src'); }
  function step(d) { gallery.index = (gallery.index + d + gallery.ids.length) % gallery.ids.length; showPhoto(); }
  $('g-close').onclick = closeGallery;
  $('g-prev').onclick = () => step(-1);
  $('g-next').onclick = () => step(1);
  $('g-stage').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeGallery(); });
  $('g-stage').addEventListener('touchstart', (e) => { gallery.x = e.touches[0].clientX; }, { passive: true });
  $('g-stage').addEventListener('touchend', (e) => {
    if (gallery.x == null) return;
    const dx = e.changedTouches[0].clientX - gallery.x;
    gallery.x = null;
    if (Math.abs(dx) > 40 && gallery.ids.length > 1) step(dx < 0 ? 1 : -1);
  });
  document.addEventListener('keydown', (e) => {
    if ($('gallery').hidden) return;
    if (e.key === 'Escape') closeGallery();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  // ---- Fotos vor dem Hochladen verkleinern (spart Datenvolumen und Speicher) --
  function compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Foto konnte nicht verarbeitet werden'))), 'image/jpeg', 0.75);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden')); };
      img.src = url;
    });
  }

  const selectedApartments = (form) => {
    if (form.querySelector('[data-all]').checked) return 'all';
    return [...form.querySelectorAll('[data-apts] input:checked')].map((i) => i.value);
  };

  // ---- Ereignisse -----------------------------------------------------------
  document.addEventListener('input', (e) => { if (e.target.closest('#app form')) e.target.setAttribute('data-dirty', ''); });

  document.addEventListener('change', (e) => {
    if (e.target.type === 'file') {
      const n = e.target.files.length;
      const preview = e.target.closest('form').querySelector('[data-preview]');
      if (preview) preview.textContent = n ? `${n} Foto${n > 1 ? 's' : ''} ausgewählt${n > 5 ? ' – bitte höchstens 5' : ''}` : '';
    }
    if (e.target.matches('[data-all]')) e.target.closest('form').querySelector('[data-apts]').hidden = e.target.checked;
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const submit = form.querySelector('[type=submit]');
    submit.disabled = true;
    const label = submit.textContent;
    try {
      if (form.id === 'code-login') {
        const res = await api('/api/login', 'POST', { code: $('code').value }, true);
        auth = res.session; store.set(auth);
        await refresh(true);
      } else if (form.id === 'admin-login') {
        const res = await api('/api/admin-login', 'POST', { password: $('admin-pw').value }, true);
        auth = res.session; store.set(auth);
        await refresh(true);
      } else if (form.dataset.reportForm) {
        const id = form.dataset.reportForm;
        const files = [...form.querySelector('input[type=file]').files];
        if (files.length > 5) throw new Error('Bitte höchstens 5 Fotos auswählen');
        const text = form.querySelector('textarea').value.trim();
        if (!text && !files.length) throw new Error('Bitte einen Text eingeben oder ein Foto anhängen');
        submit.textContent = files.length ? 'Fotos werden vorbereitet …' : 'Wird gesendet …';
        const body = new FormData();
        body.append('text', text);
        for (const f of files) body.append('photo', await compress(f), 'foto.jpg');
        submit.textContent = 'Wird gesendet …';
        const next = await api(`/api/tasks/${encodeURIComponent(id)}/report`, 'POST', body);
        openForms.delete(id);
        update(next);
        toast('Meldung gesendet – danke!');
      } else if (form.id === 'manual-form') {
        update(await api('/api/manual', 'POST', { apartmentId: $('m-apt').value, date: $('m-date').value, note: $('m-note').value }));
        toast('Reinigung eingetragen – Reinigungskraft wurde benachrichtigt');
      } else if (form.id === 'owner-code') {
        const res = await api('/api/owner-code', 'POST', { code: $('owner-code-input').value });
        update(res);
        toast('Admin-Code gespeichert – ab jetzt reicht der Code auf der Startseite');
      } else if (form.id === 'add-cleaner') {
        const res = await api('/api/team', 'POST', { name: form.elements.name.value, apartments: selectedApartments(form) });
        newCode = res.newCode;
        update(res);
        document.getElementById('team').scrollIntoView();
      } else if (form.dataset.editCleaner) {
        const res = await api(`/api/team/${form.dataset.editCleaner}`, 'POST', { name: form.elements.name.value, apartments: selectedApartments(form) });
        editCleaner = null;
        update(res);
        toast('Gespeichert');
      } else if (form.id === 'reset-form') {
        if ($('reset-confirm').value.trim() !== 'ZURÜCKSETZEN') throw new Error('Bitte genau ZURÜCKSETZEN eingeben');
        submit.textContent = 'Wird zurückgesetzt …';
        const next = await api('/api/reset', 'POST', { confirm: 'ZURÜCKSETZEN' });
        openForms.clear();
        update(next);
        window.scrollTo(0, 0);
        toast(`Zurückgesetzt – ${next.summary.bookings} Buchungen neu aus Smoobu geladen`);
      }
    } catch (err) {
      toast(err.message);
      if (submit.isConnected) { submit.disabled = false; submit.textContent = label; }
    }
  });

  /** Zweimal tippen zur Sicherheit (Browser-Dialoge sind auf Handys unpraktisch) */
  function armed(b, text) {
    if (b.classList.contains('armed')) return true;
    const original = b.textContent;
    b.classList.add('armed', 'danger');
    b.textContent = text;
    setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = original; } }, 4000);
    return false;
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || b.closest('form') && b.type === 'submit' || b.closest('#gallery')) return;
    const d = b.dataset;
    try {
      if (d.jump) {
        const el = document.getElementById(d.jump);
        if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      } else if (d.gallery) {
        openGallery(d.gallery.split(','), Number(d.index));
      } else if (d.logout !== undefined) {
        store.set(null); auth = null; data = null;
        showLogin();
      } else if (d.confirm || d.done) {
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.confirm || d.done)}/${d.confirm ? 'confirm' : 'done'}`, 'POST'));
        toast(d.confirm ? 'Bestätigt – danke!' : 'Als erledigt gemeldet');
      } else if (d.toggleReport) {
        if (openForms.has(d.toggleReport)) openForms.delete(d.toggleReport); else openForms.add(d.toggleReport);
        render();
        const ta = document.getElementById('text-' + d.toggleReport);
        if (ta) ta.focus();
      } else if (d.resolve) {
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.resolve)}/reports/${encodeURIComponent(d.report)}/resolve`, 'POST'));
        toast('Meldung als behoben markiert');
      } else if (d.cancel) {
        if (!armed(b, 'Wirklich absagen? Nochmal tippen')) return;
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.cancel)}/cancel`, 'POST'));
        toast('Reinigung abgesagt – Reinigungskraft wurde benachrichtigt');
      } else if (d.edit) {
        editCleaner = d.edit; render();
      } else if (d.editCancel !== undefined) {
        editCleaner = null; render();
      } else if (d.newcode) {
        if (!armed(b, 'Alter Code wird ungültig – nochmal tippen')) return;
        const res = await api(`/api/team/${d.newcode}/code`, 'POST');
        newCode = res.newCode; update(res);
        document.getElementById('team').scrollIntoView();
      } else if (d.remove) {
        if (!armed(b, 'Wirklich entfernen? Nochmal tippen')) return;
        update(await api(`/api/team/${d.remove}/delete`, 'POST'));
        toast('Reinigungskraft entfernt');
      } else if (d.hideCode !== undefined) {
        newCode = null; render();
      } else if (d.sync !== undefined) {
        b.disabled = true;
        b.textContent = 'Gleiche ab …';
        const next = await api('/api/sync', 'POST');
        update(next);
        toast(next.summary.syncError ? next.summary.syncError : `Abgleich fertig: ${next.summary.bookings} Buchungen`);
      } else if (d.diagnose !== undefined) {
        b.disabled = true;
        b.textContent = 'Prüfe …';
        const res = await api('/api/diagnose', 'POST');
        b.disabled = false;
        b.textContent = 'Diagnose';
        $('diagnose').innerHTML = `<div class="scroll" style="margin-top:8px"><table>${res.results.map((r) => `<tr>
            <td><b>${esc(r.variant)}</b></td>
            <td>Status ${esc(r.status ?? '–')}${r.received ? ' · ' + esc(r.received) + ' erhalten' + (r.total != null ? ' von ' + esc(r.total) : '') : ''}
            ${r.topKeys && r.topKeys.length ? '<br><span class="meta">' + esc(r.topKeys.join(', ')) + '</span>' : ''}
            ${r.error ? '<br><span style="color:var(--bad)">' + esc(r.error) + '</span>' : ''}</td></tr>`).join('')}</table></div>`;
      } else if (d.test !== undefined) {
        await api('/api/test-push', 'POST');
        toast('Test-Nachricht verschickt');
      } else if (d.copy) {
        const text = $(d.copy).textContent;
        try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (err) {
          const r = document.createRange(); r.selectNodeContents($(d.copy));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }
    } catch (err) {
      toast(err.message);
      if (err.status !== 401) refresh(true); else { store.set(null); auth = null; showLogin(); }
    }
  });

  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
