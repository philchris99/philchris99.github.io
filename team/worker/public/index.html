<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apartments Strauss">
<meta name="application-name" content="Apartments Strauss">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Apartments Strauss</title>
<style>
/* ==========================================================================
   MARKE Apartments Strauss – Logo in public/logo*.png
   ========================================================================== */
:root {
  --brand: #2E2E2C;        /* Anthrazit wie das Logo (Buttons, Überschriften) */
  --brand-ink: #FFFFFF;
  --accent: #7C8B6B;       /* Salbeigrün – passend zu den Blumen im Logo */
  --accent-soft: #EEF1EA;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #F6F4F0; --card: #FFFFFF; --text: #242422; --muted: #6E6A64; --line: #E4DFD7;
  --open: #93620E; --open-bg: #FBF0DC; --ok: #3D6B47; --ok-bg: #E4F0E6;
  --done: #5A5A56; --done-bg: #EFEDE9; --bad: #B03535; --bad-bg: #FBE6E6; --new: #B03535;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --brand: #ECE8E1; --brand-ink: #1B1B1A; --accent: #A6B594; --accent-soft: #232820;
    --bg: #151514; --card: #1F1F1D; --text: #EDEAE4; --muted: #A39E96; --line: #34332F;
    --open: #E5B460; --open-bg: #3A2D16; --ok: #8CCB98; --ok-bg: #1B2E1F;
    --done: #B3AFA8; --done-bg: #262624; --bad: #F08C8C; --bad-bg: #3D1D1D; --new: #F08C8C;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 16px/1.5 var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }

/* Kopf: immer hell, damit das schwarze Logo lesbar bleibt */
header { background: #FFFFFF; border-bottom: 1px solid #E4DFD7; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; position: sticky; top: 0; z-index: 5; }
.head { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .house { height: 46px; width: auto; }
.brand .word { height: 30px; width: auto; }
.head .who { text-align: right; font-size: 12px; color: #6E6A64; line-height: 1.3; }
.head .who b { color: #242422; display: block; font-size: 14px; }
.head .who button { margin-top: 3px; min-height: 28px; padding: 2px 10px; font-size: 12px; background: #fff; color: #242422; border-color: #D8D2C8; }

main { max-width: 820px; margin: 0 auto; padding: 8px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
h1 { font: 400 25px/1.2 var(--sans); letter-spacing: .01em; color: var(--brand); text-wrap: balance; }
h2 { font: 500 14px/1.3 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
.section { margin-top: 28px; scroll-margin-top: 80px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section.key .section-head { border-bottom: 2px solid var(--accent); }
.meta { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.greeting { margin-top: 18px; }
.greeting p { margin-top: 2px; }

button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary, a.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.danger.armed { background: var(--bad); color: #fff; }
button.small, .btn.small { min-height: 34px; padding: 5px 11px; font-size: 14px; }
button:disabled { opacity: .55; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 90px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }

/* Auf einen Blick */
.glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.glance.three { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; cursor: pointer; display: block; width: 100%; min-height: 0; }
.tile b { display: block; font: 300 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; color: var(--brand); }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.25; display: block; margin-top: 3px; }
.tile.warn { border-color: var(--bad); background: var(--bad-bg); }
.tile.warn b { color: var(--bad); }
.tile.text b { font: 600 15px/1.25 var(--sans); color: var(--text); overflow-wrap: break-word; hyphens: auto; }
.todo { margin-top: 12px; border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 14px; padding: 12px 14px; }
.todo > b { color: var(--bad); }
.todo ul { list-style: none; margin-top: 6px; display: grid; gap: 4px; }
.todo li button { justify-content: flex-start; text-align: left; width: 100%; background: var(--card); font-size: 15px; }

/* Neuigkeiten */
.news { margin-top: 14px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; }
.news-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.news ul { list-style: none; margin-top: 8px; display: grid; gap: 6px; }
.news li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.news li.unread { border-left: 4px solid var(--new); }
.news li { padding: 6px 10px; line-height: 1.35; }
.news li b { font-size: 14px; }
.news-link { all: unset; display: block; width: 100%; cursor: pointer; }
.news-more > summary { cursor: pointer; margin-top: 6px; font-size: 14px; color: var(--muted); }

/* Reinigungskarten */
.task { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; scroll-margin-top: 80px; }
.task.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.task.is-new { border-left: 6px solid var(--new); }
.task.is-next { box-shadow: 0 0 0 2px var(--accent) inset; }
.task.muted { background: var(--done-bg); box-shadow: none; }
.task.muted h3, .task.muted .meta { color: var(--muted); }
.task-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.task h3 { font: 600 17px/1.25 var(--sans); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 3px 10px; white-space: nowrap; background: var(--done-bg); color: var(--done); }
.chip.new { background: var(--new); color: #fff; letter-spacing: .05em; }
.chip.next { background: var(--accent); color: #fff; }
.chip.yes { color: var(--ok); background: var(--ok-bg); }
.chip.wait { color: var(--open); background: var(--open-bg); }
.chip.alert { color: var(--bad); background: var(--bad-bg); }
.chip.run { color: #fff; background: var(--accent); }
.chip.manual { color: var(--brand); background: transparent; border: 1px solid var(--line); }
.chip.gone { text-decoration: line-through; }
.keys-check { margin-top: 10px; padding: 12px; border: 2px solid var(--accent); border-radius: 12px; background: var(--card); }
.keys-check legend { font-weight: 700; font-size: 16px; padding: 0; }
.keys-check fieldset { border: 0; margin: 0; padding: 0; }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; font-size: 16px; cursor: pointer; }
.choice input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.choice.no:has(input:checked) { border-color: var(--bad); background: var(--bad-bg); }
.next-guests { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.codes { margin-top: 10px; padding: 12px; border: 2px solid var(--brand); border-radius: 12px; background: var(--card); }
.codes .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.codes .big { font-size: 30px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.code-table input { width: 100%; min-width: 70px; }
.code-table td { padding: 4px; vertical-align: top; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 16px; cursor: pointer; }
.checklist label:last-child { border-bottom: 0; }
.checklist input { width: 22px; height: 22px; flex: none; margin: 1px 0 0; accent-color: var(--accent); }
.checklist label:has(input:checked) { color: var(--muted); }
.supply-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.supply-grid label { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 15px; cursor: pointer; background: var(--card); }
.supply-grid input { width: 18px; height: 18px; margin: 0; accent-color: var(--open); }
.supply-grid label:has(input:checked) { border-color: var(--open); background: var(--open-bg); font-weight: 650; }
.supply-grid label.reported { opacity: .6; cursor: default; }
.offline { position: sticky; top: 0; z-index: 12; margin: 8px 0; padding: 8px 12px; border-radius: 10px; background: var(--open-bg); color: var(--open); font-weight: 650; font-size: 14px; }
.lang { min-height: 30px; padding: 2px 10px; font-size: 13px; margin-left: 6px; }
.apt-note { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: #FFF4D6; color: #3A2E0A; border: 1px solid #E8C96A; font-size: 15px; }
@media (prefers-color-scheme: dark) { .apt-note { background: #3A300F; color: #F3E3B0; border-color: #6B5A1E; } }
.vthumb { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #222; color: #fff; font-size: 13px; font-weight: 700; }
.thumb video { width: 100%; height: 100%; object-fit: cover; }
.finish { position: fixed; inset: 0; z-index: 28; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.finish-inner { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.finish-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 2px solid var(--accent); margin-bottom: 8px; }
.finish .step { margin-top: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.finish .step > b:first-child { display: block; font-size: 17px; margin-bottom: 6px; }
.finish .step .num { display: inline-flex; width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: #fff; align-items: center; justify-content: center; font-size: 14px; margin-right: 8px; }
#g-vid { max-width: 100%; max-height: 100%; }
.route ol { list-style: none; margin: 8px 0 0; padding: 0; }
.route li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.route li:last-child { border-bottom: 0; }
.route .n { display: inline-flex; width: 26px; height: 26px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.route .km { font-size: 12px; color: var(--muted); }
.route button.link { background: none; border: 0; padding: 0; min-height: 0; font: inherit; font-weight: 650; color: var(--text); text-align: left; cursor: pointer; }
.kpi { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
.kpi .big { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 14px; color: var(--muted); }
.chart { --chart: #1E64B4; --grid: #E6E1D8; position: relative; margin-top: 12px; }
@media (prefers-color-scheme: dark) { .chart { --chart: #4F8FD6; --grid: #34332F; } }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12); max-width: 240px; transform: translateY(-110%); }
.chart .tip b { display: block; font-size: 15px; }
.bars td { padding: 4px 6px; font-size: 13px; vertical-align: middle; }
.bars .bar { height: 10px; border-radius: 0 4px 4px 0; background: #1E64B4; }
@media (prefers-color-scheme: dark) { .bars .bar { background: #4F8FD6; } }
.pagenav { position: sticky; top: 0; z-index: 11; display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.pagenav::-webkit-scrollbar { display: none; }
.pagenav button { flex: none; min-height: 38px; padding: 6px 14px; border-radius: 99px; font-size: 14px; font-weight: 600; background: var(--card); color: var(--text); }
.pagenav button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.pagenav .badge { display: inline-block; min-width: 20px; padding: 1px 7px; margin-left: 4px; border-radius: 99px; font-size: 12px; background: var(--accent-soft); color: var(--text); }
.pagenav button.on .badge { background: rgba(255,255,255,.22); color: inherit; }
.empty-state { margin: 18px 0 6px; padding: 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); background: var(--card); }
.subhead { margin: 12px 0 4px; font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.notice:not(.bad) { background: var(--accent-soft); border: 1px solid var(--accent); }
.size-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.size-row:last-child { border-bottom: 0; }
.size-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.size-head > span { min-width: 0; }
.size-val { flex: none; }
.size-val { font-size: 20px; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 12px; margin: 6px 0 4px; background: var(--done-bg); border-radius: 0 4px 4px 0; }
.track .bar { height: 12px; border-radius: 0 4px 4px 0; background: #1E64B4; }
@media (prefers-color-scheme: dark) { .track .bar { background: #4F8FD6; } }
.track .avg { position: absolute; top: -3px; width: 2px; height: 18px; background: var(--text); }
.actions.range { align-items: center; margin: 4px 0 12px; }
.actions.range .meta { flex: 1 1 100%; }
.task h3 { font-size: 20px; margin: 2px 0 2px; }
.task .loc { font-size: 13px; color: var(--muted); }
.status-row { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.task .next-guests { margin-top: 6px; padding: 5px 10px; font-size: 14px; }
.next-guests.same { background: var(--bad-bg); color: var(--bad); }
.task.compact { padding: 8px 12px; }
.task.compact h3 { font-size: 15px; }
.task.compact .status { font-size: 14px; padding: 3px 10px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 4px 10px; border-radius: 10px; background: var(--done-bg); color: var(--text); }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.status.wait { background: var(--open-bg); color: var(--open); }
.status.new { background: var(--new); color: #fff; }
.status.run { background: var(--accent); color: #fff; }
.status.gone { text-decoration: line-through; }
.main-action { margin-top: 8px; }
.main-action button.big { width: 100%; min-height: 50px; font-size: 18px; font-weight: 700; border-radius: 14px; }
.more-actions { margin-top: 6px; }
.more-actions > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px; font-weight: 600; font-size: 14px; background: var(--card); }
.more-actions > summary::-webkit-details-marker { display: none; }
.more-actions[open] > summary { background: var(--done-bg); }
.more-list { display: grid; gap: 6px; margin-top: 8px; }
.more-btn { display: flex; align-items: center; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  color: var(--text); font-size: 16px; text-align: left; justify-content: flex-start; text-decoration: none; cursor: pointer; }
.more-btn.danger { color: var(--bad); }
.chip.period { color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent); }
.request { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--open); background: var(--open-bg); border-radius: 10px; }
.cal-period { position: absolute; top: 33px; height: 0; border-top: 3px dashed var(--c-ok, #1E64B4); pointer-events: none; }
.cal-clean.req::after { content: '?'; position: absolute; top: -7px; right: -8px; width: 14px; height: 14px; font-size: 10px; line-height: 14px; border-radius: 99px; background: var(--open); color: #fff; font-size: 11px; line-height: 16px; }
.origin { margin-top: 6px; font-size: 13px; color: var(--muted); }
.note { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions > * { flex: 1 1 150px; }
.phone { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-height: 36px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; white-space: nowrap; font-weight: 600; }
.phone svg { width: 16px; height: 16px; }
.assign { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: stretch; }
.assign select { flex: 1 1 180px; width: auto; }
.assign button { flex: 0 1 auto; }
.day { margin: 16px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Meldungen + Fotos */
.report { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.report.owner { border-left: 3px solid var(--accent); }
.report.resolved { opacity: .6; }
.report p { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.thumb { position: relative; width: 84px; height: 84px; }
.thumb > button:first-child { width: 84px; height: 84px; border-radius: 8px; overflow: hidden; padding: 0; min-height: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 99px; background: var(--bad); color: #fff; border: 2px solid var(--card); font-size: 15px; line-height: 1; }
.report-form { margin-top: 12px; display: grid; gap: 10px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick label { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--muted); border-radius: 10px; padding: 10px; cursor: pointer; color: var(--text); font-size: 15px; min-height: 44px; }
.pick input { display: none; }

/* Galerie */
.gallery { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 9, .95); display: flex; flex-direction: column; color: #fff; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.gallery .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 15px; }
.gallery .bar button, .gallery .nav { background: rgba(255, 255, 255, .14); color: #fff; border: 0; }
.gallery .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; touch-action: pan-y; }
.gallery .stage img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 6px; }
.gallery .navs { display: flex; justify-content: center; gap: 12px; padding: 12px; }
.gallery .nav { min-width: 110px; }

/* Übersicht / Formulare */
.notice { border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice.bad { color: var(--bad); background: var(--bad-bg); }
.empty { color: var(--muted); padding: 6px 0 2px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panel + .panel, .panel + form.panel { margin-top: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
.codebox { margin-top: 12px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--card); }
.codebox .code { font: 600 34px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--brand); margin: 6px 0; }
.person { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; padding: 10px 0; color: var(--brand); font-weight: 600; }
code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.danger-zone { border: 1px dashed var(--bad); }
.login { max-width: 400px; margin: 28px auto 0; text-align: center; }
.login .logo { width: 190px; margin: 4px auto 18px; display: block; }
.login input.pin { font: 600 32px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .35em; text-align: center; padding-left: .35em; }
.login .hint { margin-top: 12px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; z-index: 30; }
/* Push einrichten */
.guide { margin-top: 14px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--card); }
.guide ol { list-style: none; display: grid; gap: 14px; margin-top: 10px; counter-reset: s; }
.guide li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.guide li::before { content: counter(s); width: 34px; height: 34px; border-radius: 99px; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.guide .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.guide .row > * { flex: 1 1 140px; }
.btn.store { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.store.other { background: var(--card); color: var(--text); border-color: var(--line); font-weight: 400; }
.topicline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.topicline code { font-size: 14px; padding: 6px 8px; }
.codeline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.codeline .code { font: 600 22px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--brand); }

/* Kalender */
.greet-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.cal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.cal-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 10px 0; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
.cal { --cal-line: #C9C1B4; --cal-we: #ECE6DC; --cal-today: #FFE9A8; --c-book: #33414E; --c-open: #E07400; --c-ok: #1E64B4; --c-done: #2E7D32; --c-bad: #C62828;
  overflow-x: auto; border: 1px solid var(--cal-line); border-radius: 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
@media (prefers-color-scheme: dark) { .cal { --cal-line: #4A4740; --cal-we: #282724; --cal-today: #4A3D10; --c-book: #8FA3B8; } }
.cal-grid { display: grid; grid-template-columns: 120px calc(var(--days) * var(--w)); --w: 42px; width: max-content; }
.cal-apt, .cal-corner { position: sticky; left: 0; z-index: 2; background: var(--card); border-right: 2px solid var(--cal-line); border-bottom: 1px solid var(--cal-line);
  padding: 2px 6px; font-size: 12px; line-height: 1.15; display: flex; align-items: center; gap: 6px; min-height: 46px; }
.cal-corner { min-height: 40px; }
.cal-apt b { display: inline-flex; width: 22px; height: 22px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: 12px; align-items: center; justify-content: center; flex: none; }
.cal-apt span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cal-corner { z-index: 3; font-weight: 600; }
.cal-days, .cal-row { position: relative; display: flex; border-bottom: 1px solid var(--cal-line); }
.cal-day { width: var(--w); flex: none; text-align: center; font-size: 11px; line-height: 1.15; padding: 3px 0; color: var(--muted); border-left: 1px solid var(--cal-line); }
.cal-day b { display: block; font-size: 14px; color: var(--text); }
.cal-day.we { background: var(--cal-we); }
.cal-day.today { background: var(--cal-today); color: var(--text); font-weight: 700; }
.cal-day.month { border-left: 2px solid var(--brand); }
.cal-cell { width: var(--w); flex: none; border-left: 1px solid var(--cal-line); min-height: 46px; }
.cal-cell.we { background: var(--cal-we); }
.cal-cell.today { background: var(--cal-today); }
.cal-bar { position: absolute; top: 3px; height: 20px; border-radius: 5px; background: var(--c-book); color: #fff; font-size: 11px; font-weight: 700;
  padding: 0 6px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; border: 0; min-height: 0; justify-content: flex-start; }
@media (prefers-color-scheme: dark) { .cal-bar { color: #10151B; } }
.cal-bar.blocked { background: repeating-linear-gradient(135deg, #B9B2A6 0 5px, #8C8579 5px 10px); color: #1E1E1C; border: 1px solid #6F695F; }
.cal-bar.cut-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.cal-bar.cut-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.cal-clean { position: absolute; top: 24px; width: 21px; height: 21px; min-height: 0; padding: 0; border-radius: 99px; transform: translateX(-50%);
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); color: #fff; font-weight: 800; font-size: 12px; line-height: 1; z-index: 1; }
.cal-clean.manual { border-radius: 5px; }
.cal-clean.offen { background: var(--c-open); } .cal-clean.bestätigt { background: var(--c-ok); } .cal-clean.erledigt { background: var(--c-done); }
.cal-clean.overdue { background: var(--c-bad); animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cal-clean.overdue { animation: none; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(176, 53, 53, .25); } }
.legend .sym { display: inline-flex; width: 20px; height: 20px; border-radius: 99px; color: #fff; font-weight: 800; font-size: 12px; align-items: center; justify-content: center; vertical-align: middle; margin-right: 5px; }
.legend .sym.sq { border-radius: 5px; }

/* Detailfenster */
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(20, 20, 18, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { font: 600 19px/1.3 var(--sans); }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 12px; font-size: 15px; }
.sheet dt { color: var(--muted); }
@media (min-width: 700px) { .modal { align-items: center; } }

@media (max-width: 520px) {
  .glance { grid-template-columns: repeat(2, 1fr); }
  .glance.three { grid-template-columns: repeat(3, 1fr); }
  .brand .house { height: 40px; } .brand .word { height: 24px; }
  .tile b { font-size: 26px; }
}
@media (max-width: 360px) { .brand .word { display: none; } }
</style>

<body>
<header><div class="head">
  <div class="brand"><img class="house" src="/logo-house.png" alt=""><img class="word" src="/logo-wordmark.png" alt="Apartments Strauss"></div>
  <div class="who" id="who"></div>
</div></header>
<main id="app"><p class="empty" style="margin-top:24px">Wird geladen …</p></main>
<div class="gallery" id="gallery" hidden role="dialog" aria-modal="true" aria-label="Fotos">
  <div class="bar"><span id="g-count"></span><button type="button" id="g-close">Schließen ✕</button></div>
  <div class="stage" id="g-stage"><img id="g-img" alt="Foto"><video id="g-vid" controls playsinline hidden></video></div>
  <div class="navs"><button type="button" class="nav" id="g-prev">‹ Zurück</button><button type="button" class="nav" id="g-next">Weiter ›</button></div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="sheet" id="modal-body"></div></div>
<div class="finish" id="finish" hidden role="dialog" aria-modal="true" aria-label="Reinigung abschließen"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/i18n-hu.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Sprache der Oberfläche: 'de' oder 'hu' (je Person auf dem Server gespeichert, zusätzlich im Gerät)
  let lang = (() => { try { return localStorage.getItem('team-lang') === 'hu' ? 'hu' : 'de'; } catch (e) { return 'de'; } })();
  const setLang = (l) => { lang = l === 'hu' ? 'hu' : 'de'; try { localStorage.setItem('team-lang', lang); } catch (e) { /* egal */ } document.documentElement.lang = lang; };
  document.documentElement.lang = lang;
  const WD_DE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WDL_DE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const WD_HU = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
  const WDL_HU = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
  const WD = new Proxy([], { get: (_, k) => (lang === 'hu' ? WD_HU : WD_DE)[k] });
  const WDL = new Proxy([], { get: (_, k) => (lang === 'hu' ? WDL_HU : WDL_DE)[k] });
  // ---- Ungarisch: Übersetzung der fertigen Oberfläche (Texte, Platzhalter, Beschriftungen) ----
  // Wörterbuch und Muster stehen in i18n-hu.js
  const HU = (window.STRAUSS_HU && window.STRAUSS_HU.dict) || {};
  const HU_PATTERNS = (window.STRAUSS_HU && window.STRAUSS_HU.patterns) || [];
  const HU_KNOWN = new Set(Object.values(HU)); // schon Ungarisch (z. B. Checkliste vom Server)
  const untranslated = new Set();
  function tr(text) {
    if (lang !== 'hu' || !text) return text;
    const trimmed = text.trim();
    if (!trimmed || !/[A-Za-zÄÖÜäöüß]/.test(trimmed)) return text;
    const key = trimmed.replace(/\s+/g, ' ');
    let out = HU[key];
    if (out == null) {
      // Teile wie „Heute · Check-out“ einzeln nachschlagen, danach Muster (Datum, Uhrzeit, Namen)
      out = key.split(' · ').map((seg) => (HU[seg] != null ? HU[seg] : seg)).join(' · ');
      for (const [re, rep] of HU_PATTERNS) out = out.replace(re, rep);
      if (out === key && !HU_KNOWN.has(key)) untranslated.add(key);
    }
    const lead = text.match(/^\s*/)[0], tail = text.match(/\s*$/)[0];
    return lead + out + tail;
  }
  function translate(root) {
    if (lang !== 'hu' || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      if (n.parentElement && n.parentElement.closest('[data-no-tr], code, .code, .big')) continue;
      const next = tr(n.nodeValue);
      if (next !== n.nodeValue) n.nodeValue = next;
    }
    for (const el of root.querySelectorAll('[placeholder], [aria-label], [title]')) {
      for (const a of ['placeholder', 'aria-label', 'title']) if (el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a)));
    }
  }
  window.__untranslated = untranslated; // für die Prüfung der Übersetzung
  const utc = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (iso, n) => { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const two = (n) => String(n).padStart(2, '0');
  const fmt = (iso) => { const d = utc(iso); return `${WD[d.getUTCDay()]}, ${two(d.getUTCDate())}.${two(d.getUTCMonth() + 1)}.`; };
  const fmtLong = (iso) => { const d = utc(iso); return `${WDL[d.getUTCDay()]}, ${two(d.getUTCDate())}.${two(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`; };
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + (lang === 'hu' ? '' : ' Uhr') : '–';
  const clock = (iso) => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const duration = (a, b) => { const m = Math.round((Date.parse(b) - Date.parse(a)) / 60000); return `${Math.floor(m / 60)}:${two(m % 60)} ${lang === 'hu' ? 'óra' : 'Std.'}`; };
  const ADMIN = location.pathname.replace(/\/+$/, '') === '/admin';
  const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

  // ---- Anmeldung: Sitzung im Browser merken ---------------------------------
  const params = new URLSearchParams(location.search);
  const store = {
    get() { try { return localStorage.getItem('team-auth'); } catch (e) { return null; } },
    set(v) { try { v ? localStorage.setItem('team-auth', v) : localStorage.removeItem('team-auth'); } catch (e) { /* ohne Speicher */ } },
  };
  let auth = store.get();
  if (params.get('u') && params.get('k')) { // Link aus der Push-Nachricht
    auth = params.get('u') + '.' + params.get('k');
    store.set(auth);
    history.replaceState(null, '', location.pathname);
  }
  const photoUrl = (id) => `/api/photos/${encodeURIComponent(id)}?a=${encodeURIComponent(auth)}`;

  let data = null;
  let newCode = null;            // gerade erzeugter Code (nur einmal anzeigen)
  let editPerson = null;         // Person, deren Name bearbeitet wird
  let editTask = null;           // manuelle Reinigung in Bearbeitung
  let periodTask = null;         // Reinigung mit offenem Zeitraum-Formular
  let doneTask = null;           // Reinigung mit offenem „Beenden“-Formular (Checkliste, Schlüssel)
  const shownCodes = {};         // abgerufene Zugangscodes je Reinigung (nur im Speicher, verschwinden automatisch)
  let codeEditor = null;         // Admin: Zugangscodes bearbeiten
  let supplyTask = null;
  let moveTask = null;           // Admin: Reinigung auf anderen Tag legen
  let aptNoteTask = null;        // Admin: Übergabe-Notiz der Wohnung bearbeiten         // Reinigung mit offenem „Knapp melden“-Formular
  let lockTimer = null;
  const openForms = new Set();   // Reinigungen mit offenem Hinweis-Formular
  const pending = {};            // ausgewählte, noch nicht gesendete Fotos je Reinigung
  let toastTimer;
  function toast(text) {
    $('toast').textContent = tr(text);
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
  }

  async function api(path, method, body, noAuth) {
    const headers = {};
    if (!noAuth && auth) headers.Authorization = 'Bearer ' + auth;
    let payload = body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    let res;
    try {
      res = await fetch(path, { method: method || 'GET', headers, body: payload });
    } catch (e) { // kein Netz
      online = false;
      throw Object.assign(new Error(lang === 'hu' ? 'Nincs internetkapcsolat' : 'Keine Internetverbindung'), { offline: true });
    }
    online = true;
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || 'Fehler ' + res.status + ' – bitte erneut versuchen'), { status: res.status, retryAfter: json.retryAfter, blocked: json.blocked });
    return json;
  }

  // Beim automatischen Aktualisieren nichts überschreiben, was gerade bearbeitet wird
  const busyEditing = () => !!doneTask || !!(document.activeElement && document.activeElement.matches && document.activeElement.matches('[data-cat-input]')) || openForms.size > 0 || !!editPerson || !!editTask || !!codeEditor || !!document.querySelector('#app [data-dirty]')
    || !$('gallery').hidden || !$('modal').hidden || (document.activeElement && document.activeElement.tagName === 'SELECT');

  // ---- Offline: letzte Übersicht im Gerät merken, Aktionen zwischenspeichern und später senden ----
  let online = navigator.onLine !== false;
  const local = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* voll/gesperrt */ } },
  };
  let queue = local.get('team-outbox', []);
  const QUEUEABLE = new Set(['confirm', 'lead-confirm', 'start', 'done', 'supplies']);
  const saveCache = () => { if (data && auth) local.set('team-cache', { auth, data: { ...data, log: undefined } }); };

  function applyLocal(id, action, body) {
    const t = (data.tasks || []).find((x) => x.id === id);
    if (!t) return;
    const iso = new Date(body.at || Date.now()).toISOString();
    if (action === 'confirm') t.staffConfirmedAt = iso;
    if (action === 'lead-confirm') t.leadConfirmedAt = iso;
    if (action === 'start') t.startedAt = iso;
    if (action === 'done') Object.assign(t, { status: 'erledigt', doneAt: iso, keysInBox: body.keysInBox, overdue: null });
    const items = action === 'supplies' ? body.items : action === 'done' ? body.supplies : null;
    if (items) t.supplies = [...new Set([...(t.supplies || []), ...items])];
    saveCache();
  }

  /** Aktion zu einer Reinigung senden – ohne Netz im Gerät merken und später automatisch senden */
  async function sendAction(id, action, body, message) {
    body = body || {};
    if (action === 'start' || action === 'done') body.at = body.at || Date.now();
    try {
      update(await api(`/api/tasks/${encodeURIComponent(id)}/${action}`, 'POST', body));
      if (message) toast(message);
    } catch (e) {
      if (!e.offline || !QUEUEABLE.has(action)) throw e;
      queue.push({ id, action, body });
      local.set('team-outbox', queue);
      applyLocal(id, action, body);
      render();
      toast(lang === 'hu' ? 'Offline mentve – automatikusan elküldjük, amint lesz internet' : 'Offline gespeichert – wird automatisch gesendet, sobald wieder Netz da ist');
    }
  }

  let flushing = false;
  async function flush() {
    if (flushing || !queue.length || !auth) return;
    flushing = true;
    let sent = 0;
    try {
      while (queue.length) {
        const q = queue[0];
        try {
          data = Object.assign({}, data, await api(`/api/tasks/${encodeURIComponent(q.id)}/${q.action}`, 'POST', q.body));
          sent++;
        } catch (e) {
          if (e.offline) break;
          toast((lang === 'hu' ? 'Nem sikerült elküldeni: ' : 'Nicht übertragen: ') + e.message);
        }
        queue.shift();
        local.set('team-outbox', queue);
      }
    } finally {
      flushing = false;
    }
    if (sent) { saveCache(); if (!busyEditing()) render(); toast(lang === 'hu' ? 'Offline rögzített adatok elküldve ✓' : 'Offline Erfasstes wurde gesendet ✓'); }
  }
  window.addEventListener('online', () => { online = true; flush().then(() => refresh()); });
  window.addEventListener('offline', () => { online = false; if (data) render(); });
  const offlineBanner = () => (!online || queue.length ? `<div class="offline" role="status">${!online
    ? (lang === 'hu' ? '📴 Offline – az utoljára betöltött állapot látható.' : '📴 Offline – letzter geladener Stand.') : ''}
    ${queue.length ? (lang === 'hu' ? ` ${queue.length} művelet vár küldésre.` : ` ${queue.length} Aktion(en) warten auf Versand.`) : ''}</div>` : '');

  async function refresh(force) {
    if (!auth) return showLogin();
    if (!force && busyEditing()) return;
    await flush();
    try {
      data = Object.assign({}, data, await api('/api/me'));
      if (data.lang && data.lang !== lang) setLang(data.lang);
      saveCache();
      if (ADMIN && data.user.role !== 'owner') return showLogin();
      if (view === 'calendar') { // Kalender bleibt offen, nur Kopfzeile aktualisieren
        renderWho();
        if (!cal) openCalendar(false).catch((e) => toast(e.message));
        return;
      }
      render();
    } catch (e) {
      if (e.status === 401) { store.set(null); auth = null; local.set('team-cache', null); return showLogin(); }
      if (e.offline) {
        const cached = local.get('team-cache', null);
        if (!data && cached && cached.auth === auth) data = cached.data;
        if (data) return render();
      }
      toast(e.message);
    }
  }
  function update(next) { data = Object.assign({}, data, next); saveCache(); render(); }

  // ---- Anmeldung --------------------------------------------------------------
  function showLogin() {
    $('who').innerHTML = '';
    clearInterval(lockTimer);
    if (ADMIN) {
      $('app').innerHTML = `
      <form class="panel login" id="admin-login">
        <img class="logo" src="/logo.png" alt="Apartments Strauss">
        <h1 style="margin-bottom:12px">Admin-Notzugang</h1>
        <label class="field" style="text-align:left">Passwort <input id="admin-pw" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button class="primary" type="submit">Anmelden</button></div>
        <p class="meta hint"><a href="/">Zur Anmeldung mit Code</a></p>
      </form>`;
      $('admin-pw').focus();
      return;
    }
    $('app').innerHTML = `<div class="panel login"><img class="logo" src="/logo.png" alt="Apartments Strauss"><p class="meta">${esc(tr('Wird geladen …'))}</p></div>`;
    // Erst beim Server nachfragen, ob von hier überhaupt eine Eingabe erlaubt ist (Sperre gilt je Adresse, auch nach Neuladen)
    api('/api/login-status', 'GET', null, true)
      .then((st) => (st.blocked ? showBlocked() : st.wait ? showLocked(st.wait) : showCodeInput(st.left)))
      .catch(() => showCodeInput(3));
  }

  const langButton = () => `<p style="margin-top:14px"><button type="button" class="lang" data-lang="${lang === 'hu' ? 'de' : 'hu'}">${lang === 'hu' ? '🇩🇪 Deutsch' : '🇭🇺 Magyar'}</button></p>`;

  function showCodeInput(left, message) {
    $('app').innerHTML = `
      <form class="panel login" id="code-login">
        <img class="logo" src="/logo.png" alt="Apartments Strauss">
        <p class="meta" style="margin-bottom:10px">Bitte persönlichen 6-stelligen Code eingeben</p>
        <input id="code" class="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Persönlicher Code" required>
        <p class="meta hint" id="login-status" role="status">${esc(message || (left != null && left < 3 ? (left === 1 ? 'Noch 1 Versuch' : `Noch ${left} Versuche`) : ''))}</p>
        ${langButton()}
      </form>`;
    translate($('app'));
    $('code').focus();
  }

  /** Gesperrt: kein Eingabefeld, nur Countdown; danach neu beim Server nachfragen */
  function showLocked(seconds) {
    clearInterval(lockTimer);
    let left = seconds;
    const draw = () => {
      const m = Math.floor(left / 60), sec = left % 60;
      $('app').innerHTML = `<div class="panel login">
        <img class="logo" src="/logo.png" alt="Apartments Strauss">
        <h1 style="margin:8px 0">🔒 ${esc(tr('Anmeldung gesperrt'))}</h1>
        <p class="meta">${esc(tr('Zu viele falsche Codes. Bitte warten:'))}</p>
        <div class="code" style="margin:10px 0">${m}:${two(sec)}</div>
        <p class="meta">${esc(tr('Danach ist 1 weiterer Versuch möglich. Code vergessen? Bitte Apartments Strauss anrufen.'))}</p>
        ${langButton()}</div>`;
    };
    draw();
    lockTimer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(lockTimer); return showLogin(); }
      if (document.querySelector('#app .login .code')) document.querySelector('#app .login .code').textContent = `${Math.floor(left / 60)}:${two(left % 60)}`;
      else draw();
    }, 1000);
  }

  function showBlocked() {
    clearInterval(lockTimer);
    $('app').innerHTML = `<div class="panel login">
      <img class="logo" src="/logo.png" alt="Apartments Strauss">
      <h1 style="margin:8px 0">⛔ ${esc(tr('Anmeldung gesperrt'))}</h1>
      <p>${esc(tr('Von diesem Gerät wurden zu oft falsche Codes eingegeben. Bitte Apartments Strauss anrufen – der Zugang kann dort wieder freigeschaltet werden.'))}</p>
      ${langButton()}</div>`;
  }

  async function tryCode() {
    const input = $('code');
    const code = input.value.replace(/\D/g, '');
    if (code.length !== 6 || input.disabled) return;
    input.disabled = true;
    $('login-status').textContent = tr('Anmeldung …');
    try {
      const res = await api('/api/login', 'POST', { code }, true);
      auth = res.session; store.set(auth);
      if (lang === 'hu') await api('/api/lang', 'POST', { lang }).catch(() => {}); // auf dem Anmeldebildschirm gewählt
      await refresh(true);
    } catch (err) {
      if (err.status === 403 && err.blocked) return showBlocked();
      if (err.status === 429) return showLocked(err.retryAfter || 60);
      input.value = '';
      $('login-status').textContent = tr(err.message);
      input.disabled = false;
      input.focus();
    }
  }

  // ---- Bausteine ------------------------------------------------------------
  const people = () => [...(data.leads || []), ...(data.staff || [])];
  function nameOf(id) {
    if (!id) return '';
    if (id === data.user.id) return data.user.name;
    const p = people().find((x) => x.id === id);
    return p ? p.name : (id.startsWith('buero') || id === 'owner' ? 'Apartments Strauss' : 'Unbekannt');
  }
  function dayWord(iso) {
    if (iso === data.today) return 'Heute';
    if (iso === addDays(data.today, 1)) return 'Morgen';
    if (iso === addDays(data.today, -1)) return 'Gestern';
    return fmt(iso);
  }
  const isActive = (t) => t.status === 'offen' || t.status === 'bestätigt';
  // Zeitraum: Reinigung darf vom Check-out-Tag bis latestDate stattfinden
  const lastDay = (t) => (t.latestDate && t.latestDate > t.date ? t.latestDate : t.date);
  const onDay = (t, d) => t.date === d || (isActive(t) && t.date < d && lastDay(t) >= d);
  const periodLabel = (t) => `${fmt(t.date)} – ${fmt(lastDay(t))}`;
  const role = () => data.user.role;

  /** Ein klarer Status mit Icon (statt vieler Einzel-Hinweise) */
  function statusLine(t) {
    const r = role();
    if (t.status === 'storniert') return '<span class="status gone">✖️ Entfällt</span>';
    if (t.status === 'erledigt') return `<span class="status ok">✅ Fertig${t.doneAt ? ' um ' + clock(t.doneAt) : ''}${t.startedAt && t.doneAt ? ' · ' + duration(t.startedAt, t.doneAt) : ''}</span>`;
    if (t.overdue === 'start') return '<span class="status bad">⏰ Überfällig – noch nicht gestartet</span>';
    if (t.overdue === 'finish') return `<span class="status bad">⏰ Überfällig – ${t.startedAt ? 'noch nicht fertig' : 'noch nicht gestartet'}</span>`;
    if (t.overdue === 'past') return '<span class="status bad">⏰ Überfällig – nicht erledigt</span>';
    if (t.startedAt) return `<span class="status run">▶️ Läuft seit ${clock(t.startedAt)}</span>`;
    if (!t.assignedTo) return `<span class="status wait">👤 ${r === 'staff' ? 'Noch offen' : 'Noch niemand eingeteilt'}</span>`;
    if (!t.staffConfirmedAt) return t.assignedTo === data.user.id ? '<span class="status new">🆕 Bitte annehmen</span>'
      : `<span class="status wait">⏳ Wartet auf ${esc(nameOf(t.assignedTo))}</span>`;
    return `<span class="status ok">👍 Angenommen${r === 'staff' ? '' : ' von ' + esc(nameOf(t.assignedTo))}</span>`;
  }

  /** Nur die wichtigsten Zusatz-Hinweise */
  function chips(t) {
    const out = [];
    const r = role();
    if (t.status === 'erledigt') {
      if (t.keysInBox === false) out.push(t.keysResolvedAt ? '<span class="chip yes">🔑 Schlüssel geklärt</span>' : '<span class="chip alert">🔑 Schlüssel fehlen!</span>');
    }
    if (isActive(t)) {
      if (t.prevDate && !t.staffConfirmedAt) out.push(`<span class="chip alert">⚠️ Neuer Termin (vorher ${esc(fmt(t.prevDate))})</span>`);
      if (t.sameDayArrival && !t.nextBooking) out.push('<span class="chip alert">🔁 Neue Gäste kommen am selben Tag</span>');
      if (lastDay(t) > t.date) out.push(`<span class="chip period">📅 Darf bis ${esc(fmt(lastDay(t)))}</span>`);
      const req = t.periodRequest;
      if (req && req.status === 'offen') out.push(`<span class="chip wait">📨 Späterer Tag beantragt (bis ${esc(fmt(req.until))})</span>`);
      if (req && req.status === 'abgelehnt' && r !== 'owner') out.push('<span class="chip alert">✖️ Späterer Tag abgelehnt</span>');
      if (t.checkoutDate && t.checkoutDate !== t.date) out.push(`<span class="chip wait">🔀 Verschoben (Check-out ${esc(fmt(t.checkoutDate))})</span>`);
      if (t.lateAlerted && t.status === 'offen' && r === 'owner') out.push('<span class="chip alert">⏳ Nicht rechtzeitig angenommen</span>');
    }
    if (r === 'owner') {
      if (t.needsBlock) out.push(`<span class="chip alert">🚫 In Smoobu blockieren: ${esc(fmt(t.needsBlock.from))} – ${esc(fmt(t.needsBlock.to))}</span>`);
      if (t.releaseBlock) out.push(`<span class="chip alert">🔓 Blockierung in Smoobu aufheben: ${esc(fmt(t.releaseBlock.from))} – ${esc(fmt(t.releaseBlock.to))}</span>`);
      if ((t.supplies || []).length) out.push(`<span class="chip wait">🛒 ${t.supplies.length} fehlt</span>`);
    }
    if (t.manual) out.push('<span class="chip manual">✋ Extra-Reinigung</span>');
    return out.join('');
  }

  function reportHtml(t, r) {
    const mine = r.by === data.user.id || role() === 'owner';
    const author = r.byRole === 'owner' ? 'Apartments Strauss' : nameOf(r.by);
    const ids = r.photos.join(',');
    return `<div class="report${r.byRole === 'owner' ? ' owner' : ''}${r.resolved ? ' resolved' : ''}">
      <div class="meta"><b>${r.final ? 'Abschlussbericht · ' : r.byRole === 'owner' ? 'Hinweis von ' : ''}${esc(author)}</b> · ${fmtTime(r.at)}${r.resolved && !r.final ? ' · behoben' : ''}</div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ''}
      ${r.photos.length ? `<div class="thumbs">${r.photos.map((p, i) => `<div class="thumb">
        <button type="button" data-gallery="${esc(ids)}" data-index="${i}" aria-label="${p.startsWith('v') ? 'Video' : 'Foto'} ${i + 1} öffnen">${p.startsWith('v')
          ? '<span class="vthumb">▶ Video</span>' : `<img src="${photoUrl(p)}" alt="" loading="lazy">`}</button>
        ${mine ? `<button type="button" class="x" data-delphoto="${esc(p)}" data-task="${esc(t.id)}" data-report="${esc(r.id)}" aria-label="Foto löschen">✕</button>` : ''}
      </div>`).join('')}</div>` : ''}
      ${role() === 'owner' && !r.resolved && r.byRole !== 'owner' ? `<div class="actions"><button class="small" data-resolve="${esc(t.id)}" data-report="${esc(r.id)}">Als behoben markieren</button></div>` : ''}
    </div>`;

  function reportForm(t) {

    return `<form class="report-form" data-report-form="${esc(t.id)}">
      <label class="field">${label}

      ? `<video src="${p.url}" muted playsinline preload="metadata"></video>` : `<img src="${p.url}" alt="Ausgewähltes Foto ${i + 1}">`}</button>
      <button type="button" class="x" data-unpick="${esc(taskId)}" data-index="${i}" aria-label="Entfernen">✕</button></div>`).join('');
  }


  function editForm(t) {
    return `<form class="report-form" data-edit-task="${esc(t.id)}">
      <div class="form-grid">
        <label class="field">Neues Datum <input type="date" name="date" value="${esc(t.date)}" min="${data.today}" required></label>
        <label class="field">Hinweis <input name="note" value="${esc(t.note || '')}" maxlength="500"></label>
      </div>
      <div class="actions"><button class="primary" type="submit">Speichern und Team informieren</button><button type="button" data-edit-cancel>Abbrechen</button></div>
    </form>`;
  }

  const shortGuests = (b) => (!b.adults && !b.children ? '' : `${b.adults || 0}${b.children ? '+' + b.children : ''} P.`);
  /** Nächste Anreise in der Wohnung mit erwarteter Gästezahl (zur Vorbereitung) */
  /** Lage kurz: „Berliner Platz 1c · 9. OG rechts rechts · WE 061 grau“ */
  function shortLoc(l) {
    if (!l) return '';
    let a = (l.address || '').trim(), d = (l.description || '').trim();
    const we = d.match(/\(\s*WE\s*([^)]*?)\s*\)/i);
    if (we) d = d.replace(we[0], '').trim();
    d = d.replace(/(\d+)\.\s*OG/g, '$1. OG').replace(/\s{2,}/g, ' ');
    const weText = we ? 'WE ' + we[1].replace(/\s*-\s*/, ' ') : '';
    if (weText) a = a.replace(/\s*\(\d+\)\s*$/, '');
    return [a, d, weText].filter(Boolean).join(' · ');
  }
  function nextGuests(t) {
    if (!isActive(t)) return '';
    const n = t.nextBooking;
    if (!n) return '';
    const when = ['Heute', 'Morgen'].includes(dayWord(n.arrival)) ? `<b>${dayWord(n.arrival)}</b>` : `<b>${fmt(n.arrival)}</b>`;
    return `<div class="next-guests${t.sameDayArrival ? ' same' : ''}">${t.sameDayArrival ? '🔁' : '🧳'} Nächste Gäste: ${when}${n.checkIn ? ` ab ${esc(n.checkIn)} Uhr` : ''}${n.guests ? ` · <b>${esc(n.guests)}</b>` : ''}</div>`;
  }

  function codesBox(c) {
    return `<div class="codes"><b>Zugangscodes · ${esc(c.apartmentName)}</b>
      ${c.description ? `<div class="meta" style="margin-top:4px">📍 ${esc(c.description)}</div>` : ''}
      <div class="row2">
        <div><div class="meta">Gäste-Code</div><div class="big">${esc(c.guest || '–')}</div></div>
        <div><div class="meta">Service-Schlüsselbox</div><div class="big">${esc(c.service || '–')}</div></div>
      </div>
      <p class="meta" style="margin-top:6px">Bitte nicht weitergeben. Wird nach 3 Minuten automatisch ausgeblendet.</p></div>`;

  // ---- Admin: Zugangscodes je Wohnung -----------------------------------------
  function codeEditorHtml() {
    if (!codeEditor) {
      return `<p class="meta">Gäste-Code, Code der Service-Schlüsselbox und Lagebeschreibung je Wohnung. Werden verschlüsselt gespeichert;
        das Reinigungsteam sieht sie per Knopf „🔑 Zugangscodes“ bei der Reinigung (jeder Abruf steht im Verlauf).</p>
        <div class="actions"><button class="primary" data-code-editor>Codes anzeigen / bearbeiten</button></div>`;
    }
    const rows = codeEditor.apartments.map((a) => { const c = codeEditor.codes[a.id] || {};
      return `<tr><td><b>${esc(a.name)}</b>${c.builtin ? '<div class="meta">fest hinterlegt</div>' : c.updatedAt ? `<div class="meta">geändert ${fmtTime(c.updatedAt)}</div>` : ''}</td>
        <td><input id="cg-${esc(a.id)}" value="${esc(c.guest || '')}" inputmode="numeric" aria-label="Gäste-Code ${esc(a.name)}"></td>
        <td><input id="cs-${esc(a.id)}" value="${esc(c.service || '')}" inputmode="numeric" aria-label="Service-Code ${esc(a.name)}"></td>
        <td><input id="cd-${esc(a.id)}" value="${esc(c.description || '')}" aria-label="Beschreibung ${esc(a.name)}"></td></tr>`; }).join('');
    return `<div class="panel">
        <label class="field">Tabelle einfügen (z. B. aus Excel/Word: Wohnung, Gäste, Service, Beschreibung)
          <textarea id="code-import" rows="4" placeholder="#EINS | Musterstraße 1&#9;1234&#9;5678&#9;EG links"></textarea></label>
        <div class="actions"><button data-code-import>In die Liste übernehmen</button></div>
        <div id="code-import-result" class="meta"></div>
      </div>
      ${(() => { const none = codeEditor.apartments.filter((a) => !codeEditor.codes[a.id]);
        return none.length ? `<div class="notice bad"><span><b>Ohne Codes (${none.length}):</b> ${none.map((a) => esc(a.name)).join(', ')}
          – bitte unten eintragen oder die genauen Namen an den Support geben.</span></div>` : '<p class="meta">Alle Wohnungen haben Codes ✓</p>'; })()}
      <div class="panel scroll"><table class="code-table">
        <tr><th>Wohnung</th><th>Gäste</th><th>Service</th><th>Beschreibung</th></tr>${rows ||
          '<tr><td colspan="4" class="meta">Wohnungen erscheinen nach dem ersten Abgleich mit Smoobu.</td></tr>'}</table></div>
      <div class="actions"><button class="primary" data-code-save>Codes speichern</button><button data-code-close>Schließen</button></div>`;
  }

  /** Eingefügte Tabelle den Wohnungen zuordnen (Kürzel wie „#EINS“ oder Adresse) */
  function importCodes(text) {
    const norm = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
    const token = (x) => norm(String(x).split('|')[0]);
    const address = (x) => norm(String(x).split('|').slice(1).join('|'));
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const done = [], missing = [];
    for (const line of lines) {
      const cols = (line.includes('\t') ? line.split('\t') : line.split(/\s{2,}/)).map((c) => c.trim());
      if (cols.length < 2 || /^wohnung$/i.test(cols[0])) continue;
      const [name, guest, service, ...rest] = cols;
      const apt = codeEditor.apartments.find((a) => norm(a.name) === norm(name))
        || codeEditor.apartments.find((a) => token(a.name) && token(a.name) === token(name))
        || (address(name) && codeEditor.apartments.find((a) => norm(a.name).includes(address(name))));
      if (!apt) { missing.push(name); continue; }
      $('cg-' + apt.id).value = guest || '';
      $('cs-' + apt.id).value = service || '';
      $('cd-' + apt.id).value = rest.join(' ').trim();
      done.push(apt.name);
    }
    $('code-import-result').innerHTML = `${done.length} Wohnung(en) übernommen – bitte prüfen und „Codes speichern“ tippen.`
      + (missing.length ? `<br><b style="color:var(--bad)">Nicht zugeordnet:</b> ${missing.map(esc).join(', ')} – bitte unten von Hand eintragen.` : '');
  }

  const itemLabel = (item) => (lang === 'hu' && item.hu) || item.de;

  /** „Was ist knapp?“ – Artikel zum Antippen; bereits gemeldete sind markiert */
  function supplyGrid(t, name) {
    const reported = new Set(t.supplies || []);
    const custom = (t.supplies || []).filter((id) => id.startsWith('x:'));
    return `<div class="supply-grid">${(data.supplyItems || []).map((s) => reported.has(s.id)
      ? `<label class="reported"><input type="checkbox" checked disabled> ${esc(itemLabel(s))} · gemeldet</label>`
      : `<label><input type="checkbox" name="${name}" value="${esc(s.id)}"> ${esc(itemLabel(s))}</label>`).join('')}
      ${custom.map((id) => `<label class="reported"><input type="checkbox" checked disabled> ${esc(id.slice(2))} · gemeldet</label>`).join('')}</div>
      <label class="field" style="margin-top:8px">✏️ Sonstiges (nicht in der Liste)
        <input name="${name}-other" maxlength="200" placeholder="z. B. Föhn defekt, Kerzen, Spülbürste"></label>`;
  }
  /** Angetippte Artikel + freie Eingabe (mehrere mit Komma getrennt) */
  function pickedSupplies(form, name) {
    const items = [...form.querySelectorAll(`input[name=${name}]:checked`)].map((i) => i.value);
    const other = form.elements[name + '-other'];
    if (other && other.value.trim()) for (const x of other.value.split(/[,;\n]/)) if (x.trim()) items.push('x:' + x.trim());
    return items;
  }
  function supplyForm(t) {

      ${supplyGrid(t, 'item')}
      <div class="actions"><button class="primary" type="submit">Melden</button><button type="button" data-supply-close>Abbrechen</button></div>
    </form>`;
  }

  /** Admin: Reinigung (auch aus Smoobu) auf einen anderen Tag legen */
  function moveForm(t) {

    const min = checkout > data.today ? checkout : data.today;

      <div class="form-grid"><label class="field">Reinigung am <input type="date" name="date" value="${esc(t.date)}" min="${esc(min)}" required></label>

  /** Admin: Übergabe-Notiz der Wohnung – steht bei jeder Reinigung dieser Wohnung */
  function aptNoteForm(t) {

        <textarea name="text" rows="3" maxlength="1000" placeholder="z. B. Kinderbett aufgebaut lassen · Heizung im Bad klemmt · Schlüssel für Keller im Schrank">${esc(t.aptNote || '')}</textarea></label>
