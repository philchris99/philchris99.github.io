  // ---- Ereignisse -----------------------------------------------------------
  document.addEventListener('input', (e) => {
    if (e.target.id === 'code') {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      if (e.target.value.length === 6) tryCode(); // sofort weiter, ohne Enter
      return;
    }
    if (e.target.closest('#app form')) e.target.setAttribute('data-dirty', '');
  });

  document.addEventListener('change', (e) => {
    const id = e.target.dataset.photoInput;
    if (!id) return;
    const list = pending[id] = pending[id] || [];
    for (const f of e.target.files) {
      if (list.length >= 5) { toast('Höchstens 5 Fotos pro Meldung'); break; }
      list.push({ file: f, url: URL.createObjectURL(f) });
    }
    e.target.value = '';
    redrawPreviews(id);
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    if (form.id === 'code-login') return tryCode();
    const submit = form.querySelector('[type=submit]');
    if (submit) submit.disabled = true;
    const label = submit && submit.textContent;
    try {
      if (form.id === 'admin-login') {
        const res = await api('/api/admin-login', 'POST', { password: $('admin-pw').value }, true);
        auth = res.session; store.set(auth);
        await refresh(true);
      } else if (form.dataset.reportForm) {
        const id = form.dataset.reportForm;
        const photos = pending[id] || [];
        const text = form.querySelector('textarea').value.trim();
        if (!text && !photos.length) throw new Error('Bitte einen Text eingeben oder ein Foto auswählen');
        submit.textContent = photos.length ? 'Fotos werden vorbereitet …' : 'Wird gesendet …';
        const body = new FormData();
        body.append('text', text);
        for (const p of photos) body.append('photo', await compress(p.file), 'foto.jpg');
        submit.textContent = 'Wird gesendet …';
        const next = await api(`/api/tasks/${encodeURIComponent(id)}/report`, 'POST', body);
        photos.forEach((p) => URL.revokeObjectURL(p.url));
        delete pending[id];
        openForms.delete(id);
        update(next);
        toast(role() === 'owner' ? 'Hinweis gesendet – das Team wurde informiert' : 'Meldung gesendet – danke!');
      } else if (form.dataset.editTask) {
        const next = await api(`/api/tasks/${encodeURIComponent(form.dataset.editTask)}/edit`, 'POST', { date: form.elements.date.value, note: form.elements.note.value });
        editTask = null;
        update(next);
        toast('Gespeichert – das Team wurde informiert');
      } else if (form.dataset.doneForm) {
        const choice = form.elements.keys.value;
        if (choice !== '1' && choice !== '0') throw new Error('Bitte angeben, ob die Gästeschlüssel in der Box sind');
        const keysInBox = choice === '1';
        update(await api(`/api/tasks/${encodeURIComponent(form.dataset.doneForm)}/done`, 'POST', { keysInBox, keysNote: form.elements.note.value }));
        doneTask = null;
        render();
        toast(keysInBox ? 'Als erledigt gemeldet – danke!' : 'Erledigt gemeldet – Apartments Strauss wurde sofort wegen der Schlüssel benachrichtigt');
      } else if (form.dataset.periodForm) {
        const id = form.dataset.periodForm;
        const until = form.elements.until.value;
        if (role() === 'owner') {
          update(await api(`/api/tasks/${encodeURIComponent(id)}/period`, 'POST', { until }));
          toast('Zeitraum festgelegt – das Team wurde informiert');
        } else {
          update(await api(`/api/tasks/${encodeURIComponent(id)}/period-request`, 'POST', { until, reason: form.elements.reason.value }));
          toast('Antrag gesendet – Apartments Strauss wurde benachrichtigt');
        }
        periodTask = null;
        render();
      } else if (form.id === 'manual-form') {
        update(await api('/api/manual', 'POST', { apartmentId: $('m-apt').value, date: $('m-date').value, note: $('m-note').value }));
        toast('Reinigung eingetragen – Reinigungsleitung wurde benachrichtigt');
      } else if (form.id === 'owner-code') {
        update(await api('/api/owner-code', 'POST', { code: $('owner-code-input').value }));
        toast('Admin-Code gespeichert – ab jetzt reicht der Code auf der Startseite');
      } else if (form.dataset.addPerson) {
        const res = await api('/api/team', 'POST', { name: form.elements.name.value, role: form.dataset.addPerson });
        newCode = res.newCode;
        update(res);
        document.getElementById('team').scrollIntoView();
      } else if (form.dataset.editPerson) {
        const res = await api(`/api/team/${form.dataset.editPerson}`, 'POST', { name: form.elements.name.value });
        editPerson = null;
        update(res);
        toast('Gespeichert');
      } else if (form.id === 'reset-form') {
        if ($('reset-confirm').value.trim() !== 'ZURÜCKSETZEN') throw new Error('Bitte genau ZURÜCKSETZEN eingeben');
        submit.textContent = 'Wird zurückgesetzt …';
        const next = await api('/api/reset', 'POST', { confirm: 'ZURÜCKSETZEN' });
        openForms.clear();
        update(next);
        window.scrollTo(0, 0);
        toast(`Zurückgesetzt – ${next.summary.bookings} Buchungen neu aus Smoobu geladen`);
      }
    } catch (err) {
      toast(err.message);
      if (submit && submit.isConnected) { submit.disabled = false; submit.textContent = label; }
    }
  });

  /** Zweimal tippen zur Sicherheit */
  function armed(b, text) {
    if (b.classList.contains('armed')) return true;
    const original = b.textContent;
    b.classList.add('armed', 'danger');
    b.textContent = text;
    setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = original; } }, 4000);
    return false;
  }
  const taskAction = async (id, action, body, message) => {
    update(await api(`/api/tasks/${encodeURIComponent(id)}/${action}`, 'POST', body));
    if (message) toast(message);
  };

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || (b.type === 'submit' && b.closest('form')) || b.closest('#gallery')) return;
    const d = b.dataset;
    try {
      if (d.jump) {
        const el = document.getElementById(d.jump);
        if (el) { if (el.tagName === 'DETAILS') el.open = true; const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      } else if (d.openCalendar !== undefined) {
        calFrom = null;
        await openCalendar(true);
      } else if (d.closeCalendar !== undefined) {
        closeCalendar();
      } else if (d.calShift) {
        calFrom = Number(d.calShift) === 0 ? addDays(data.today, -3) : addDays(calFrom, Number(d.calShift));
        await openCalendar(false);
      } else if (d.calBooking) {
        bookingDetails(d.calBooking);
      } else if (d.calClean) {
        cleaningDetails(d.calClean);
      } else if (d.closeModal !== undefined) {
        closeModal();
      } else if (d.gotoTask) {
        closeModal();
        closeCalendar();
        setTimeout(() => {
          const el = document.getElementById('task-' + d.gotoTask);
          if (el) { const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
          else toast('Diese Reinigung liegt außerhalb der Übersicht (älter als 7 Tage)');
        }, 50);
      } else if (d.pushOk !== undefined) {
        update(await api('/api/push-ok', 'POST'));
        toast('Super – Push-Nachrichten sind eingerichtet');
      } else if (d.pushHelp !== undefined) {
        $('push-help').hidden = false;
      } else if (d.gallery) {
        openGallery(d.gallery.split(','), Number(d.index));
      } else if (d.unpick) {
        const list = pending[d.unpick] || [];
        const [removed] = list.splice(Number(d.index), 1);
        if (removed) URL.revokeObjectURL(removed.url);
        redrawPreviews(d.unpick);
      } else if (d.delphoto) {
        if (!armed(b, '?')) return toast('Zum Löschen nochmal auf ✕ tippen');
        await taskAction(d.task, `reports/${encodeURIComponent(d.report)}/photos/${encodeURIComponent(d.delphoto)}/delete`, null, 'Foto gelöscht');
      } else if (d.logout !== undefined) {
        store.set(null); auth = null; data = null; view = 'main'; cal = null; codeEditor = null;
        for (const k of Object.keys(shownCodes)) delete shownCodes[k];
        history.replaceState(null, '', '/');
        showLogin();
      } else if (d.leadConfirm) {
        b.disabled = true; await taskAction(d.leadConfirm, 'lead-confirm', null, 'Erhalt bestätigt');
      } else if (d.assign) {
        const sel = document.querySelector(`[data-assign-select="${CSS.escape(d.assign)}"]`);
        if (!sel || !sel.value) return toast('Bitte zuerst eine Mitarbeiterin auswählen');
        b.disabled = true;
        await taskAction(d.assign, 'assign', { to: sel.value }, `Zugewiesen an ${nameOf(sel.value)} – sie wurde benachrichtigt`);
      } else if (d.confirm) {
        b.disabled = true; await taskAction(d.confirm, 'confirm', null, 'Bestätigt – danke!');
      } else if (d.start) {
        b.disabled = true; await taskAction(d.start, 'start', null, 'Beginn erfasst');
      } else if (d.done) {
        doneTask = d.done; render();
        const f = document.querySelector(`[data-done-form="${CSS.escape(d.done)}"]`);
        if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (d.doneCancel !== undefined) {
        doneTask = null; render();
      } else if (d.keysResolved) {
        b.disabled = true;
        await taskAction(d.keysResolved, 'keys-resolved', {}, 'Als geklärt markiert');
      } else if (d.toggleReport) {
        if (openForms.has(d.toggleReport)) openForms.delete(d.toggleReport); else openForms.add(d.toggleReport);
        render();
        const ta = document.getElementById('text-' + d.toggleReport);
        if (ta) ta.focus();
      } else if (d.codes) {
        if (shownCodes[d.codes]) { delete shownCodes[d.codes]; return render(); }
        b.disabled = true;
        shownCodes[d.codes] = await api(`/api/tasks/${encodeURIComponent(d.codes)}/codes`, 'POST');
        render();
        setTimeout(() => { if (shownCodes[d.codes]) { delete shownCodes[d.codes]; render(); } }, 3 * 60 * 1000);
      } else if (d.codeEditor !== undefined) {
        codeEditor = await api('/api/access-codes');
        render();
        document.getElementById('codes').scrollIntoView();
      } else if (d.codeImport !== undefined) {
        importCodes($('code-import').value);
      } else if (d.codeSave !== undefined) {
        const entries = codeEditor.apartments.map((a) => ({ apartmentId: a.id, guest: $('cg-' + a.id).value, service: $('cs-' + a.id).value, description: $('cd-' + a.id).value }));
        b.disabled = true;
        codeEditor = await api('/api/access-codes', 'POST', { entries });
        render();
        document.getElementById('codes').scrollIntoView();
        toast('Codes gespeichert');
      } else if (d.codeClose !== undefined) {
        codeEditor = null; render();
      } else if (d.period) {
        periodTask = periodTask === d.period ? null : d.period; render();
      } else if (d.periodClose !== undefined) {
        periodTask = null; render();
      } else if (d.periodClear) {
        await taskAction(d.periodClear, 'period', { until: null }, 'Zeitraum aufgehoben – das Team wurde informiert');
        periodTask = null; render();
      } else if (d.periodDecide) {
        const input = document.getElementById('pc-' + d.periodDecide);
        const approve = d.approve === '1';
        if (!approve && !armed(b, 'Wirklich ablehnen? Nochmal tippen')) return;
        b.disabled = true;
        await taskAction(d.periodDecide, 'period-decide', { approve, comment: input ? input.value : '' },
          approve ? 'Genehmigt – das Team wurde informiert' : 'Abgelehnt – das Team wurde informiert');
      } else if (d.editTask) {
        editTask = editTask === d.editTask ? null : d.editTask; render();
      } else if (d.editCancel !== undefined) {
        editTask = null; editPerson = null; render();
      } else if (d.resolve) {
        b.disabled = true;
        await taskAction(d.resolve, `reports/${encodeURIComponent(d.report)}/resolve`, null, 'Als behoben markiert');
      } else if (d.cancel) {
        if (!armed(b, 'Wirklich absagen? Nochmal tippen')) return;
        await taskAction(d.cancel, 'cancel', null, 'Abgesagt – das Team wurde informiert');
      } else if (d.seen !== undefined) {
        update(await api('/api/seen', 'POST'));
      } else if (d.editPerson) {
        editPerson = d.editPerson; render();
      } else if (d.newcode) {
        if (!armed(b, 'Alter Code wird ungültig – nochmal tippen')) return;
        const res = await api(`/api/team/${d.newcode}/code`, 'POST');
        newCode = res.newCode; update(res);
        document.getElementById('team').scrollIntoView();
      } else if (d.remove) {
        if (!armed(b, 'Wirklich entfernen? Nochmal tippen')) return;
        update(await api(`/api/team/${d.remove}/delete`, 'POST'));
        toast('Entfernt');
      } else if (d.hideCode !== undefined) {
        newCode = null; render();
      } else if (d.sync !== undefined) {
        b.disabled = true; b.textContent = 'Gleiche ab …';
        const next = await api('/api/sync', 'POST');
        update(next);
        toast(next.summary.syncError ? next.summary.syncError : `Abgleich fertig: ${next.summary.bookings} Buchungen`);
      } else if (d.diagnose !== undefined) {
        b.disabled = true; b.textContent = 'Prüfe …';
        const res = await api('/api/diagnose', 'POST');
        b.disabled = false; b.textContent = 'Diagnose';
        $('diagnose').innerHTML = `<div class="scroll" style="margin-top:8px"><table>${res.results.map((r) => `<tr>
            <td><b>${esc(r.variant)}</b></td>
            <td>Status ${esc(r.status ?? '–')}${r.received ? ' · ' + esc(r.received) + ' erhalten' + (r.total != null ? ' von ' + esc(r.total) : '') : ''}
            ${r.topKeys && r.topKeys.length ? '<br><span class="meta">' + esc(r.topKeys.join(', ')) + '</span>' : ''}
            ${r.error ? '<br><span style="color:var(--bad)">' + esc(r.error) + '</span>' : ''}</td></tr>`).join('')}</table></div>`;
      } else if (d.test !== undefined) {
        await api('/api/test-push', 'POST');
        pushTested = true;
        render();
        toast('Test-Nachricht verschickt – bitte aufs Handy schauen');
      } else if (d.copy) {
        const text = d.copy.startsWith('code-') ? $(d.copy).textContent.replace(/\s/g, '') : $(d.copy).textContent;
        try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (err) {
          const r = document.createRange(); r.selectNodeContents($(d.copy));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }
    } catch (err) {
      toast(err.message);
      if (err.status === 401) { store.set(null); auth = null; showLogin(); } else refresh(true);
    }
  });

  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
