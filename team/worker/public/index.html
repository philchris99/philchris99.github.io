<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Team Strauß">
<meta name="theme-color" content="#2F6F5E">
<title>Team Strauß</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F6F5F2; --card: #FFFFFF; --text: #1C1C1C; --muted: #6B6B6B; --line: #E4E1DC;
  --accent: #2F6F5E; --accent-text: #FFFFFF;
  --open: #B7791F; --open-bg: #FDF3E1; --ok: #2F7D4F; --ok-bg: #E4F4EA;
  --done: #4A5568; --done-bg: #EDF0F4; --bad: #B83232; --bad-bg: #FBE7E7;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #151716; --card: #1F2221; --text: #ECECEC; --muted: #A0A4A2; --line: #333836;
    --accent: #5FB39B; --accent-text: #0E1412;
    --open: #E8B25A; --open-bg: #3A2E18; --ok: #6FCB93; --ok-bg: #173323;
    --done: #B0B8C4; --done-bg: #262B31; --bad: #F08A8A; --bad-bg: #3D1C1C;
  }
}
body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
header .row { max-width: 760px; margin: 0 auto; }
h1 { font-size: 18px; font-weight: 650; }
h2 { font-size: 15px; font-weight: 650; margin: 22px 0 8px; }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
button, input { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.small { padding: 4px 10px; font-size: 14px; }
button:disabled { opacity: .6; cursor: default; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; margin-bottom: 8px; }
.card.urgent { border-color: var(--bad); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta { color: var(--muted); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.s-offen { color: var(--open); background: var(--open-bg); }
.s-bestätigt { color: var(--ok); background: var(--ok-bg); }
.s-erledigt { color: var(--done); background: var(--done-bg); }
.s-storniert { color: var(--muted); background: var(--done-bg); text-decoration: line-through; }
.alert { color: var(--bad); background: var(--bad-bg); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.actions button { flex: 1 1 auto; }
.empty { color: var(--muted); padding: 8px 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.notice { border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
.notice.bad { color: var(--bad); background: var(--bad-bg); }
.notice.info { background: var(--card); border: 1px solid var(--line); }
code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
details summary { cursor: pointer; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 11px 15px; font-weight: 600; z-index: 10; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header><div class="row"><h1 id="title">Team Strauß</h1><span class="meta" id="who"></span></div></header>
<main id="app"><p class="empty">Wird geladen …</p></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  function fmt(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return `${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}, ${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.`;
  }
  function fmtTime(iso) {
    return iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
  }

  // Persönlicher Link: ?u=<id>&k=<token>. Bleibt in der Adresse, damit ein
  // Lesezeichen / Home-Bildschirm-Symbol angemeldet bleibt.
  const params = new URLSearchParams(location.search);
  let auth = null;
  if (params.get('u') && params.get('k')) {
    auth = params.get('u') + '.' + params.get('k');
    try { localStorage.setItem('team-auth', auth); } catch (e) { /* ohne Speicher weiter */ }
  } else {
    try { auth = localStorage.getItem('team-auth'); } catch (e) { auth = null; }
  }

  let data = null;
  let toastTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3500);
  }

  async function api(path, method) {
    const res = await fetch(path, { method: method || 'GET', headers: { Authorization: 'Bearer ' + auth } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(body.error || 'Fehler ' + res.status), { status: res.status });
    return body;
  }

  async function refresh() {
    if (!auth) return showLogin();
    try {
      const next = await api('/api/me');
      data = Object.assign({}, data, next);
      render();
    } catch (e) {
      if (e.status === 401) return showLogin();
      toast(e.message);
    }
  }

  function showLogin() {
    $('app').innerHTML = `<div class="card" style="margin-top:16px"><b>Bitte den persönlichen Link öffnen.</b>
      <p class="meta" style="margin-top:6px">Den Link bekommst du von Apartment Strauß. Tipp: nach dem Öffnen über „Teilen → Zum Home-Bildschirm“ als App ablegen.</p></div>`;
  }

  // ---- Darstellung ----------------------------------------------------------
  function badge(t) {
    if (t.status === 'offen' && t.escalated) return '<span class="badge alert">nicht bestätigt!</span>';
    const label = t.status === 'storniert' ? 'entfällt' : t.status;
    return `<span class="badge s-${esc(t.status)}">${esc(label)}</span>`;
  }

  function taskCard(t, forCleaner) {
    const isToday = t.date === data.today;
    const urgent = t.status === 'offen' && (t.escalated || isToday);
    const info = [
      isToday ? '<b>Heute</b>' : '',
      fmt(t.date),
      t.guest ? 'Abreise ' + esc(t.guest) : '',
      !forCleaner && t.assignedTo ? 'übernommen von <b>' + esc(nameOf(t.assignedTo)) + '</b>' : '',
    ].filter(Boolean).join(' · ');
    let actions = '';
    if (forCleaner && t.status === 'offen') actions = `<button class="primary" data-confirm="${esc(t.id)}">Bestätigen – ich übernehme</button>`;
    if (forCleaner && t.status === 'bestätigt') actions = `<button data-done="${esc(t.id)}">Erledigt melden</button>`;
    return `<div class="card${urgent ? ' urgent' : ''}">
      <div class="row"><b>${esc(t.apartmentName)}</b>${badge(t)}</div>
      <div class="meta">${info}</div>
      ${t.sameDayArrival && t.status !== 'storniert' ? '<div style="margin-top:6px"><span class="badge alert">Wechseltag – neuer Gast reist heute an</span></div>' : ''}
      ${actions ? `<div class="actions">${actions}</div>` : ''}
      ${!forCleaner && t.history ? `<details class="meta" style="margin-top:6px"><summary>Verlauf</summary>${t.history.map((h) => `<div>${fmtTime(h.at)} – ${esc(h.text)}</div>`).join('')}</details>` : ''}
    </div>`;
  }

  function nameOf(id) {
    const c = (data.cleaners || []).find((x) => x.id === id);
    return c ? c.name : id;
  }

  function list(items, fn) {
    return items.length ? items.map(fn).join('') : '<div class="empty">Keine Einträge.</div>';
  }

  function logList(entries, showTo) {
    return list(entries, (n) => `<div class="card"><div class="row"><b>${esc(n.title)}</b><span class="meta">${fmtTime(n.at)}${showTo ? ' → ' + esc(n.toName) : ''}</span></div><div class="meta">${esc(n.body)}</div></div>`);
  }

  function pushSetup() {
    return `<details class="card" style="margin-top:22px"><summary><b>Push-Nachrichten einrichten</b></summary>
      <ol class="meta" style="margin:8px 0 0 18px; display:grid; gap:6px">
        <li>App <b>ntfy</b> aus dem App Store / Google Play installieren.</li>
        <li>In der App auf „+“ tippen und diesen Kanal abonnieren:<br><code id="topic">${esc(data.topic)}</code> <button class="small" data-copy="topic">Kopieren</button></li>
        <li>Benachrichtigungen für ntfy erlauben.</li>
        <li><button class="small" data-test>Test-Nachricht senden</button></li>
      </ol>
      <p class="meta" style="margin-top:8px">Den Kanalnamen bitte nicht weitergeben – wer ihn kennt, kann die Nachrichten mitlesen.</p></details>`;
  }

  function renderCleaner() {
    const active = data.tasks.filter((t) => t.status !== 'erledigt');
    const today = active.filter((t) => t.date === data.today);
    const later = active.filter((t) => t.date > data.today);
    return `
      <h2>Heute, ${fmt(data.today)}</h2>${list(today, (t) => taskCard(t, true))}
      <h2>Demnächst</h2>${list(later, (t) => taskCard(t, true))}
      <p class="meta" style="margin-top:12px">Bitte Reinigungen bis spätestens ${esc(data.escalationTime)} Uhr am Reinigungstag bestätigen.</p>
      ${pushSetup()}
      <h2>Meine Nachrichten</h2>${logList(data.log, false)}`;
  }

  function renderOwner() {
    const upcoming = data.tasks.filter((t) => t.date >= data.today);
    const count = (s) => upcoming.filter((t) => t.status === s).length;
    const alarms = upcoming.filter((t) => t.status === 'offen' && t.escalated).length;
    const aptRows = data.apartments.map((a) => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.id)}</code></td></tr>`).join('');
    const cleanerRows = data.cleaners.map((c) => `<tr><td>${esc(c.name)}</td><td>${c.apartments === 'all' ? 'alle Wohnungen' : esc(c.apartments.join(', '))}</td></tr>`).join('');
    return `
      ${data.syncError ? `<div class="notice bad"><b>Abgleich mit Smoobu gestört:</b> ${esc(data.syncError)}</div>` : ''}
      <div class="notice info row"><span class="meta">Letzter Smoobu-Abgleich: <b>${fmtTime(data.lastSync)}</b>${data.lastSyncCount != null ? ` · <b>${data.lastSyncCount}</b> Buchungen von Smoobu erhalten` : ''}</span>
        <span class="row" style="gap:6px"><button class="small" data-sync>Jetzt abgleichen</button><button class="small" data-diagnose>Diagnose</button></span></div>
      <div id="diagnose"></div>
      <h2>Ab heute</h2>
      <div class="stats">
        <div class="stat"><b>${count('offen')}</b><span>offen</span></div>
        <div class="stat"><b>${count('bestätigt')}</b><span>bestätigt</span></div>
        <div class="stat"><b>${count('erledigt')}</b><span>erledigt</span></div>
        <div class="stat"><b style="color:${alarms ? 'var(--bad)' : 'inherit'}">${alarms}</b><span>Alarme</span></div>
      </div>
      <h2>Reinigungen</h2>${list(data.tasks, (t) => taskCard(t, false))}
      ${pushSetup()}
      <h2>Verschickte Nachrichten</h2>${logList(data.log, true)}
      <h2>Wohnungen (Smoobu-IDs)</h2>
      <div class="card">${aptRows ? `<table>${aptRows}</table>` : '<div class="empty">Erscheinen nach dem ersten Abgleich.</div>'}</div>
      <h2>Reinigungskräfte</h2><div class="card"><table>${cleanerRows}</table></div>`;
  }

  function render() {
    $('title').textContent = data.user.role === 'owner' ? 'Reinigungen – Übersicht' : 'Meine Reinigungen';
    $('who').textContent = data.user.name + ' · ' + data.time + ' Uhr';
    $('app').innerHTML = data.user.role === 'owner' ? renderOwner() : renderCleaner();
  }

  // ---- Aktionen -------------------------------------------------------------
  document.body.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    try {
      if (d.confirm || d.done) {
        b.disabled = true;
        const next = await api(`/api/tasks/${encodeURIComponent(d.confirm || d.done)}/${d.confirm ? 'confirm' : 'done'}`, 'POST');
        data = Object.assign({}, data, next);
        render();
        toast(d.confirm ? 'Bestätigt – danke!' : 'Als erledigt gemeldet');
      } else if (d.sync) {
        b.disabled = true;
        b.textContent = 'Gleiche ab …';
        const next = await api('/api/sync', 'POST');
        data = Object.assign({}, data, next);
        render();
        toast(`Abgleich fertig: ${next.summary.bookings} Buchungen, ${next.summary.notifications} Nachrichten`);
      } else if (d.diagnose !== undefined) {
        b.disabled = true;
        b.textContent = 'Prüfe …';
        const res = await api('/api/diagnose', 'POST');
        b.disabled = false;
        b.textContent = 'Diagnose';
        $('diagnose').innerHTML = `<div class="card" style="margin-top:8px"><b>Smoobu-Diagnose</b>
          <p class="meta">Enthält keine Gästedaten – gerne als Screenshot an Claude schicken.</p>
          <div style="overflow-x:auto"><table>${res.results.map((r) => `<tr>
            <td><b>${esc(r.variant)}</b></td>
            <td>Status ${esc(r.status ?? '–')}<br>${esc(r.received ?? 0)} erhalten${r.total != null ? ' von ' + esc(r.total) : ''}${r.pages != null ? ', ' + esc(r.pages) + ' Seiten' : ''}
            ${r.departures && r.departures.length ? '<br>Abreisen ' + esc(r.departures.join(' … ')) : ''}
            ${r.topKeys && r.topKeys.length ? '<br><span class="meta">Antwort: ' + esc(r.topKeys.join(', ')) + '</span>' : ''}
            ${r.fields && r.fields.length ? '<br><span class="meta">Felder: ' + esc(r.fields.join(', ')) + '</span>' : ''}
            ${r.error ? '<br><span style="color:var(--bad)">' + esc(r.error) + '</span>' : ''}</td></tr>`).join('')}</table></div></div>`;
      } else if (d.test !== undefined) {
        await api('/api/test-push', 'POST');
        toast('Test-Nachricht verschickt');
      } else if (d.copy) {
        const text = $(d.copy).textContent;
        try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (err) {
          const r = document.createRange(); r.selectNodeContents($(d.copy));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }
    } catch (err) {
      toast(err.message);
      refresh();
    }
  });

  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
