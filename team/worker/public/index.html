        b.disabled = true;
        update(await api('/api/login-locks/release', 'POST', { ip: d.unlock }));
        toast('Freigeschaltet – wieder 3 Versuche möglich');
      } else if (d.catSave) {
        const input = document.querySelector(`[data-cat-input="${CSS.escape(d.catSave)}"]`);
        b.disabled = true;
        update(await api('/api/apt-category', 'POST', { apartmentId: d.catSave, category: input ? input.value : '' }));
        toast('Kategorie gespeichert');
      } else if (d.nightCheck !== undefined) {
        b.disabled = true;
        const r = await api(`/api/stats/night?day=${encodeURIComponent($('night-day').value)}`);
        b.disabled = false;
        const busy = r.rows.filter((x) => x.status !== 'frei').length;
        const icon = { gebucht: '✓ gebucht', blockiert: '▨ blockiert', frei: '✗ frei' };
        $('night-result').innerHTML = `<p style="margin-top:10px"><b>${busy} von ${r.rows.length} Wohnungen belegt</b> in der Nacht vom ${esc(fmt(r.day))}
          <span class="meta">· Smoobu lieferte ${r.fetch.received} Einträge auf ${r.fetch.pages} Seite(n)${r.fetch.total != null ? `, meldet ${r.fetch.total}` : ''}</span></p>
          <table class="bars">${r.rows.map((x) => `<tr><td>${esc(x.name)}</td><td><b style="color:${x.status === 'frei' ? 'var(--bad)' : 'var(--text)'}">${icon[x.status]}</b>
            ${x.arrival ? `<span class="meta"> ${esc(fmt(x.arrival))} – ${esc(fmt(x.departure))}</span>` : ''}${x.cancelledOnly ? ' <span class="meta">(nur storniert)</span>' : ''}</td></tr>`).join('')}</table>
          ${r.unknownApartments.length ? `<p class="meta">Einträge zu Einheiten, die hier nicht vorkommen: ${r.unknownApartments.map(esc).join(', ')}</p>` : ''}`;
      } else if (d.statsMore !== undefined) {
        statsMonths += 3; render();
      } else if (d.statsReset !== undefined) {
        statsMonths = 3; render();
      } else if (d.backfill !== undefined) {
        // 1,5 Jahre in Abschnitten zu 60 Tagen (Cloudflare erlaubt je Anfrage nur wenig Rechenzeit)
        b.disabled = true;
        const oldest = addDays(data.today, -548);
        const steps = Math.ceil(548 / 60);
        let to = addDays(data.today, -1), step = 0, total = 0;
        while (to >= oldest) {
          const from = addDays(to, -59) < oldest ? oldest : addDays(to, -59);
          step++;
          b.textContent = `Berechne … ${step}/${steps} (${fmt(from)} – ${fmt(to)})`;
          const r = await api('/api/stats/backfill', 'POST', { from, to, quiet: true });
          total += r.backfilled;
          to = addDays(from, -1);
        }
        await refresh(true);
        toast(`Rückwirkend berechnet: ${steps} Abschnitte, ${total} Tage`);
      } else if (d.periodWithdraw) {
        const t = data.tasks.find((x) => x.id === d.periodWithdraw);
        const open = t && t.periodRequest && t.periodRequest.status === 'offen';
        if (!armed(b, open ? 'Wirklich zurückziehen? Nochmal tippen' : 'Wirklich früher? Nochmal tippen')) return;
        await taskAction(d.periodWithdraw, 'period-withdraw', {}, open ? 'Antrag zurückgezogen – Apartments Strauss wurde informiert'
          : 'Zeitraum aufgehoben – Apartments Strauss wurde informiert');
      } else if (d.blockReleased) {
        b.disabled = true;
        await taskAction(d.blockReleased, 'block-released', {}, 'Erledigt');
      } else if (d.supply) {
        supplyTask = supplyTask === d.supply ? null : d.supply; render();
      } else if (d.supplyClose !== undefined) {
        supplyTask = null; render();
      } else if (d.supplyDone !== undefined) {
        b.disabled = true;
        update(await api('/api/supplies/resolve', 'POST', { itemId: d.item, apartmentId: d.apt || null }));
        toast('Als aufgefüllt markiert');
      } else if (d.lang) {
        setLang(d.lang);
        if (data && auth) { try { update(await api('/api/lang', 'POST', { lang })); } catch (err) { render(); } } else showLogin();
      } else if (d.codes) {
        if (shownCodes[d.codes]) { delete shownCodes[d.codes]; return render(); }
        b.disabled = true;
        shownCodes[d.codes] = await api(`/api/tasks/${encodeURIComponent(d.codes)}/codes`, 'POST');
        render();
        setTimeout(() => { if (shownCodes[d.codes]) { delete shownCodes[d.codes]; render(); } }, 3 * 60 * 1000);
      } else if (d.codeEditor !== undefined) {
        codeEditor = await api('/api/access-codes');
        render();
        document.getElementById('codes').scrollIntoView();
      } else if (d.codeImport !== undefined) {
        importCodes($('code-import').value);
      } else if (d.codeSave !== undefined) {
        const entries = codeEditor.apartments.map((a) => ({ apartmentId: a.id, guest: $('cg-' + a.id).value, service: $('cs-' + a.id).value, description: $('cd-' + a.id).value }));
        b.disabled = true;
        codeEditor = await api('/api/access-codes', 'POST', { entries });
        render();
        document.getElementById('codes').scrollIntoView();
        toast('Codes gespeichert');
      } else if (d.codeClose !== undefined) {
        codeEditor = null; render();
      } else if (d.period) {
        periodTask = periodTask === d.period ? null : d.period; render();
      } else if (d.periodClose !== undefined) {
        periodTask = null; render();
      } else if (d.periodClear) {
        await taskAction(d.periodClear, 'period', { until: null }, 'Zeitraum aufgehoben – das Team wurde informiert');
        periodTask = null; render();
      } else if (d.periodDecide) {
        const input = document.getElementById('pc-' + d.periodDecide);
        const approve = d.approve === '1';
        if (!approve && !armed(b, 'Wirklich ablehnen? Nochmal tippen')) return;
        b.disabled = true;
        await taskAction(d.periodDecide, 'period-decide', { approve, comment: input ? input.value : '' },
          approve ? 'Genehmigt – das Team wurde informiert' : 'Abgelehnt – das Team wurde informiert');
      } else if (d.editTask) {
        editTask = editTask === d.editTask ? null : d.editTask; render();
      } else if (d.editCancel !== undefined) {
        editTask = null; editPerson = null; render();
      } else if (d.resolve) {
        b.disabled = true;
        await taskAction(d.resolve, `reports/${encodeURIComponent(d.report)}/resolve`, null, 'Als behoben markiert');
      } else if (d.cancel) {
        if (!armed(b, 'Wirklich absagen? Nochmal tippen')) return;
        await taskAction(d.cancel, 'cancel', null, 'Abgesagt – das Team wurde informiert');
      } else if (d.seen !== undefined) {
        update(await api('/api/seen', 'POST'));
      } else if (d.editPerson) {
        editPerson = d.editPerson; render();
      } else if (d.newcode) {
        if (!armed(b, 'Alter Code wird ungültig – nochmal tippen')) return;
        const res = await api(`/api/team/${d.newcode}/code`, 'POST');
        newCode = res.newCode; update(res);
        document.getElementById('team').scrollIntoView();
      } else if (d.remove) {
        if (!armed(b, 'Wirklich entfernen? Nochmal tippen')) return;
        update(await api(`/api/team/${d.remove}/delete`, 'POST'));
        toast('Entfernt');
      } else if (d.hideCode !== undefined) {
        newCode = null; render();
      } else if (d.sync !== undefined) {
        b.disabled = true; b.textContent = 'Gleiche ab …';
        const next = await api('/api/sync', 'POST');
        update(next);
        toast(next.summary.syncError ? next.summary.syncError : `Abgleich fertig: ${next.summary.bookings} Buchungen`);
      } else if (d.diagnose !== undefined) {
        b.disabled = true; b.textContent = 'Prüfe …';
        const res = await api('/api/diagnose', 'POST');
        b.disabled = false; b.textContent = 'Diagnose';
        $('diagnose').innerHTML = `<div class="scroll" style="margin-top:8px"><table>${res.results.map((r) => `<tr>
            <td><b>${esc(r.variant)}</b></td>
            <td>Status ${esc(r.status ?? '–')}${r.received ? ' · ' + esc(r.received) + ' erhalten' + (r.total != null ? ' von ' + esc(r.total) : '') : ''}
            ${r.topKeys && r.topKeys.length ? '<br><span class="meta">' + esc(r.topKeys.join(', ')) + '</span>' : ''}
            ${r.error ? '<br><span style="color:var(--bad)">' + esc(r.error) + '</span>' : ''}</td></tr>`).join('')}</table></div>`;
      } else if (d.test !== undefined) {
        await api('/api/test-push', 'POST');
        pushTested = true;
        render();
        toast('Test-Nachricht verschickt – bitte aufs Handy schauen');
      } else if (d.copy) {
        const text = d.copy.startsWith('code-') ? $(d.copy).textContent.replace(/\s/g, '') : $(d.copy).textContent;
        try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (err) {
          const r = document.createRange(); r.selectNodeContents($(d.copy));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }
    } catch (err) {
      toast(err.message);
      if (err.status === 401) { store.set(null); auth = null; showLogin(); } else refresh(true);
    }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { /* ohne Offline-Speicher */ });

  // Neue App-Version erkennen (z. B. als Home-Bildschirm-App lange geöffnet): Seite neu laden.
  let appVersion = null, lastCheck = 0;
  const busy = () => !$('#finish')?.hidden || !!document.querySelector('textarea:focus, input:focus');
  const checkVersion = async (fromVisible) => {
    if (Date.now() - lastCheck < 60000 && !fromVisible) return;
    lastCheck = Date.now();
    try {
      const r = await fetch('/', { method: 'HEAD', cache: 'no-store' });
      const v = r.headers.get('etag') || r.headers.get('last-modified');
      if (!v) return;
      if (appVersion === null) { appVersion = v; return; }
      if (v === appVersion) return;
      if (fromVisible && !busy()) return location.reload();
      if (!$('#update-bar')) {
        const b = document.createElement('button');
        b.id = 'update-bar';
        b.textContent = '🔄 Neue Version – tippen zum Aktualisieren';
        b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:14px;border:0;border-radius:12px;background:#1f6f43;color:#fff;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)';
        b.onclick = () => location.reload();
        document.body.appendChild(b);
        translate(b);
      }
    } catch { /* offline */ }
  };
  checkVersion();
  refresh(true);
  setInterval(() => { if (!document.hidden) { refresh(); checkVersion(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); checkVersion(true); } });
})();
</script>
</body>
</html>
