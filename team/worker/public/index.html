  // ---- Reinigung abschließen: eigener Vollbild-Ablauf (Checkliste, Fotos/Videos, knapp, Bericht, Schlüssel) ----
  function openFinish(id) {
    doneTask = id;
    renderFinish();
    $('finish').hidden = false;
    document.body.style.overflow = 'hidden';
    $('finish').scrollTop = 0;
  }
  function closeFinish() {
    doneTask = null;
    $('finish').hidden = true;
    $('finish').innerHTML = '';
    document.body.style.overflow = '';
  }
  function renderFinish() {
    const t = (data.tasks || []).find((x) => x.id === doneTask);
    if (!t) return closeFinish();
    const key = 'f' + t.id;
    $('finish').innerHTML = `<div class="finish-inner"><form data-finish-form="${esc(t.id)}">
      <div class="finish-head"><div class="eyebrow">🏁 Fertig melden</div><h2>${esc(t.apartmentName)}</h2>
        ${shortLoc(t.location) ? `<div class="meta">📍 ${esc(shortLoc(t.location))}</div>` : ''}</div>
      ${t.aptNote ? `<div class="apt-note">📌 <b>Hinweis zur Wohnung:</b> ${esc(t.aptNote)}</div>` : ''}
      <div class="step"><b><span class="num">1</span>📷 Fotos oder Video</b> <span class="meta">(freiwillig)</span>
        <div class="pick">
          <label>📷 Foto<input type="file" accept="image/*" capture="environment" data-photo-input="${esc(key)}"></label>
          <label>🎥 Video<input type="file" accept="video/*" capture="environment" data-photo-input="${esc(key)}"></label>
          <label>🖼️ Galerie<input type="file" accept="image/*,video/*" multiple data-photo-input="${esc(key)}"></label>
        </div>
        <div class="thumbs" data-previews="${esc(key)}">${previewsHtml(key)}</div></div>
      <div class="step"><b><span class="num">2</span>🛒 Fehlt etwas?</b> <span class="meta">(freiwillig)</span>${supplyGrid(t, 'supply')}</div>
      <div class="step"><b><span class="num">3</span>📝 Besonderheiten?</b> <span class="meta">(freiwillig)</span>
        <textarea name="report" rows="3" maxlength="2000" placeholder="z. B. Fleck auf dem Sofa"></textarea></div>
      <fieldset class="step keys-check" style="border:1px solid var(--line)"><legend style="display:contents"><b><span class="num">4</span>🔑 Sind die Gästeschlüssel in der Box? <span style="color:var(--bad)">*</span></b></legend>
        <label class="choice"><input type="radio" name="keys" value="1" required> 👍 Ja, alle da</label>
        <label class="choice no"><input type="radio" name="keys" value="0"> ⚠️ Nein, fehlen</label>
        <label class="field" style="margin-top:10px">Bei „Nein“: kurz erklären (freiwillig)
          <input name="note" maxlength="500" placeholder="z. B. nur 1 von 2 Schlüsseln"></label></fieldset>
      <div class="main-action"><button class="primary big" type="submit">🏁 Fertig melden</button></div>
      <div class="actions"><button type="button" data-finish-close>Abbrechen</button></div>
    </form></div>`;
    translate($('finish'));
  }

  function periodForm(t) {
    const owner = role() === 'owner';
    // Nur Tage, an denen die Wohnung laut Smoobu frei ist (keine Anreise, kein Aufenthalt, keine Sperrzeit)
    const limit = t.periodLimit || { last: addDays(t.date, data.maxPeriodDays || 7), reason: '' };
    if (!limit.last) {
      return `<div class="report-form request" style="border-color:var(--bad);background:var(--bad-bg)">
        <b style="color:var(--bad)">${owner ? 'Kein späterer Tag möglich' : 'Antrag nicht möglich'}</b>
        <p style="margin:6px 0 0">${lang === 'hu'
          ? `${esc(tr(limit.reason))} – a lakás a check-out után nem szabad. A takarításnak <b>${fmtLong(t.date)}, ${esc(data.finishBy)}-ig</b> el kell készülnie.`
          : `${esc(limit.reason)} – die Wohnung ist nach dem Check-out nicht frei. Die Reinigung muss am
          <b>${fmtLong(t.date)} bis ${esc(data.finishBy)} Uhr</b> erledigt sein.`}</p>
        <div class="actions"><button type="button" data-period-close>Schließen</button></div></div>`;
    }
    const max = limit.last;
    const min = addDays(t.date, 1) > data.today ? addDays(t.date, 1) : data.today;
    let value = t.latestDate || (addDays(t.date, 1) <= max ? addDays(t.date, 1) : max);
    if (value < min) value = min;
    return `<form class="report-form" data-period-form="${esc(t.id)}">
      <p class="meta">${lang === 'hu'
        ? `📅 Legkésőbb mikorra tudod? <b style="color:var(--bad)">Mindig ${esc(data.finishBy)}-ig legyen kész.</b>
          ${limit.reason ? `<br>Lehetséges eddig: ${fmt(max)} (${esc(tr(limit.reason))}).` : ''}`
        : `📅 Bis wann schaffst du es spätestens? <b style="color:var(--bad)">Immer bis ${esc(data.finishBy)} Uhr fertig.</b>
        ${limit.reason ? `<br>Möglich bis ${fmt(max)} (${esc(limit.reason)}).` : ''}`}</p>
      <div class="form-grid">
        <label class="field">Spätestens am <input type="date" name="until" value="${esc(value)}" min="${esc(min)}" max="${esc(max)}" required></label>
        ${owner ? '' : '<label class="field">Warum? <input name="reason" required minlength="3" maxlength="500" placeholder="z. B. zu wenig Personal"></label>'}
      </div>
      <div class="actions"><button class="primary" type="submit">${owner ? 'Speichern und Team informieren' : '📨 Anfrage senden'}</button>
        ${owner && t.latestDate ? `<button type="button" class="danger" data-period-clear="${esc(t.id)}">Zeitraum aufheben</button>` : ''}
        <button type="button" data-period-close>Abbrechen</button></div>
    </form>`;
  }

  /** Offener Antrag: Admin genehmigt / lehnt ab; alle anderen sehen den Stand */
  function requestBox(t) {
    const req = t.periodRequest;
    if (!req || req.status !== 'offen' || !isActive(t)) return '';
    const who = nameOf(req.by);
    return `<div class="request"><b>Antrag: Reinigung ${esc(fmt(t.date))} – ${esc(fmt(req.until))}</b> <span class="meta">(jeweils bis ${esc(data.finishBy)} Uhr)</span>
      <div class="meta">${esc(who)} · ${fmtTime(req.at)}</div><p style="margin:6px 0 0">${esc(req.reason)}</p>
      ${role() === 'owner' ? `<label class="field" style="margin-top:8px">Antwort (optional) <input id="pc-${esc(t.id)}" maxlength="500" placeholder="z. B. ok, aber bis 14 Uhr fertig"></label>
        <div class="actions"><button class="go" data-period-decide="${esc(t.id)}" data-approve="1">Genehmigen</button>
          <button class="danger" data-period-decide="${esc(t.id)}" data-approve="0">Ablehnen</button></div>`
        : '<div class="meta" style="margin-top:6px">Wartet auf Entscheidung von Apartments Strauss.</div>'}
    </div>`;
  }

  function assignControl(t) {
    const options = [...(data.staff || []).map((s) => [s.id, s.name]), [data.user.id, `Ich selbst (${data.user.name})`]];
    return `<div class="assign">
      <select data-assign-select="${esc(t.id)}" aria-label="Mitarbeiterin auswählen">
        <option value="">${t.assignedTo ? 'Neu zuweisen …' : 'Mitarbeiterin wählen …'}</option>
        ${options.map(([id, name]) => `<option value="${esc(id)}" ${id === t.assignedTo ? 'disabled' : ''}>${esc(name)}</option>`).join('')}
      </select>
      <button class="primary" data-assign="${esc(t.id)}">Zuweisen</button>
    </div>`;
  }

  /** Start zu früh? (vor dem Reinigungstag oder vor dem Check-out) → Text für die Sicherheitsfrage */
  function earlyWarning(t) {
    if (!t) return '';
    const now = new Date().toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' });
    if (data.today < t.date) return tr(`Zu früh? Die Reinigung ist erst für ${dayWord(t.date)} (${fmt(t.date)}) geplant – eventuell sind noch Gäste in der Wohnung.`) + '\n\n' + tr('Trotzdem jetzt starten?');
    if (data.today === t.date && t.checkOut && now < t.checkOut) return tr(`Zu früh? Check-out ist erst um ${t.checkOut} Uhr – eventuell sind noch Gäste in der Wohnung.`) + '\n\n' + tr('Trotzdem jetzt starten?');
    return '';
  }
  function taskCard(t, opts) {
    opts = opts || {};
    const r = role();
    const id = esc(t.id);
    const active = isActive(t);
    const mineToDo = t.assignedTo === data.user.id;
    const isNew = r === 'staff' ? active && !t.staffConfirmedAt : r === 'lead' ? active && (!t.leadConfirmedAt || !t.assignedTo) : false;
    const urgent = active && (t.overdue || t.lateAlerted || (r === 'owner' && t.status === 'offen' && t.date <= addDays(data.today, 1)));
    const compact = !active && !opts.full;
    const cls = ['task', active ? '' : 'muted', compact ? 'compact' : '', isNew ? 'is-new' : '', opts.next ? 'is-next' : '', urgent ? 'urgent' : ''].filter(Boolean).join(' ');
    const canWork = active && r !== 'owner' && mineToDo && !!t.staffConfirmedAt;
    const reqOpen = t.periodRequest && t.periodRequest.status === 'offen';
    const doneToday = t.status === 'erledigt' && t.doneAt && t.doneAt.slice(0, 10) >= addDays(data.today, -1);

    // 1) EIN großer Knopf für den nächsten Schritt
    let main = '';
    if (active && mineToDo && !t.staffConfirmedAt) main = `<button class="primary big" data-confirm="${id}">✅ Annehmen</button>`;
    else if (canWork && !t.startedAt) main = `<button class="go big" data-start="${id}">▶️ Reinigung starten</button>`;
    else if (canWork) main = `<button class="primary big" data-done="${id}">🏁 Fertig melden</button>`;
    else if (r === 'lead' && active && t.assignedTo && !t.leadConfirmedAt) main = `<button class="primary big" data-lead-confirm="${id}">✅ Annehmen</button>`;
    else if (r === 'owner' && t.keysInBox === false && !t.keysResolvedAt) main = `<button class="go big" data-keys-resolved="${id}">🔑 Schlüssel sind geklärt</button>`;
    else if (r === 'owner' && t.releaseBlock) main = `<button class="go big" data-block-released="${id}">🔓 Blockierung ist aufgehoben</button>`;

    // 2) Alles Weitere unter „⋯ Mehr“
    const more = [];
    const btn = (attr, label, extra) => `<button type="button" class="more-btn ${extra || ''}" ${attr}>${label}</button>`;
    if (canWork && !t.startedAt) more.push(btn(`data-done="${id}"`, '🏁 Fertig melden (ohne Start)'));
    if ((active || doneToday) && (r !== 'staff' || mineToDo)) more.push(btn(`data-codes="${id}"`, shownCodes[t.id] ? '🔑 Codes ausblenden' : '🔑 Codes anzeigen'));
    if (t.guestPhone && active) more.push(`<a class="more-btn" href="tel:${esc(t.guestPhone.replace(/[^\d+]/g, ''))}">📞 Gast anrufen (${esc(t.guestPhone)})</a>`);
    if (t.status !== 'storniert') more.push(btn(`data-toggle-report="${id}"`, r === 'owner' ? '📝 Hinweis ans Team' : '📷 Problem melden'));
    if ((active || doneToday) && r !== 'owner' && (r === 'lead' || mineToDo)) more.push(btn(`data-supply="${id}"`, '🛒 Etwas fehlt'));
    if (active && r !== 'owner' && (r === 'lead' || mineToDo)) {
      if (reqOpen) more.push(btn(`data-period-withdraw="${id}"`, '↩️ Antrag zurückziehen'));
      else if (t.latestDate && t.latestDate > t.date) more.push(btn(`data-period-withdraw="${id}"`, '⏪ Doch früher reinigen'));
      if (!reqOpen) more.push(btn(`data-period="${id}"`, '📅 Später reinigen?'));
    }
    if (r === 'owner' && active) {
      if (!t.manual) more.push(btn(`data-move="${id}"`, '📅 Anderer Tag'));
      more.push(btn(`data-period="${id}"`, t.latestDate ? '📆 Zeitraum ändern' : '📆 Zeitraum erlauben'));
    }
    if (r === 'owner') more.push(btn(`data-apt-note="${id}"`, '📌 Hinweis zur Wohnung'));
    if (r === 'owner' && t.manual && active) {
      more.push(btn(`data-edit-task="${id}"`, '✏️ Bearbeiten'));
      more.push(btn(`data-cancel="${id}"`, '✖️ Absagen', 'danger'));
    }
    const origin = `Eingetragen ${fmtTime(t.createdAt)} · ${t.source === 'manuell' ? 'von Hand' : 'aus Smoobu'}${t.changedAt ? ` · geändert ${fmtTime(t.changedAt)}` : ''}`;
    const loc = active ? shortLoc(t.location) : '';
    return `<article class="${cls}" id="task-${id}">
      ${compact ? `<div class="task-top" style="align-items:center"><h3>${esc(t.apartmentName)}</h3>${statusLine(t)}</div>${chips(t) ? `<div class="chips">${chips(t)}</div>` : ''}` : `<div class="eyebrow">${isNew ? '<span class="chip new">NEU</span> ' : ''}${opts.next ? '<span class="chip next">Als Nächstes</span> ' : ''}${esc(dayWord(t.date))}${lastDay(t) > t.date ? ' bis ' + esc(dayWord(lastDay(t))) : ''} · ${t.manual ? 'Extra-Reinigung' : 'Check-out'}</div>
      <h3>${esc(t.apartmentName)}</h3>
      ${loc ? `<div class="loc">📍 ${esc(loc)}</div>` : ''}
      ${r === 'owner' && t.guest ? `<div class="meta">👤 ${esc(t.guest)}</div>` : ''}
      <div class="status-row">${statusLine(t)}${chips(t)}</div>`}
      ${t.aptNote ? `<div class="apt-note">📌 ${esc(t.aptNote)}</div>` : ''}
      ${t.note ? `<div class="note">📝 ${esc(t.note)}</div>` : ''}
      ${nextGuests(t)}
      ${requestBox(t)}
      ${t.reports.map((rep) => reportHtml(t, rep)).join('')}
      ${r === 'lead' && active && !t.assignedTo ? assignControl(t) : ''}
      ${main ? `<div class="main-action">${main}</div>` : ''}
      <details class="more-actions"><summary>⋯ Mehr</summary>
        <div class="more-list">${more.join('')}</div>
        ${r === 'lead' && active && t.assignedTo ? `<div style="margin-top:8px">${assignControl(t)}</div>` : ''}
        <div class="origin">${origin}</div>
        ${t.history ? `<details class="meta" style="margin-top:6px"><summary>Verlauf</summary>${t.history.map((h) => `<div>${fmtTime(h.at)} – ${esc(h.text)}</div>`).join('')}</details>` : ''}
      </details>
      ${editTask === t.id ? editForm(t) : ''}
      ${shownCodes[t.id] ? codesBox(shownCodes[t.id]) : ''}
      ${supplyTask === t.id ? supplyForm(t) : ''}
      ${periodTask === t.id ? periodForm(t) : ''}
      ${moveTask === t.id ? moveForm(t) : ''}
      ${aptNoteTask === t.id ? aptNoteForm(t) : ''}
      ${openForms.has(t.id) ? reportForm(t) : ''}
    </article>`;
  }

  const list = (items, empty, nextId) => items.length ? items.map((t) => taskCard(t, { next: t.id === nextId })).join('') : `<p class="empty">${empty}</p>`;
  const section = (id, title, sub, body, cls) =>
    `<section class="section ${cls || ''}" id="${id}"><div class="section-head"><h2>${title}</h2><span class="meta">${sub || ''}</span></div>${body}</section>`;
  const tile = (target, value, label, warn, text) =>
    `<button type="button" class="tile${warn ? ' warn' : ''}${text ? ' text' : ''}" data-jump="${target}"><b>${value}</b><span>${label}</span></button>`;
  function byDay(tasks, nextId) {
    const days = {};
    for (const t of tasks) {
      const d = onDay(t, data.today) ? (t.date < data.today ? data.today : t.date) : t.date;
      (days[d] = days[d] || []).push(t);
    }
    return Object.keys(days).sort().map((d) => `<div class="day">${esc(dayWord(d))}${['Heute', 'Morgen', 'Gestern'].includes(dayWord(d)) ? ' · ' + fmt(d) : ''}</div>${list(days[d], '', nextId)}`).join('');
  }

  const newsItem = (c) => {
    const inner = `<span class="meta">${esc(new Date(c.at).toDateString() === new Date().toDateString() ? clock(c.at) : fmtTime(c.at))}</span> <b>${esc(c.title)}</b> · ${esc(c.body)}`;
    return `<li class="${!data.seenAt || c.at > data.seenAt ? 'unread' : ''}">${c.taskId ? `<button type="button" class="news-link" data-jump="task-${esc(c.taskId)}">${inner} ›</button>` : inner}</li>`;
  };
  function newsPanel() {
    const items = data.changes || [];
    if (!items.length) return '';
    const unread = items.filter((c) => !data.seenAt || c.at > data.seenAt);
    const shown = unread.length ? unread : items.slice(0, 3);
    return `<div class="news" id="news">
      <div class="news-head"><b>${unread.length ? `Neuigkeiten (${unread.length})` : 'Letzte Änderungen'}</b>
        ${unread.length ? '<button class="small" data-seen>Alles gelesen</button>' : ''}</div>
      <ul>${shown.slice(0, 3).map(newsItem).join('')}</ul>
      ${shown.length > 3 ? `<details class="news-more"><summary>… ${shown.length - 3} weitere</summary><ul>${shown.slice(3, 15).map(newsItem).join('')}</ul></details>` : ''}
    </div>`;
  }

  // ---- Push-Nachrichten einrichten (Schritt für Schritt) -----------------------
  const STORE = { ios: 'https://apps.apple.com/de/app/ntfy/id1625396347', android: 'https://play.google.com/store/apps/details?id=io.heckel.ntfy' };
  const device = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'ios' : /Android/i.test(navigator.userAgent) ? 'android' : 'other';
  const pushDone = () => !!data.pushOk; // wird je Benutzerkonto auf dem Server gemerkt
  let pushTested = false;

  function pushGuide(inline) {
    const stores = [['ios', 'App Store (iPhone)'], ['android', 'Google Play (Android)']];
    if (device === 'android') stores.reverse(); // passender Store zuerst
    return `<div class="guide"${inline ? '' : ' id="push"'}>
      <b style="font-size:17px">Push-Nachrichten einrichten</b>
      <p class="meta">Damit du neue Reinigungen und Erinnerungen sofort aufs Handy bekommst – dauert 2 Minuten.</p>
      <ol>
        <li><div><b>App „ntfy“ herunterladen</b> (kostenlos)
          <div class="row">${stores.map(([k, label]) => `<a class="btn store${k === device || device === 'other' ? '' : ' other'}" href="${STORE[k]}" target="_blank" rel="noopener">${label}</a>`).join('')}</div></div></li>
        <li><div><b>App öffnen, Mitteilungen erlauben</b>
          <p class="meta">Beim ersten Start fragt die App – bitte „Erlauben“ tippen.</p></div></li>
        <li><div><b>Deinen Kanal abonnieren</b>
          <p class="meta">In ntfy unten rechts auf „+“ tippen, diesen Namen einfügen und „Abonnieren“ tippen:</p>
          <div class="topicline"><code id="topic">${esc(data.topic)}</code><button class="small" data-copy="topic">Kopieren</button></div>
          ${device === 'android' ? `<div class="row"><a class="btn small" href="ntfy://ntfy.sh/${esc(data.topic)}">Direkt in ntfy öffnen</a></div>` : ''}</div></li>
        <li><div><b>Testen</b>
          <div class="row"><button class="go" data-test>Test-Nachricht senden</button></div>
          ${pushTested ? `<p class="meta" style="margin-top:8px">Ist die Nachricht auf dem Handy angekommen?</p>
            <div class="row"><button class="primary" data-push-ok>Ja, angekommen ✓</button><button data-push-help>Nein</button></div>` : ''}
          <p class="meta" id="push-help" hidden style="margin-top:8px">Tipps: Kanalname genau so eingetragen? In den Handy-Einstellungen → ntfy → Mitteilungen erlauben
            (iPhone zusätzlich „Sofortige Mitteilungen“). Android: Akku-Optimierung für ntfy ausschalten. Danach nochmals testen.</p></div></li>
      </ol>
    </div>`;
  }
  /** Oben als Hinweis, bis bestätigt wurde, dass die Test-Nachricht ankommt; sonst unten aufklappbar */
  const pushBanner = () => (pushDone() ? '' : pushGuide(false));
  function pushSetup() {
    return pushDone() ? `<details class="more"><summary>Push-Nachrichten (eingerichtet ✓)</summary>${pushGuide(true)}</details>` : '';
  }

  // ---- Team -------------------------------------------------------------------
  function teamList(kind, persons, title) {
    const rows = persons.map((p) => editPerson === p.id ? `
      <form class="panel" data-edit-person="${esc(p.id)}">
        <label class="field">Name <input name="name" value="${esc(p.name)}" required maxlength="60"></label>
        <div class="actions"><button class="primary" type="submit">Speichern</button><button type="button" data-edit-cancel>Abbrechen</button></div>
      </form>` : `
      <div class="panel"><div class="person"><b style="font-size:17px">${esc(p.name)}</b><span class="meta">${kind === 'lead' ? 'Reinigungsleitung' : 'Mitarbeiterin'}</span></div>
        ${'code' in p ? `<div class="codeline"><span class="meta">Anmeldecode:</span>${p.code
          ? `<span class="code" id="code-${esc(p.id)}">${esc(p.code.slice(0, 3))} ${esc(p.code.slice(3))}</span><button class="small" data-copy="code-${esc(p.id)}">Kopieren</button>`
          : '<span class="meta">nicht mehr sichtbar – bitte „Neuen Code erzeugen“</span>'}</div>` : ''}
        <div class="actions">
          <button class="small" data-edit-person="${esc(p.id)}">Name ändern</button>
          <button class="small" data-newcode="${esc(p.id)}">Neuen Code erzeugen</button>
          <button class="small danger" data-remove="${esc(p.id)}">Entfernen</button>
        </div></div>`).join('');
    // Es gibt genau eine Reinigungsleitung – dann kein weiteres Anlegen
    const canAdd = !(kind === 'lead' && persons.length);
    return `<h3 style="margin:14px 0 8px; font-size:16px">${title}</h3>
      ${rows || '<p class="empty">Noch niemand angelegt.</p>'}
      ${!canAdd ? '<p class="meta" style="margin-top:6px">Es gibt genau eine Reinigungsleitung. Zum Wechseln: Namen ändern und „Neuen Code erzeugen“ – oder entfernen und neu anlegen.</p>' : `
      <form class="panel" data-add-person="${kind}" style="margin-top:10px">
        <div class="form-grid"><label class="field">${kind === 'lead' ? 'Reinigungsleitung anlegen' : 'Mitarbeiterin hinzufügen'}
          <input name="name" required maxlength="60" placeholder="Name"></label>
          <button class="primary" type="submit">Anlegen und Code erzeugen</button></div>
      </form>`}`;
  }
  function codeBox() {
    return newCode ? `<div class="codebox"><div class="eyebrow">Anmeldecode für ${esc(newCode.name)}</div>
      <div class="code">${esc(newCode.code.slice(0, 3))} ${esc(newCode.code.slice(3))}</div>
      <p class="meta">Persönlich weitergeben. Anmeldung unter <b>${esc(location.host)}</b>. Der Code bleibt unten in der Liste jederzeit sichtbar.
      „Neuen Code erzeugen“ meldet alle bisherigen Geräte dieser Person ab.</p>
      <div class="actions"><button class="small" data-hide-code>Verstanden, ausblenden</button></div></div>` : '';
  }

  // ---- Mitarbeiterin ----------------------------------------------------------
  function renderStaff() {
    const t0 = data.today;
    const upcoming = data.tasks.filter((t) => lastDay(t) >= t0 && (isActive(t) || t.date === t0 || t.status === 'storniert'));
    const past = data.tasks.filter((t) => !upcoming.includes(t) && t.date < t0).reverse();
    const fresh = upcoming.filter((t) => isActive(t) && !t.staffConfirmedAt);
    const planned = upcoming.filter((t) => !(isActive(t) && !t.staffConfirmedAt));
    const today = data.tasks.filter((t) => onDay(t, t0) && t.status !== 'storniert');
    const next = upcoming.find(isActive);
    return `
      <div class="greeting"><h1>Hallo ${esc(data.user.name)} 👋</h1><p class="meta">${fmtLong(t0)}</p></div>
      <div class="glance three">
        ${tile('neu', fresh.length, '🆕 neu', fresh.length > 0)}
        ${tile('plan', today.length ? `${today.filter((t) => t.status === 'erledigt').length}/${today.length}` : '0', today.length ? '✅ heute fertig' : '☕ heute frei')}
        ${tile(next ? 'task-' + next.id : 'plan', next ? esc(next.apartmentName) : '–', next ? '➡️ als Nächstes · ' + esc(dayWord(next.date)) : 'nichts geplant', false, true)}
      </div>
      ${pushBanner()}
      ${newsPanel()}
      ${fresh.length ? section('neu', '🆕 Neue Aufträge – bitte annehmen', '', list(fresh, '', next && next.id), 'key') : ''}
      ${(data.routes || []).some((r) => r.day === t0) ? section('route', '🗺️ Meine Route heute', '', routeBlock(t0, false), 'key') : ''}
      ${(data.routes || []).some((r) => r.day === addDays(t0, 1)) ? `<details class="more"><summary>🗺️ Route morgen</summary>${routeBlock(addDays(t0, 1), false)}</details>` : ''}
      ${planned.length ? section('plan', '📋 Meine Reinigungen', '', byDay(planned, next && next.id), 'key')
        : !fresh.length ? '<p class="empty-state" id="plan">☕ Gerade keine Reinigungen für dich.</p>' : '<span id="plan"></span>'}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, '')}</details>` : ''}
      ${pushSetup()}`;
  }

  // ---- Reinigungsleitung -----------------------------------------------------
  function renderLead() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const reports = data.openReports || [];
    if (page === 'team') {
      return navBar() + `<div class="greeting"><h1>Team &amp; Meldungen</h1></div>
        ${sectionIf(reports.length, 'meldungen', 'Offene Meldungen', reports.length + ' offen', reportsBlock(reports), 'key')}
        ${section('team', 'Mein Team', (data.staff || []).length + ' Mitarbeiterinnen', codeBox() + teamList('staff', data.staff || [], 'Mitarbeiterinnen'))}
        ${pushSetup()}`;
    }
    const active = data.tasks.filter(isActive);
    const todo = active.filter((t) => lastDay(t) >= t0 && (!t.leadConfirmedAt || !t.assignedTo));
    const waiting = active.filter((t) => t.assignedTo && !t.staffConfirmedAt);
    const rest = data.tasks.filter((t) => !todo.includes(t));
    const today = rest.filter((t) => onDay(t, t0));
    const tomorrow = rest.filter((t) => t.date === t1);
    const soon = rest.filter((t) => t.date > t1 && t.date <= t14);
    const later = rest.filter((t) => t.date > t14);
    const past = rest.filter((t) => t.date < t0 && !today.includes(t)).reverse();
    const hasRoutes = (data.routes || []).some((r) => r.day === t0 || r.day === t1);
    return navBar() + `
      <div class="greeting"><h1>Hallo ${esc(data.user.name)} 👋</h1><p class="meta">${fmtLong(t0)}</p></div>
      <div class="glance">
        ${tile('neu', todo.length, '🆕 einteilen', todo.length > 0)}
        ${tile('heute', waiting.length, '⏳ warten auf Annahme', waiting.some((t) => t.date <= t1))}
        ${tile('heute', data.tasks.filter((t) => onDay(t, t0) && t.status !== 'storniert').length, '🧹 heute')}
        ${tile('page:team', reports.length, '📷 Probleme', reports.length > 0)}
      </div>
      ${pushBanner()}
      ${newsPanel()}
      ${sectionIf(todo.length, 'neu', '🆕 Neu – bitte einteilen', '', list(todo, ''), 'key')}
      ${today.length ? section('heute', '📅 Heute', fmt(t0), list(today, ''), 'key') : '<p class="empty-state" id="heute">☕ Heute keine Reinigungen.</p>'}
      ${hasRoutes ? `<details class="more" id="routen"><summary>🗺️ Routen (beste Reihenfolge)</summary>
        ${(data.routes || []).some((r) => r.day === t0) ? `<div class="subhead">Heute</div>${routeBlock(t0, true)}` : ''}
        ${(data.routes || []).some((r) => r.day === t1) ? `<div class="subhead">Morgen</div>${routeBlock(t1, true)}` : ''}</details>` : ''}
      ${sectionIf(tomorrow.length, 'morgen', '📅 Morgen', fmt(t1), list(tomorrow, ''))}
      ${sectionIf(soon.length, 'bald', '🗓️ Nächste 14 Tage', '', list(soon, ''))}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, '')}</details>` : ''}`;
  }

  /** Geräte/Adressen mit falschen Codes – freischalten gibt wieder 3 Versuche */
  function locksBlock(locks) {
    const stage = (l) => l.blocked ? '<span class="chip alert">dauerhaft gesperrt</span>'
      : l.lockedUntil ? `<span class="chip wait">gesperrt bis ${esc(clock(l.lockedUntil))}</span>` : `<span class="chip wait">Stufe ${l.stage} – 1 Versuch übrig</span>`;
    return (locks.length ? locks.map((l) => `<div class="panel"><div class="person"><b>Adresse ${esc(l.ip)}</b>
        <span class="meta">letzter Fehlversuch ${esc(fmtTime(l.lastAt))}</span></div>
      <div class="chips">${stage(l)}</div>
      <div class="actions"><button class="go" data-unlock="${esc(l.ip)}">Freischalten (3 neue Versuche)</button></div></div>`).join('')
      : '<p class="empty">Keine gesperrten Anmeldungen.</p>')
      + '<p class="meta">Regel: 3 Versuche → 1 Min. Sperre, danach je 1 Versuch → 5 / 30 / 60 Min., dann dauerhaft gesperrt.</p>';
  }

  /** Empfohlene Route(n) eines Tages */
  function routeBlock(day, perPerson) {
    const routes = (data.routes || []).filter((r) => r.day === day);
    if (!routes.length) return `<p class="empty">Keine Reinigungen an diesem Tag.</p>`;
    return routes.map((r) => `<div class="panel route">
      ${perPerson ? `<b>${esc(r.who ? r.whoName || 'Mitarbeiterin' : 'Noch nicht zugewiesen')}</b> · ` : ''}<span class="meta">${r.stops.length} Stopp${r.stops.length === 1 ? '' : 's'}${r.totalKm ? ` · ca. ${String(r.totalKm).replace('.', ',')} km Luftlinie` : ''}</span>
      <ol>${r.stops.map((s, i) => `<li><span class="n">${i + 1}</span><div>
        <button type="button" class="link" data-jump="task-${esc(s.taskId)}">${esc(s.apartmentName)}</button>
        ${s.address ? `<div class="meta">📍 ${esc(s.address)}</div>` : ''}
        ${s.reason ? `<div class="chips"><span class="chip ${s.group === 0 ? 'alert' : 'period'}">${esc(s.reason)}</span></div>` : ''}
        ${s.km != null ? `<div class="km">↳ ${s.km < 0.05 ? 'gleiches Haus' : String(s.km).replace('.', ',') + ' km vom vorherigen Stopp'}</div>` : ''}

      <p class="meta" style="margin-top:6px">Reihenfolge: zuerst Wohnungen mit Anreise heute (nach Check-in-Zeit), dann kürzeste Wege, zum Schluss was auch später erledigt werden darf.</p>
    </div>`).join('');

  // ---- Statistik (Admin): Auslastung der nächsten 30 Nächte inkl. Sperrzeiten ----
  const pctText = (v) => `${String(Math.round(v * 10) / 10).replace('.', ',')} %`;
  const charts = {}; // Diagramm-ID → Punkte (für das Fadenkreuz)
  let statsMonths = 3;  // angezeigter Zeitraum im Verlauf (Standard 3 Monate, per Knopf je 3 Monate mehr)
  function statsBlock() {
    const st = data.stats;
    if (!st) return '';
    const c = st.current;
    const allHist = st.history || [];
    const since = addDays(data.today, -Math.round(statsMonths * 30.5));
    const hist = allHist.filter((h) => h.date >= since);
    const olderAvailable = allHist.some((h) => h.date < since);
    const rangeBar = `<div class="actions range">
      <span class="meta">Verlauf: letzte ${statsMonths} Monate${hist.length ? ` (ab ${fmt(hist[0].date)})` : ''}</span>
      ${olderAvailable ? '<button class="small" data-stats-more>＋ 3 Monate früher</button>' : ''}
      ${statsMonths > 3 ? '<button class="small" data-stats-reset>Nur 3 Monate</button>' : ''}</div>`;
    const ago = (n) => allHist.find((h) => h.date === addDays(data.today, -n));
    const delta = (h, label) => h ? `<span class="delta">${c.pct - h.pct >= 0 ? '▲' : '▼'} ${pctText(Math.abs(c.pct - h.pct))} ggü. ${label}</span>` : '';
    const rows = c.perApartment.map((a) => `<tr><td>${esc(a.name)}</td><td style="width:45%"><div class="bar" style="width:${Math.max(a.pct, 0.5)}%"></div></td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${pctText(a.pct)}</td><td class="meta">${a.booked} gebucht${a.blocked ? ` · ${a.blocked} blockiert` : ''}</td></tr>`).join('');
    // 1) Tatsächliche Belegung je Nacht (rückblickend)
    const act = hist.filter((h) => h.actual && h.date <= data.today);
    charts['act-chart'] = act.map((h) => ({ date: h.date, v: h.actual.pct, dashed: false,
      sub: `gebucht ${pctText(h.actual.bookedPct)} · blockiert ${pctText(h.actual.blockedPct)}` }));
    const a30 = st.actual30;
    const actualPanel = `<div class="panel">
      <div class="eyebrow">Tatsächliche Belegung · rückblickend je Nacht</div>
      ${a30 ? `<div class="kpi"><span class="big">${pctText(a30.pct)}</span><span class="delta">Ø letzte ${a30.nights} Nächte · inkl. Blockierungen</span></div>
        <p class="meta" style="margin-top:4px">davon gebucht ${pctText(a30.bookedPct)} · blockiert ${pctText(a30.blockedPct)}</p>`
        : '<p class="meta" style="margin-top:6px">Noch keine Werte – bitte einmal „Rückwirkend berechnen“ tippen.</p>'}
      ${act.length > 1 ? `<div class="chart" id="act-chart" role="img" aria-label="Tatsächliche Belegung je Nacht">${chartSvg(charts['act-chart'])}<div class="tip" hidden></div></div>
        <p class="meta">Jeder Punkt = Anteil der Wohnungen, die in dieser Nacht belegt waren (gebucht oder blockiert).</p>` : ''}
    </div>`;
    // 2) Vorausblick: Auslastung der nächsten 30 Nächte, wie sie an jedem Tag bekannt war
    charts['occ-chart'] = hist.map((h) => ({ date: h.date, v: h.pct, dashed: h.source === 'rückwirkend',
      sub: `gebucht ${pctText(h.bookedPct)} · blockiert ${pctText(h.blockedPct)}${h.source === 'rückwirkend' ? ' · rückwirkend' : ''}` }));
    const forwardPanel = `<div class="panel" style="margin-top:14px">
      <div class="eyebrow">Vorausblick · Auslastung nächste ${st.days} Tage inkl. Blockierungen</div>
      <div class="kpi"><span class="big">${pctText(c.pct)}</span>${delta(ago(7), 'vor 7 Tagen')}${delta(ago(30), 'vor 30 Tagen')}</div>
      <p class="meta" style="margin-top:4px">${c.bookedNights + c.blockedNights} von ${c.capacity} Nächten belegt · gebucht ${pctText(c.bookedPct)} · blockiert ${pctText(c.blockedPct)}</p>
      ${hist.length > 1 ? `<div class="chart" id="occ-chart" role="img" aria-label="Verlauf des Vorausblicks">${chartSvg(charts['occ-chart'])}<div class="tip" hidden></div></div>
        <p class="meta">Jeder Punkt = an diesem Tag schon bekannte Belegung der folgenden ${st.days} Nächte.${hist.some((h) => h.source === 'rückwirkend') ? ' Gestrichelt = rückwirkend aus dem Buchungsdatum berechnet.' : ''}</p>`
        : '<p class="meta" style="margin-top:8px">Der Verlauf füllt sich ab heute täglich automatisch.</p>'}
    </div>`;
    return `${rangeBar}${actualPanel}${forwardPanel}
      <div class="panel" style="margin-top:14px">
        <p class="meta">Berechnet mit <b>${st.apartments} Wohnungen</b> (#EINS–#DREIZEHN).${(st.excluded || []).length ? ` Nicht mitgezählt: ${st.excluded.map(esc).join(', ')}.` : ''}
          ${st.backfill ? ` Rückwirkend berechnet ${fmtTime(st.backfill.at)}${st.backfill.oldest ? ` ab ${fmt(st.backfill.oldest)}` : ''}.` : ''}</p>
        <div class="actions"><button class="small" data-backfill>${st.backfill ? 'Rückwirkend neu berechnen (1,5 Jahre)' : 'Rückwirkend berechnen (letzte 1,5 Jahre)'}</button></div>
      </div>
      <details class="more" id="night-check"><summary>Nacht prüfen (direkt aus Smoobu)</summary><div class="panel">
        <div class="form-grid"><label class="field">Nacht vom <input type="date" id="night-day" value="${addDays(data.today, -1)}"></label>
          <button class="primary" data-night-check>Prüfen</button></div>
        <div id="night-result"></div></div></details>
    ${sizeBlock(st)}
    <details class="more"><summary>Je Wohnung (nächste ${st.days} Nächte)</summary><div class="panel scroll"><table class="bars">${rows}</table></div></details>
    ${categoryEditor(st)}
    <details class="more"><summary>Werte als Tabelle</summary><div class="panel scroll"><table>
      <tr><th>Tag</th><th>tatsächlich</th><th>Vorausblick 30 T.</th></tr>
      ${hist.slice().reverse().map((h) => `<tr><td>${fmt(h.date)}</td><td style="text-align:right">${h.actual ? pctText(h.actual.pct) : '–'}</td>
        <td style="text-align:right">${pctText(h.pct)}${h.source === 'rückwirkend' ? ' <span class="meta">(rückw.)</span>' : ''}</td></tr>`).join('')}</table></div></details>`;
  }

  /** Auslastung nach Wohnungsgröße: gebucht (= Nachfrage) als Balken, inkl. Blockierungen daneben */
  function sizeBlock(st) {
    const groups = st.groups || [];
    if (!groups.length) return '';
    const byId = Object.fromEntries(st.current.perApartment.map((a) => [a.id, a]));
    const allBooked = st.current.capacity ? Math.round((st.current.bookedNights / st.current.capacity) * 1000) / 10 : 0;
    return `<div class="panel" style="margin-top:14px">
      <div class="eyebrow">Nach Wohnungsgröße · nächste ${st.days} Tage</div>
      <p class="meta" style="margin:4px 0 10px">Balken = <b>gebucht</b> (echte Nachfrage). Durchschnitt aller Wohnungen: ${pctText(allBooked)} gebucht.</p>
      <div class="size-list">${groups.map((g) => {
        const weak = g.apartments.map((id) => byId[id]).filter((a) => a && g.count > 1 && a.bookedPct < g.bookedPct - 20);
        const verdict = g.bookedPct >= allBooked + 10 ? '<span class="chip yes">läuft gut</span>' : g.bookedPct <= allBooked - 10 ? '<span class="chip alert">läuft schwach</span>' : '';
        return `<div class="size-row">
          <div class="size-head"><span><b>${esc(g.category)}</b> <span class="meta">· ${g.count} ${g.count === 1 ? 'Wohnung' : 'Wohnungen'}</span> ${verdict}</span>
            <b class="size-val">${pctText(g.bookedPct)}</b></div>
          <div class="track"><div class="bar" style="width:${Math.max(g.bookedPct, 0.5)}%" title="${esc(g.category)}: ${pctText(g.bookedPct)} gebucht"></div>
            <div class="avg" style="left:${allBooked}%" title="Durchschnitt ${pctText(allBooked)}"></div></div>
          <div class="meta">inkl. Blockierungen ${pctText(g.pct)}${weak.length ? ` · unter Gruppenschnitt: ${weak.map((a) => `${esc(a.name)} (${pctText(a.bookedPct)})`).join(', ')}` : ''}</div>
        </div>`;
      }).join('')}</div>
      <p class="meta" style="margin-top:6px">Senkrechter Strich = Durchschnitt aller Wohnungen.</p>
      ${groups.some((g) => g.category === 'ohne Angabe') ? '<p class="meta" style="margin-top:8px">„ohne Angabe“: Größe (noch) nicht aus Smoobu gelesen – unten unter „Kategorien festlegen“ selbst eintragen.</p>' : ''}
    </div>`;
  }

  /** Größenkategorie je Wohnung selbst festlegen (leer = automatisch aus Smoobu) */
  function categoryEditor(st) {
    const cats = [...new Set((st.groups || []).map((g) => g.category).concat(['1 Zimmer', '2 Zimmer', '3 Zimmer']))];
    return `<details class="more"><summary>Kategorien festlegen</summary><div class="panel">
      <p class="meta">Standard: feste Zuordnung (1 Zimmer: Wohnungen 1, 2, 4, 7, 8, 10, 11, 12 · 3 Zimmer: 3, 5, 6, 9, 13), sonst aus Smoobu. Eigene Bezeichnung überschreibt das – leer lassen für Standard.</p>
      <datalist id="cat-list">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <table class="bars">${st.current.perApartment.map((a) => `<tr><td>${esc(a.name)}<div class="meta">${a.bedrooms != null ? `${a.bedrooms} Schlafz.` : ''}${a.bedrooms != null && a.maxOccupancy != null ? ' · ' : ''}${a.maxOccupancy != null ? `bis ${a.maxOccupancy} Pers.` : ''}${a.bedrooms == null && a.maxOccupancy == null ? 'keine Angabe aus Smoobu' : ''}</div></td>
        <td><input list="cat-list" data-cat-input="${esc(a.id)}" value="${esc(a.ownCategory)}" placeholder="${esc(a.category)}" aria-label="Kategorie ${esc(a.name)}" style="width:100%"></td>
        <td><button class="small" data-cat-save="${esc(a.id)}">Speichern</button></td></tr>`).join('')}</table></div></details>`;
  }

  /** Liniendiagramm (eine Reihe, 0–100 %), rückwirkende Werte gestrichelt */
  const CH = { w: 600, h: 190, l: 34, r: 44, t: 10, b: 24 };
  function chartSvg(points) {
    // Maßstab 1:1 zur Bildschirmbreite, damit Schrift auf dem Handy lesbar bleibt
    CH.w = Math.round(Math.min(640, Math.max(300, (window.innerWidth || 600) - 70)));
    CH.h = CH.w < 420 ? 170 : 190;
    const n = points.length;
    const x = (i) => CH.l + (n === 1 ? 0 : (i / (n - 1)) * (CH.w - CH.l - CH.r));
    const y = (v) => CH.t + (1 - v / 100) * (CH.h - CH.t - CH.b);
    const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${CH.l}" x2="${CH.w - CH.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${CH.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
    let paths = '';
    for (let i = 1; i < n; i++) {
      const dashed = points[i].dashed || points[i - 1].dashed;
      paths += `<line x1="${x(i - 1)}" y1="${y(points[i - 1].v)}" x2="${x(i)}" y2="${y(points[i].v)}" stroke="var(--chart)" stroke-width="2" stroke-linecap="round"${dashed ? ' stroke-dasharray="4 4"' : ''}/>`;
    }
    const last = points[n - 1];
    const labels = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i)
      .map((i) => `<text x="${x(i)}" y="${CH.h - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${fmt(points[i].date)}</text>`).join('');
    return `<svg viewBox="0 0 ${CH.w} ${CH.h}" aria-hidden="true">${grid}${paths}
      <circle cx="${x(n - 1)}" cy="${y(last.v)}" r="5" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/>
      <text x="${x(n - 1) + 8}" y="${y(last.v) + 4}" font-size="12" font-weight="700" fill="var(--text)">${pctText(last.v)}</text>
      ${labels}
      <line class="cross" x1="0" x2="0" y1="${CH.t}" y2="${CH.h - CH.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      <circle class="dot" r="5" fill="var(--chart)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
      <rect class="hit" x="${CH.l}" y="0" width="${CH.w - CH.l - CH.r}" height="${CH.h}" fill="transparent"/></svg>`;
  }
  /** Fadenkreuz + Tooltip: springt zum nächsten Tag */
  function bindChart() {
    for (const [id, points] of Object.entries(charts)) {
      const box = document.getElementById(id);
      if (!box || !points.length) continue;
      const n = points.length;
      const svg = box.querySelector('svg'), tip = box.querySelector('.tip');
      const cross = svg.querySelector('.cross'), dot = svg.querySelector('.dot');
      const move = (e) => {
        const r = svg.getBoundingClientRect();
        const sx = ((e.clientX - r.left) / r.width) * CH.w;
        const i = Math.max(0, Math.min(n - 1, Math.round(((sx - CH.l) / (CH.w - CH.l - CH.r)) * (n - 1))));
        const px = CH.l + (n === 1 ? 0 : (i / (n - 1)) * (CH.w - CH.l - CH.r));
        const py = CH.t + (1 - points[i].v / 100) * (CH.h - CH.t - CH.b);
        cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
        dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('visibility', 'visible');
        tip.hidden = false;
        tip.style.top = `${Math.max((py / CH.h) * r.height, 60)}px`;
        tip.textContent = '';
        const b = document.createElement('b'); b.textContent = pctText(points[i].v);
        const small = document.createElement('span'); small.className = 'meta';
        small.textContent = `${fmt(points[i].date)} · ${points[i].sub}`;
        tip.append(b, small);
        const left = (px / CH.w) * r.width - tip.offsetWidth / 2;
        tip.style.left = `${Math.max(0, Math.min(r.width - tip.offsetWidth, left))}px`;
      };
      const leave = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
      svg.addEventListener('pointermove', move);
      svg.addEventListener('pointerdown', move);
      svg.addEventListener('pointerleave', leave);
    }
  }

  function shoppingBlock() {
    const list = data.shopping || [];
    if (!list.length) return '<p class="empty">Nichts gemeldet – alles aufgefüllt.</p>';
    return list.map((x) => `<article class="task"><div class="task-top"><h3>🛒 ${esc(x.de)}${x.custom ? ' <span class="chip manual">✏️ frei eingetragen</span>' : ''}</h3>
        <button class="small go" data-supply-done data-item="${esc(x.id)}">Überall aufgefüllt</button></div>
      <div class="chips">${x.apartments.map((a) => `<button class="small" data-supply-done data-item="${esc(x.id)}" data-apt="${esc(a.id)}"
        title="gemeldet ${esc(fmtTime(a.at))} von ${esc(nameOf(a.by))}">✓ ${esc(a.name)}</button>`).join('')}</div></article>`).join('')
      + '<p class="meta">Wohnung antippen = dort aufgefüllt.</p>';
  }

  function reportsBlock(reports) {
    return reports.length ? reports.map((r) => `<article class="task"><div class="eyebrow">${esc(dayWord(r.date))} · ${fmtLong(r.date)}</div>
      <h3>${esc(r.apartmentName)}</h3>${reportHtml({ id: r.taskId }, r)}</article>`).join('') : '<p class="empty">Keine offenen Meldungen.</p>';
  }

  const pushFailedRecently = () => data.pushReport && data.pushReport.failed > 0 && Date.now() - Date.parse(data.pushReport.at) < 3 * 3600000;

  // ---- Admin ------------------------------------------------------------------
  // ---- Seiten & Navigation (Admin, Leitung) --------------------------------------
  // Admin: Reinigungen | Kalender | Meldungen | Statistik | Verwaltung – Leitung: Reinigungen | Kalender | Team
  const PAGE_PATHS = { main: '/', meldungen: '/meldungen', statistik: '/statistik', team: '/team', einstellungen: '/einstellungen' };
  const pageFromPath = () => Object.keys(PAGE_PATHS).find((k) => PAGE_PATHS[k] === location.pathname.replace(/\/+$/, '')) || 'main';
  let page = pageFromPath();
  // Abschnitt → Seite (für Sprünge aus „Handlungsbedarf“ auf eine andere Seite)
  const PAGE_OF = { team: 'team', sperren: 'team', codes: 'einstellungen', system: 'einstellungen', push: 'einstellungen',
    'owner-code': 'einstellungen', meldungen: 'meldungen', einkauf: 'meldungen', statistik: 'statistik' };

  function navBar() {
    const r = role();
    if (r === 'staff') return '';
    const reports = (data.openReports || []).length, shop = (data.shopping || []).length;
    const blockedLocks = (data.loginLocks || []).filter((l) => l.blocked).length;
    const tabs = r === 'owner'
      ? [['main', '🧹 Reinigungen', ''], ['kalender', '📅 Kalender', ''], ['meldungen', '📷 Meldungen', reports + shop || ''],
        ['statistik', '📊 Statistik', data.stats ? pctText(data.stats.current.pct) : ''], ['team', '👥 Team', blockedLocks || ''], ['einstellungen', '⚙️ Einstellungen', '']]
      : [['main', '🧹 Reinigungen', ''], ['kalender', '📅 Kalender', ''], ['team', '👥 Team & Probleme', reports || '']];
    const current = view === 'calendar' ? 'kalender' : page;
    return `<nav class="pagenav" aria-label="Bereiche">${tabs.map(([id, label, badge]) => `<button type="button" data-page="${id}" class="${id === current ? 'on' : ''}"
      ${id === current ? 'aria-current="page"' : ''}>${esc(label)}${badge !== '' ? ` <span class="badge">${esc(String(badge))}</span>` : ''}</button>`).join('')}</nav>`;
  }

  async function goPage(id, target) {
    if (id === 'kalender') { calFrom = null; return openCalendar(true); }
    page = id;
    view = 'main';
    if (location.pathname.replace(/\/+$/, '') !== PAGE_PATHS[id]) history.pushState({ page: id }, '', PAGE_PATHS[id] || '/');
    render();
    if (target) {
      const el = document.getElementById(target);
      if (el) { const det = el.closest('details'); if (det) det.open = true; if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    }
    window.scrollTo(0, 0);
  }

  /** Abschnitt nur mit Inhalt: ohne Inhalt keine Überschrift */
  const sectionIf = (show, ...args) => (show ? section(...args) : '');

  function renderOwner() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const tasks = data.tasks;
    const active = tasks.filter(isActive);
    const requests = data.openRequests || [];
    const keys = data.missingKeys || [];
    const locks = data.loginLocks || [];
    const reports = data.openReports || [];
    const unconfirmed = active.filter((t) => t.status === 'offen' && lastDay(t) >= t0);
    const alarms = active.filter((t) => t.overdue || t.lateAlerted);
    const notices = `
      ${data.syncError ? `<div class="notice bad"><span><b>Abgleich mit Smoobu gestört:</b> ${esc(data.syncError)}</span><button class="small" data-jump="system">Details</button></div>` : ''}
      ${pushFailedRecently() ? `<div class="notice bad"><span><b>Push-Nachrichten konnten nicht zugestellt werden</b> (${fmtTime(data.pushReport.at)}):
        ${esc(data.pushReport.errors[0] ? data.pushReport.errors[0].error : '')}</span><button class="small" data-jump="system">Details</button></div>` : ''}`;
    const body = page === 'meldungen' ? ownerReportsPage(reports)
      : page === 'statistik' ? `<div class="greeting"><h1>Statistik</h1><p class="meta">Stand ${esc(data.time)} Uhr</p></div>${statsBlock()}`
      : page === 'team' ? ownerTeamPage(locks)
      : page === 'einstellungen' ? ownerSettingsPage()
      : ownerMainPage({ t0, t1, t14, tasks, active, requests, keys, locks, reports, unconfirmed, alarms });
    return navBar() + notices + body;
  }

  function ownerMainPage({ t0, t1, t14, tasks, active, requests, keys, locks, reports, unconfirmed, alarms }) {
    // Reinigungen mit offenem Antrag stehen oben im eigenen Abschnitt (nicht doppelt)
    const reqIds = new Set(requests.map((q) => q.taskId));
    const shown = tasks.filter((t) => !reqIds.has(t.id));
    const today = shown.filter((t) => onDay(t, t0));
    const tomorrow = shown.filter((t) => t.date === t1);
    const soon = shown.filter((t) => t.date > t1 && t.date <= t14);
    const later = shown.filter((t) => t.date > t14);
    const past = shown.filter((t) => t.date < t0 && !today.includes(t)).reverse();
    const todayCount = tasks.filter((t) => onDay(t, t0) && t.status !== 'storniert').length;
    const urgent = [
      ...locks.filter((l) => l.blocked).map((l) => ['sperren', `Anmeldung dauerhaft gesperrt: Adresse ${l.ip} – freischalten?`]),
      ...tasks.filter((t) => t.releaseBlock).map((t) => [`task-${t.id}`, `Blockierung in Smoobu aufheben: ${t.apartmentName} ${fmt(t.releaseBlock.from)} – ${fmt(t.releaseBlock.to)} (späterer Tag nicht mehr nötig)`]),
      ...active.filter((t) => t.needsBlock).map((t) => [`task-${t.id}`, `In Smoobu blockieren: ${t.apartmentName} ${fmt(t.needsBlock.from)} – ${fmt(t.needsBlock.to)} (Reinigung verschoben)`]),
      ...keys.map((k) => [`task-${k.taskId}`, `Schlüssel fehlen: ${k.apartmentName} (gemeldet ${clock(k.doneAt)} von ${nameOf(k.doneBy)})${k.note ? ' – ' + k.note : ''}`]),
      ...requests.map((q) => [`task-${q.taskId}`, `Antrag: ${q.apartmentName} – Reinigung bis ${fmt(q.until)} (${nameOf(q.by)})`]),
      ...alarms.map((t) => [`task-${t.id}`, `${t.apartmentName} – ${dayWord(t.date)}: ${
        t.overdue === 'start' ? 'noch nicht begonnen' : t.overdue ? (t.startedAt ? 'noch nicht beendet' : 'nicht erledigt') : 'nicht rechtzeitig bestätigt'}`]),
      ...unconfirmed.filter((t) => !t.lateAlerted && t.date <= t1).map((t) => [`task-${t.id}`, `${t.apartmentName} – ${dayWord(t.date)}: noch nicht vollständig bestätigt`]),
      ...(!data.hasOwnerCode ? [['team', 'Eigenen 6-stelligen Admin-Code festlegen']] : []),
      ...(!(data.leads || []).length ? [['team', 'Noch keine Reinigungsleitung angelegt']] : []),
    ];
    const hasRoutes = (data.routes || []).some((r) => r.day === t0 || r.day === t1);
    const apartments = data.apartments || [];
    const manualForm = `<form class="panel" id="manual-form">
      <div class="form-grid">
        <label class="field">Wohnung / Einheit
          <select id="m-apt" required><option value="">Bitte wählen …</option>${apartments.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label>
        <label class="field">Datum <input id="m-date" type="date" required min="${t0}" value="${t1}"></label>
      </div>
      <label class="field" style="margin-top:10px">Hinweis für die Reinigung (optional)
        <input id="m-note" maxlength="500" placeholder="z. B. Zwischenreinigung, Fenster putzen, Bettwäsche wechseln"></label>
      <div class="actions"><button class="primary" type="submit">Eintragen und Reinigungsleitung benachrichtigen</button></div>
    </form>`;
    return `
      <div class="greeting"><h1>${fmtLong(t0)}</h1><p class="meta">🔄 Stand ${esc(data.time)} Uhr</p></div>
      <div class="glance">
        ${tile('heute', todayCount, '🧹 heute')}
        ${tile('heute', unconfirmed.length, '⏳ nicht angenommen', unconfirmed.some((t) => t.date <= t1))}
        ${tile('heute', alarms.length, '⏰ überfällig', alarms.length > 0)}
        ${tile('page:meldungen', reports.length, '📷 Probleme', reports.length > 0)}
      </div>
      ${!pushDone() ? `<div class="notice"><span>🔔 Push-Nachrichten auf diesem Konto noch nicht eingerichtet.</span><button class="small" data-jump="push">Einrichten</button></div>` : ''}
      ${urgent.length ? (() => {
        const item = ([id, text]) => `<li><button type="button" data-jump="${esc(id)}">${esc(text)}</button></li>`;
        return `<div class="todo"><b>👉 Bitte erledigen (${urgent.length})</b><ul>${urgent.slice(0, 5).map(item).join('')}</ul>
          ${urgent.length > 5 ? `<details><summary>… und ${urgent.length - 5} weitere</summary><ul>${urgent.slice(5).map(item).join('')}</ul></details>` : ''}</div>`;
      })() : ''}
      ${sectionIf(requests.length, 'antraege', '📨 Anfragen: später reinigen', '',
        list(requests.map((q) => tasks.find((t) => t.id === q.taskId)).filter(Boolean), ''), 'key')}
      ${today.length ? section('heute', '📅 Heute', fmt(t0), list(today, ''), 'key') : `<p class="empty-state" id="heute">☕ Heute keine Reinigungen.</p>`}
      ${hasRoutes ? `<details class="more" id="routen"><summary>🗺️ Routen (beste Reihenfolge)</summary>
        ${(data.routes || []).some((r) => r.day === t0) ? `<div class="subhead">Heute</div>${routeBlock(t0, true)}` : ''}
        ${(data.routes || []).some((r) => r.day === t1) ? `<div class="subhead">Morgen</div>${routeBlock(t1, true)}` : ''}</details>` : ''}
      ${sectionIf(tomorrow.length, 'morgen', '📅 Morgen', fmt(t1), list(tomorrow, ''))}
      ${sectionIf(soon.length, 'bald', '🗓️ Nächste 14 Tage', '', list(soon, ''))}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, '')}</details>` : ''}
      <details class="more" id="manuell"><summary>➕ Extra-Reinigung eintragen</summary>${manualForm}</details>`;
  }

  function ownerReportsPage(reports) {
    const shop = data.shopping || [];
    const keys = data.missingKeys || [];
    if (!reports.length && !shop.length && !keys.length) {
      return `<div class="greeting"><h1>Meldungen</h1></div><p class="empty-state">Keine offenen Meldungen, nichts einzukaufen ✓</p>`;
    }
    return `<div class="greeting"><h1>Meldungen</h1><p class="meta">Probleme aus den Wohnungen und was fehlt</p></div>
      ${sectionIf(reports.length, 'meldungen', 'Offene Meldungen', reports.length + ' offen', reportsBlock(reports), 'key')}
      ${sectionIf(shop.length, 'einkauf', 'Einkaufsliste', shop.length + ' Artikel', shoppingBlock())}`;
  }

  function ownerTeamPage(locks) {
    return `<div class="greeting"><h1>Team</h1><p class="meta">Reinigungsleitung, Mitarbeiterinnen und ihre Anmeldecodes</p></div>
      ${codeBox()}
      ${section('team', 'Reinigungsteam', (() => { const n = (data.leads || []).length + (data.staff || []).length; return n === 1 ? '1 Person' : n + ' Personen'; })(),
        teamList('lead', data.leads || [], 'Reinigungsleitung') + teamList('staff', data.staff || [], 'Mitarbeiterinnen'), 'key')}
      ${sectionIf(locks.length, 'sperren', 'Gesperrte Anmeldungen', locks.length + ' Adresse(n)', locksBlock(locks))}`;
  }

  function ownerSettingsPage() {
    const apartments = data.apartments || [];
    const ownerCode = `<form class="panel" id="owner-code">
        <b>Mein Admin-Code</b>
        <p class="meta" style="margin:4px 0 8px">${data.hasOwnerCode ? 'Eingerichtet ✓ – hier ändern.' : 'Noch nicht eingerichtet – damit reicht auf der Startseite der Code.'}</p>
        <div class="form-grid"><label class="field">Neuer 6-stelliger Code
          <input id="owner-code-input" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="z. B. 482913" required></label>
          <button class="primary" type="submit">${data.hasOwnerCode ? 'Code ändern' : 'Code festlegen'}</button></div>
        <p class="meta" style="margin-top:6px">Nicht erlaubt: 123456, 111111 usw. Notzugang ohne Code: <b>/admin</b> mit Passwort.</p>
      </form>`;
    return `<div class="greeting"><h1>Einstellungen</h1><p class="meta">Zugangscodes, Admin-Code, Nachrichten und System</p></div>
      ${section('codes', 'Zugangscodes der Wohnungen', 'verschlüsselt gespeichert', codeEditorHtml())}
      ${section('owner-code-sec', 'Mein Admin-Code', '', ownerCode)}
      ${pushDone() ? pushSetup() : section('push-sec', 'Push-Nachrichten', 'noch nicht eingerichtet', pushGuide(false))}
      <details class="more"><summary>Verschickte Nachrichten</summary>${(data.log || []).map((n) => `<div class="report"><div class="meta">${fmtTime(n.at)} → ${esc(n.toName)}</div><p><b>${esc(n.title)}</b><br>${esc(n.body)}</p></div>`).join('') || '<p class="empty">Noch keine.</p>'}</details>
      <details class="more" id="system"><summary>System &amp; Smoobu</summary>
        <div class="panel">
          <p class="meta">Letzter Smoobu-Abgleich: <b>${fmtTime(data.lastSync)}</b>${data.lastSyncCount != null ? ` · ${data.lastSyncCount} Buchungen` : ''}. Automatisch alle 5 Minuten.</p>
          <div class="actions"><button class="small" data-sync>Jetzt abgleichen</button><button class="small" data-diagnose>Diagnose</button></div>
          <div id="diagnose"></div>
          <p class="meta" style="margin-top:10px"><b>Erinnerungen:</b> überfällig ab ${esc(data.rules.startBy)} Uhr (nicht begonnen) bzw.
            ${esc(data.rules.finishBy)} Uhr (nicht beendet), Wiederholung alle ${esc(data.rules.repeatMinutes)} Min., <b>Nachtruhe ab ${esc(data.rules.quietFrom)} Uhr</b>.
            Letzte Prüfung: ${fmtTime(data.lastRun)} (alle 5 Min.).</p>
          <p class="meta" style="margin-top:10px"><b>Letzter Push-Versand:</b> ${data.pushReport
            ? `${fmtTime(data.pushReport.at)} – ${data.pushReport.sent} zugestellt${data.pushReport.failed ? `, <b style="color:var(--bad)">${data.pushReport.failed} fehlgeschlagen</b>` : ''}
              ${(data.pushReport.errors || []).map((e) => `<br>→ ${esc(e.to)}: ${esc(e.title)} – <span style="color:var(--bad)">${esc(e.error)}</span>`).join('')}`
            : 'noch keiner'}</p>
          <p class="meta" style="margin-top:10px">Push-Versand (ntfy): ${data.hasNtfyToken ? '<b>mit ntfy-Konto (NTFY_TOKEN) ✓</b>'
            : '<b style="color:var(--bad)">ohne ntfy-Konto</b> – bei „429“ bitte NTFY_TOKEN in Cloudflare eintragen'}</p>
          <p class="meta" style="margin-top:10px">Optional – Webhook-Adresse für Smoobu (sofortige Aktualisierung):<br><code id="hook">${esc(data.webhookUrl)}</code> <button class="small" data-copy="hook">Kopieren</button></p>
        </div>
        <div class="panel scroll"><b>Wohnungen aus Smoobu (${apartments.length})</b><table>
          ${apartments.map((a) => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.id)}</code></td></tr>`).join('') || '<tr><td class="meta">Erscheinen nach dem ersten Abgleich.</td></tr>'}</table></div>
      </details>
      ${data.allowReset ? `<details class="more"><summary>Testphase: Alles zurücksetzen</summary><div class="panel danger-zone">
        <p class="meta" style="margin:0 0 10px">Löscht alle Reinigungen, Bestätigungen, Meldungen, Fotos und Nachrichten und lädt frisch aus Smoobu. Team und Codes bleiben erhalten. Keine Push-Nachrichten.</p>
        <form id="reset-form" class="form-grid"><label class="field">Zur Bestätigung <b>ZURÜCKSETZEN</b> eingeben
          <input id="reset-confirm" autocomplete="off" placeholder="ZURÜCKSETZEN"></label>
          <button class="danger" type="submit">Alles zurücksetzen</button></form>
      </div></details>` : ''}`;
  }

  // ---- Belegungskalender ------------------------------------------------------
  let view = location.pathname.replace(/\/+$/, '') === '/kalender' ? 'calendar' : 'main';
  let cal = null;
  let calFrom = null;
  const CAL_DAYS = 35;
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);

  async function openCalendar(push) {
    if (push) history.pushState({ view: 'calendar' }, '', '/kalender');
    view = 'calendar';
    if (!calFrom) calFrom = addDays(data.today, -3);
    $('app').innerHTML = '<p class="empty" style="margin-top:24px">Kalender wird geladen …</p>';
    cal = await api(`/api/calendar?from=${calFrom}&days=${CAL_DAYS}`);
    renderCalendar();
  }
  function closeCalendar() {
    view = 'main';
    page = 'main';
    history.pushState({ page: 'main' }, '', '/');
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', () => {
    if (!data) return;
    if (location.pathname.replace(/\/+$/, '') === '/kalender') openCalendar(false).catch((e) => toast(e.message));
    else { view = 'main'; page = pageFromPath(); render(); window.scrollTo(0, 0); }
  });

  function openModal(html) {
    $('modal-body').innerHTML = html + '<div class="actions" style="margin-top:16px"><button type="button" data-close-modal>Schließen</button></div>';
    $('modal').hidden = false;
    translate($('modal-body'));
    const btn = $('modal-body').querySelector('button, a');
    if (btn) btn.focus();
  }
  function closeModal() { $('modal').hidden = true; $('modal-body').innerHTML = ''; }
  const telButton = (phone) => phone
    ? `<a class="phone" href="tel:${esc(phone.replace(/[^\d+]/g, ''))}">${PHONE_ICON} ${esc(phone)}</a>` : '<span class="meta">keine Nummer hinterlegt</span>';

  function bookingDetails(id) {
    const b = cal.bookings.find((x) => x.id === id);
    const a = cal.apartments.find((x) => x.id === b.apartmentId);
    const nights = diffDays(b.arrival, b.departure);
    const cleaning = cal.cleanings.find((c) => c.id === b.id);
    openModal(`<div class="eyebrow">${a.number} · ${esc(a.name)}</div>
      <h3 id="modal-title">${b.blocked ? 'Blockiert' : esc(b.guest || 'Buchung')}</h3>
      <dl>
        <dt>Anreise</dt><dd>${fmtLong(b.arrival)}</dd>
        <dt>Abreise</dt><dd>${fmtLong(b.departure)}</dd>
        <dt>Dauer</dt><dd>${nights} ${nights === 1 ? 'Nacht' : 'Nächte'}</dd>
        ${b.blocked ? '' : `<dt>Gäste</dt><dd>${b.guests ? esc(b.guests) : '<span class="meta">nicht angegeben</span>'}</dd>`}
        ${b.blocked ? '<dt>Art</dt><dd>Sperrzeit aus Smoobu (keine Reinigung)</dd>' : `
        <dt>Telefon</dt><dd>${role() === 'owner' ? telButton(b.phone) : '<span class="meta">nur für Admin</span>'}</dd>
        ${b.channel ? `<dt>Kanal</dt><dd>${esc(b.channel)}</dd>` : ''}`}
        <dt>Smoobu-Nr.</dt><dd>${esc(b.id)}</dd>
      </dl>
      ${cleaning ? `<div class="actions"><button class="primary" data-cal-clean="${esc(cleaning.id)}">Reinigung am ${fmt(cleaning.date)} anzeigen</button></div>` : ''}`);
  }

  function cleaningDetails(id) {
    const c = cal.cleanings.find((x) => x.id === id);
    const a = cal.apartments.find((x) => x.id === c.apartmentId);
    const state = c.overdue ? `<span class="chip alert">überfällig – ${c.overdueReason === 'start' ? 'noch nicht begonnen' : c.startedAt ? 'noch nicht beendet' : 'nicht erledigt'}</span>`
      : c.status === 'erledigt' ? '<span class="chip yes">erledigt ✓</span>'
      : c.status === 'bestätigt' ? '<span class="chip yes">bestätigt</span>' : '<span class="chip wait">offen – noch nicht bestätigt</span>';
    openModal(`<div class="eyebrow">${a.number} · ${esc(a.name)}</div>
      <h3 id="modal-title">${c.manual ? 'Manuelle Reinigung' : 'Endreinigung (Check-out)'}</h3>
      <div class="chips">${state}</div>
      <dl>
        <dt>Datum</dt><dd>${fmtLong(c.date)}${c.latestDate ? ` – ${fmtLong(c.latestDate)} <span class="chip period">Zeitraum</span>` : ''}</dd>
        ${c.periodRequest ? `<dt>Antrag</dt><dd>bis ${fmtLong(c.periodRequest.until)}: ${esc(c.periodRequest.reason)}</dd>` : ''}
        <dt>Leitung</dt><dd>${c.leadConfirmed ? 'bestätigt ✓' : 'noch nicht bestätigt'}</dd>
        <dt>Zugewiesen</dt><dd>${c.assignedTo ? `${esc(c.assignedTo)} ${c.staffConfirmed ? '✓ bestätigt' : '– noch nicht bestätigt'}` : 'noch niemandem'}</dd>
        ${c.startedAt ? `<dt>Begonnen</dt><dd>${clock(c.startedAt)} Uhr</dd>` : ''}
        ${c.doneAt ? `<dt>Erledigt</dt><dd>${clock(c.doneAt)} Uhr${c.startedAt ? ' · ' + duration(c.startedAt, c.doneAt) : ''}</dd>` : ''}
        ${c.status !== 'erledigt' ? `<dt>Nächste Anreise</dt><dd>${c.nextBooking ? `${fmtLong(c.nextBooking.arrival)}${c.nextBooking.checkIn ? ' ab ' + esc(c.nextBooking.checkIn) + ' Uhr' : ''} · ${c.nextBooking.guests ? esc(c.nextBooking.guests) : 'Gästezahl nicht angegeben'}` : 'noch keine Buchung'}</dd>` : ''}
        ${c.keysInBox != null ? `<dt>Schlüssel</dt><dd>${c.keysInBox ? 'in der Box ✓' : c.keysResolved ? 'fehlten – geklärt ✓' : '<b style="color:var(--bad)">NICHT in der Box</b>'}</dd>` : ''}
        ${c.note ? `<dt>Hinweis</dt><dd>${esc(c.note)}</dd>` : ''}
        ${c.reports ? `<dt>Meldungen</dt><dd>${c.reports}</dd>` : ''}
        ${!c.manual ? `<dt>Gast</dt><dd>${telButton(c.guestPhone)}</dd>` : ''}
      </dl>
      <div class="actions"><button class="primary" data-goto-task="${esc(c.id)}">Zur Reinigung in der Übersicht</button></div>`);
  }

  function renderCalendar() {
    const days = Array.from({ length: cal.days }, (_, i) => addDays(cal.from, i));
    const cls = (d) => [utc(d).getUTCDay() % 6 === 0 ? 'we' : '', d === cal.today ? 'today' : ''].filter(Boolean).join(' ');
    const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

    const W = 42;
    const rows = cal.apartments.map((a) => {
      const bars = cal.bookings.filter((b) => b.apartmentId === a.id).map((b) => {
        const start = Math.max(0, diffDays(cal.from, b.arrival) + 0.5);
        const end = Math.min(cal.days, diffDays(cal.from, b.departure) + 0.5);

      // Nummer steht im Kreis → daneben nur die Adresse („#EINS | Allerstraße 9“ → „Allerstraße 9“)

      return `<div class="cal-apt" title="${esc(a.name)}"><b>${a.number}</b><span>${esc(label)}</span></div>
        <div class="cal-row">${days.map((d) => `<div class="cal-cell ${cls(d)}"></div>`).join('')}${bars}${marks}</div>`;
    }).join('');
    $('app').innerHTML = `
      ${navBar()}
      <div class="cal-top">
        <h1 style="margin:0">Belegungskalender</h1>
        <div class="cal-nav"><button class="small" data-cal-shift="-14">‹ 2 Wochen</button><button class="small" data-cal-shift="0">Heute</button><button class="small" data-cal-shift="14">2 Wochen ›</button></div>

      <div class="legend"><span><i style="background:#33414E"></i>Buchung (z. B. „2+1 P.“ = 2 Erwachsene, 1 Kind)</span>
        <span><i style="background:repeating-linear-gradient(135deg,#B9B2A6 0 4px,#8C8579 4px 8px)"></i>blockiert</span>
        <span><i style="background:#FFE9A8;border:1px solid #C9C1B4"></i>heute</span></div>
      <div class="legend" style="margin-top:0"><b style="color:var(--text)">Reinigung:</b>
        <span><span class="sym" style="background:#E07400">!</span>offen</span>

        <span><span class="sym" style="background:#2E7D32">✓</span>erledigt</span>
        <span><span class="sym" style="background:#C62828">!</span>überfällig (12 Uhr nicht begonnen / 15 Uhr nicht fertig)</span>
        <span><span class="sym sq" style="background:#6E6A64">■</span>manuelle Reinigung</span>
        <span>● Check-out</span>
        <span><i style="border-top:3px dashed #1E64B4;height:0;background:none"></i>Zeitraum (späterer Tag erlaubt)</span>
        <span><span class="sym" style="background:var(--open)">?</span>Antrag offen</span></div>
      ${cal.apartments.length ? `<div class="cal" id="cal-scroll"><div class="cal-grid" style="--days:${cal.days}">
        <div class="cal-corner">Wohnung</div><div class="cal-days">${head}</div>

  // ---- Galerie ----------------------------------------------------------------
  const gallery = { ids: [], index: 0, x: null };
  function showPhoto() {
    const cur = gallery.ids[gallery.index];
    const isVideo = cur.startsWith('v');
    $('g-img').hidden = isVideo; $('g-vid').hidden = !isVideo;
    if (isVideo) { $('g-img').removeAttribute('src'); $('g-vid').src = photoUrl(cur); } else { $('g-vid').pause(); $('g-vid').removeAttribute('src'); $('g-img').src = photoUrl(cur); }
    $('g-count').textContent = `Foto ${gallery.index + 1} von ${gallery.ids.length}`;
    $('g-prev').hidden = $('g-next').hidden = gallery.ids.length < 2;
  }
  function openGallery(ids, index) {
    gallery.ids = ids; gallery.index = index;
    showPhoto();
    $('gallery').hidden = false;
    document.body.style.overflow = 'hidden';
    $('g-close').focus();
  }
  function closeGallery() { $('gallery').hidden = true; document.body.style.overflow = ''; $('g-img').removeAttribute('src'); $('g-vid').pause(); $('g-vid').removeAttribute('src'); }
  function step(d) { gallery.index = (gallery.index + d + gallery.ids.length) % gallery.ids.length; showPhoto(); }
  $('g-close').onclick = closeGallery;
  $('g-prev').onclick = () => step(-1);
  $('g-next').onclick = () => step(1);
  $('g-stage').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeGallery(); });
  $('g-stage').addEventListener('touchstart', (e) => { gallery.x = e.touches[0].clientX; }, { passive: true });
  $('g-stage').addEventListener('touchend', (e) => {
    if (gallery.x == null) return;
    const dx = e.changedTouches[0].clientX - gallery.x;
    gallery.x = null;
    if (Math.abs(dx) > 40 && gallery.ids.length > 1) step(dx < 0 ? 1 : -1);
  });
  $('modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('modal').hidden) return closeModal();
    if ($('gallery').hidden) return;
    if (e.key === 'Escape') closeGallery();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  // ---- Fotos vor dem Hochladen verkleinern ------------------------------------
  function compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Foto konnte nicht verarbeitet werden'))), 'image/jpeg', 0.75);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden')); };
      img.src = url;
    });
  }
  function redrawPreviews(taskId) {

      if (!isVideo && list.filter((x) => !x.file.type.startsWith('video/')).length >= 5) { toast('Höchstens 5 Fotos pro Meldung'); continue; }
      list.push({ file: f, url: URL.createObjectURL(f) });
    }
    e.target.value = '';
    redrawPreviews(id);
  });

  document.addEventListener('submit', async (e) => {

        submit.textContent = 'Wird gesendet …';

        const choice = form.elements.keys.value;

        const supplies = pickedSupplies(form, 'supply');

          try {
