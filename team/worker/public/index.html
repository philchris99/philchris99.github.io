<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strauß Team">
<meta name="theme-color" content="#1E3A4C">
<link rel="icon" href="logo.svg">
<title>Strauß Team</title>
<style>
/* ==========================================================================
   MARKE – hier Farben von Apartment Strauß eintragen, Logo = public/logo.svg
   ========================================================================== */
:root {
  --brand: #1E3A4C;        /* Hauptfarbe (Buttons, Überschriften) */
  --brand-ink: #FFFFFF;    /* Schrift auf Hauptfarbe */
  --accent: #B8925A;       /* feine Akzente (Linien, Heute-Markierung) */
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;   /* Überschriften */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* Text */
  /* ------------------------------------------------------------------------ */
  --bg: #F4F2EE; --card: #FFFFFF; --text: #1D2328; --muted: #66707A; --line: #E2DDD5;
  --head-bg: #FFFFFF;
  --open: #9A6A12; --open-bg: #FBF0DC; --ok: #2D7050; --ok-bg: #E2F1E8;
  --done: #4B5663; --done-bg: #ECEFF2; --bad: #B03535; --bad-bg: #FBE6E6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --brand: #7FA7BF; --brand-ink: #0F1B23; --accent: #D0AC72;
    --bg: #121618; --card: #1C2226; --text: #E9ECEE; --muted: #9AA4AC; --line: #2E363C;
    --open: #E5B460; --open-bg: #3A2D16; --ok: #72C99A; --ok-bg: #173026;
    --done: #B4BDC7; --done-bg: #262D33; --bad: #F08C8C; --bad-bg: #3D1D1D;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 16px/1.5 var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Kopf: bleibt hell, damit das Logo in beiden Modi lesbar ist */
header { background: var(--head-bg); border-bottom: 2px solid var(--accent); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; position: sticky; top: 0; z-index: 5; }
.head { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.head img { height: 40px; width: auto; display: block; }
.head .who { text-align: right; font-size: 13px; color: #66707A; line-height: 1.3; }
.head .who b { color: #1D2328; display: block; font-size: 14px; }

main { max-width: 820px; margin: 0 auto; padding: 8px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
h2 { font: 400 22px/1.2 var(--serif); color: var(--brand); text-wrap: balance; }
.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.section-head .meta { font-variant-numeric: tabular-nums; }
.today .section-head { border-bottom: 2px solid var(--accent); }
.today h2 { font-size: 26px; }
.meta { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.danger.armed { background: var(--bad); color: #fff; }
button.small { min-height: 34px; padding: 5px 11px; font-size: 14px; }
button:disabled { opacity: .55; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 90px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }

/* Reinigungskarten */
.task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.task.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.today .task { padding: 16px 18px; }
.task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.task h3 { font: 600 18px/1.3 var(--sans); }
.today .task h3 { font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 3px 10px; white-space: nowrap; background: var(--done-bg); color: var(--done); }
.s-offen { color: var(--open); background: var(--open-bg); }
.s-bestätigt { color: var(--ok); background: var(--ok-bg); }
.s-erledigt { color: var(--done); background: var(--done-bg); }
.s-storniert { color: var(--muted); background: var(--done-bg); text-decoration: line-through; }
.chip.alert { color: var(--bad); background: var(--bad-bg); }
.chip.manual { color: var(--brand); background: transparent; border: 1px solid var(--brand); }
.note { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions > button { flex: 1 1 160px; }

/* Meldungen */
.report { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.report.resolved { opacity: .6; }
.report p { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.thumbs a { display: block; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.report-form { margin-top: 12px; display: grid; gap: 10px; }
.filepick { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed var(--muted); border-radius: 10px; padding: 12px; cursor: pointer; color: var(--muted); font-size: 15px; }
.filepick input { display: none; }

/* Übersicht */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font: 400 26px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--bad); }
.notice { border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice.bad { color: var(--bad); background: var(--bad-bg); }
.notice.info { background: var(--card); border: 1px solid var(--line); }
.empty { color: var(--muted); padding: 6px 0 2px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; padding: 10px 0; color: var(--brand); font-weight: 600; }
code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.danger-zone { border: 1px dashed var(--bad); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; z-index: 10; }
@media (max-width: 460px) { .stats { grid-template-columns: repeat(2, 1fr); } .head img { height: 34px; } }
@media (prefers-reduced-motion: no-preference) { .task, .report { transition: border-color .2s; } }
</style>
</head>
<body>
<header><div class="head"><img src="logo.svg" alt="Apartment Strauß"><div class="who" id="who"></div></div></header>
<main id="app"><p class="empty" style="margin-top:24px">Wird geladen …</p></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const utc = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (iso, n) => { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const fmt = (iso) => { const d = utc(iso); return `${WD[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.`; };
  const fmtLong = (iso) => { const d = utc(iso); return `${WDL[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${d.getUTCFullYear()}`; };
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';

  // Persönlicher Link: ?u=<id>&k=<token>. Bleibt in der Adresse, damit ein
  // Lesezeichen / Home-Bildschirm-Symbol angemeldet bleibt.
  const params = new URLSearchParams(location.search);
  let auth = null;
  if (params.get('u') && params.get('k')) {
    auth = params.get('u') + '.' + params.get('k');
    try { localStorage.setItem('team-auth', auth); } catch (e) { /* ohne Speicher weiter */ }
  } else {
    try { auth = localStorage.getItem('team-auth'); } catch (e) { auth = null; }
  }
  const photoUrl = (id) => `/api/photos/${encodeURIComponent(id)}?a=${encodeURIComponent(auth)}`;

  let data = null;
  const openForms = new Set(); // Reinigungen, bei denen das Meldungsformular offen ist
  let toastTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3800);
  }

  async function api(path, method, body) {
    const headers = { Authorization: 'Bearer ' + auth };
    let payload = body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    const res = await fetch(path, { method: method || 'GET', headers, body: payload });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || 'Fehler ' + res.status + ' – bitte erneut versuchen'), { status: res.status });
    return json;
  }

  // Beim automatischen Aktualisieren nichts überschreiben, was gerade eingetippt wird
  const busyEditing = () => openForms.size > 0 || !!document.querySelector('#app [data-dirty]');

  async function refresh(force) {
    if (!auth) return showLogin();
    if (!force && busyEditing()) return;
    try {
      data = Object.assign({}, data, await api('/api/me'));
      render();
    } catch (e) {
      if (e.status === 401) return showLogin();
      toast(e.message);
    }
  }
  function update(next) { data = Object.assign({}, data, next); render(); }

  function showLogin() {
    $('who').textContent = '';
    $('app').innerHTML = `<div class="panel" style="margin-top:24px"><h2>Willkommen</h2>
      <p class="meta" style="margin-top:8px">Bitte den persönlichen Link öffnen, den du von Apartment Strauß bekommen hast. Tipp: danach über „Teilen → Zum Home-Bildschirm“ als App ablegen.</p></div>`;
  }

  // ---- Bausteine ------------------------------------------------------------
  function statusChip(t) {
    if (t.status === 'offen' && t.escalated) return '<span class="chip alert">nicht bestätigt!</span>';
    return `<span class="chip s-${esc(t.status)}">${t.status === 'storniert' ? 'entfällt' : esc(t.status)}</span>`;
  }
  function nameOf(id) {
    const c = (data.cleaners || []).find((x) => x.id === id);
    return c ? c.name : id === data.user.id ? data.user.name : id;
  }
  function dayWord(iso) {
    if (iso === data.today) return 'Heute';
    if (iso === addDays(data.today, 1)) return 'Morgen';
    return fmt(iso);
  }

  function reportHtml(t, r, owner) {
    return `<div class="report${r.resolved ? ' resolved' : ''}">
      <div class="meta"><b>${esc(nameOf(r.by))}</b> · ${fmtTime(r.at)}${r.resolved ? ' · behoben' : ''}</div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ''}
      ${r.photos.length ? `<div class="thumbs">${r.photos.map((p) => `<a href="${photoUrl(p)}" target="_blank" rel="noopener"><img src="${photoUrl(p)}" alt="Foto zur Meldung" loading="lazy"></a>`).join('')}</div>` : ''}
      ${owner && !r.resolved ? `<div class="actions"><button class="small" data-resolve="${esc(t.id)}" data-report="${esc(r.id)}">Als behoben markieren</button></div>` : ''}
    </div>`;
  }

  function taskCard(t, owner) {
    const isToday = t.date === data.today;
    const urgent = t.status === 'offen' && (t.escalated || isToday);
    const active = t.status === 'offen' || t.status === 'bestätigt';
    const who = t.assignedTo ? `übernommen von <b>${esc(nameOf(t.assignedTo))}</b>` : (active ? 'noch nicht bestätigt' : '');
    const chips = [
      statusChip(t),
      t.sameDayArrival && t.status !== 'storniert' ? '<span class="chip alert">Wechseltag – Anreise heute</span>' : '',
      t.manual ? '<span class="chip manual">zusätzliche Reinigung</span>' : '',
    ].join('');
    let actions = '';
    if (!owner && t.status === 'offen') actions += `<button class="primary" data-confirm="${esc(t.id)}">Bestätigen – ich übernehme</button>`;
    if (!owner && t.status === 'bestätigt') actions += `<button class="primary" data-done="${esc(t.id)}">Erledigt melden</button>`;
    if (!owner && t.status !== 'storniert') actions += `<button data-toggle-report="${esc(t.id)}">${openForms.has(t.id) ? 'Meldung schließen' : 'Hinweis / Problem melden'}</button>`;
    if (owner && t.manual && active) actions += `<button class="danger small" data-cancel="${esc(t.id)}">Reinigung absagen</button>`;
    const reports = t.reports || [];
    return `<article class="task${urgent ? ' urgent' : ''}">
      <div class="task-top"><div><div class="eyebrow">${esc(isToday ? 'Heute' : dayWord(t.date))} · ${t.manual ? 'Reinigung' : 'Check-out'}</div><h3>${esc(t.apartmentName)}</h3></div></div>
      <div class="meta">${fmtLong(t.date)}${t.guest ? ' · ' + esc(t.guest) : ''}${who ? ' · ' + who : ''}</div>
      <div class="chips">${chips}</div>
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
      ${reports.map((r) => reportHtml(t, r, owner)).join('')}
      ${actions ? `<div class="actions">${actions}</div>` : ''}
      ${!owner && openForms.has(t.id) ? `<form class="report-form" data-report-form="${esc(t.id)}">
          <label class="field">Was fehlt, was ist kaputt, was ist zu tun?
            <textarea name="text" id="text-${esc(t.id)}" placeholder="z. B. Handtücher fehlen, Glühbirne im Bad defekt …"></textarea></label>
          <label class="filepick">Fotos hinzufügen (optional, max. 5)<input type="file" name="photo" id="photo-${esc(t.id)}" accept="image/*" multiple></label>
          <div class="meta" data-preview></div>
          <button class="primary" type="submit">Meldung senden</button>
        </form>` : ''}
      ${owner && t.history ? `<details class="meta" style="margin-top:8px"><summary>Verlauf</summary>${t.history.map((h) => `<div>${fmtTime(h.at)} – ${esc(h.text)}</div>`).join('')}</details>` : ''}
    </article>`;
  }

  function list(items, owner, empty) {
    return items.length ? items.map((t) => taskCard(t, owner)).join('') : `<p class="empty">${empty}</p>`;
  }
  function section(title, sub, body, cls) {
    return `<section class="section ${cls || ''}"><div class="section-head"><h2>${title}</h2><span class="meta">${sub || ''}</span></div>${body}</section>`;
  }
  function logList(entries, showTo) {
    return entries.length ? entries.map((n) => `<div class="report"><div class="meta">${fmtTime(n.at)}${showTo ? ' → ' + esc(n.toName) : ''}</div><p><b>${esc(n.title)}</b><br>${esc(n.body)}</p></div>`).join('') : '<p class="empty">Noch keine Nachrichten.</p>';
  }
  function pushSetup() {
    return `<details class="more"><summary>Push-Nachrichten einrichten</summary><div class="panel">
      <ol style="margin-left:18px; display:grid; gap:8px">
        <li>App <b>ntfy</b> aus dem App Store bzw. Google Play installieren.</li>
        <li>In der App auf „+“ tippen und diesen Kanal abonnieren:<br><code id="topic">${esc(data.topic)}</code> <button class="small" data-copy="topic">Kopieren</button></li>
        <li>Benachrichtigungen für ntfy erlauben.</li>
        <li><button class="small" data-test>Test-Nachricht senden</button></li>
      </ol>
      <p class="meta" style="margin-top:8px">Den Kanalnamen nicht weitergeben – wer ihn kennt, kann die Nachrichten mitlesen.</p></div></details>`;
  }

  // ---- Reinigungskraft ------------------------------------------------------
  function renderCleaner() {
    const active = data.tasks.filter((t) => t.status !== 'erledigt' || t.date === data.today);
    const today = active.filter((t) => t.date === data.today);
    const soon = active.filter((t) => t.date > data.today && t.date <= addDays(data.today, 14));
    const later = active.filter((t) => t.date > addDays(data.today, 14));
    return section('Heute', fmtLong(data.today), list(today, false, 'Heute stehen keine Reinigungen an.'), 'today')
      + section('Nächste 14 Tage', '', list(soon, false, 'Keine Reinigungen.'))
      + (later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, false, '')}</details>` : '')
      + `<p class="meta" style="margin-top:16px">Bitte Reinigungen spätestens bis ${esc(data.escalationTime)} Uhr am Reinigungstag bestätigen.</p>`
      + pushSetup()
      + `<details class="more"><summary>Meine Nachrichten</summary>${logList(data.log, false)}</details>`;
  }

  // ---- Auftraggeber ---------------------------------------------------------
  function renderOwner() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const tasks = data.tasks;
    const today = tasks.filter((t) => t.date === t0);
    const tomorrow = tasks.filter((t) => t.date === t1);
    const soon = tasks.filter((t) => t.date > t1 && t.date <= t14);
    const later = tasks.filter((t) => t.date > t14);
    const past = tasks.filter((t) => t.date < t0).reverse();
    const upcoming = tasks.filter((t) => t.date >= t0 && t.status !== 'storniert');
    const open = upcoming.filter((t) => t.status === 'offen').length;
    const alarms = upcoming.filter((t) => t.status === 'offen' && t.escalated).length;
    const todayOpen = today.filter((t) => t.status === 'offen').length;
    const reports = data.openReports || [];
    const apartments = data.apartments || [];

    const reportsBody = reports.length ? reports.map((r) => `<article class="task">
        <div class="eyebrow">${esc(dayWord(r.date))} · ${fmtLong(r.date)}</div><h3>${esc(r.apartmentName)}</h3>
        ${reportHtml({ id: r.taskId }, r, true)}</article>`).join('') : '<p class="empty">Keine offenen Meldungen.</p>';

    const manualForm = `<form class="panel" id="manual-form">
      <div class="form-grid">
        <label class="field">Wohnung / Einheit
          <select id="m-apt" required><option value="">Bitte wählen …</option>${apartments.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label>
        <label class="field">Datum <input id="m-date" type="date" required min="${t0}" value="${t1}"></label>
      </div>
      <label class="field" style="margin-top:10px">Hinweis für die Reinigungskraft (optional)
        <input id="m-note" maxlength="500" placeholder="z. B. Zwischenreinigung, Fenster putzen, Bettwäsche wechseln"></label>
      <div class="actions"><button class="primary" type="submit">Reinigung eintragen und Reinigungskraft benachrichtigen</button></div>
    </form>`;

    return `
      ${data.syncError ? `<div class="notice bad"><span><b>Abgleich mit Smoobu gestört:</b> ${esc(data.syncError)}</span></div>` : ''}
      <div class="notice info"><span class="meta">Smoobu-Abgleich: <b>${fmtTime(data.lastSync)}</b>${data.lastSyncCount != null ? ` · ${data.lastSyncCount} Buchungen` : ''}</span>
        <span style="display:flex; gap:6px"><button class="small" data-sync>Jetzt abgleichen</button><button class="small" data-diagnose>Diagnose</button></span></div>
      <div id="diagnose"></div>
      <div class="stats">
        <div class="stat${todayOpen ? ' warn' : ''}"><b>${today.filter((t) => t.status !== 'storniert').length}</b><span>heute</span></div>
        <div class="stat"><b>${open}</b><span>offen</span></div>
        <div class="stat${alarms ? ' warn' : ''}"><b>${alarms}</b><span>Alarme</span></div>
        <div class="stat${reports.length ? ' warn' : ''}"><b>${reports.length}</b><span>Meldungen</span></div>
      </div>
      ${section('Heute', fmtLong(t0), list(today, true, 'Heute stehen keine Reinigungen an.'), 'today')}
      ${section('Offene Meldungen', reports.length ? reports.length + ' offen' : '', reportsBody)}
      ${section('Morgen', fmtLong(t1), list(tomorrow, true, 'Morgen stehen keine Reinigungen an.'))}
      ${section('Nächste 14 Tage', '', list(soon, true, 'Keine Reinigungen.'))}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, true, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, true, '')}</details>` : ''}
      ${section('Reinigung hinzufügen', 'manuell', manualForm)}
      ${pushSetup()}
      <details class="more"><summary>Verschickte Nachrichten</summary>${logList(data.log, true)}</details>
      <details class="more"><summary>Wohnungen aus Smoobu (${apartments.length})</summary><div class="panel scroll"><table>
        ${apartments.map((a) => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.id)}</code></td></tr>`).join('') || '<tr><td class="meta">Erscheinen nach dem ersten Abgleich.</td></tr>'}</table></div></details>
      <details class="more"><summary>Reinigungskräfte</summary><div class="panel scroll"><table>
        ${data.cleaners.map((c) => `<tr><td>${esc(c.name)}</td><td>${c.apartments === 'all' ? 'alle Wohnungen' : esc(c.apartments.map((id) => (apartments.find((a) => a.id === id) || {}).name || id).join(', '))}</td></tr>`).join('')}</table></div></details>
      ${data.allowReset ? `<section class="section"><div class="panel danger-zone">
        <div class="eyebrow">Testphase</div><h2 style="margin-top:4px">Alles zurücksetzen</h2>
        <p class="meta" style="margin:6px 0 10px">Löscht alle Reinigungen, Bestätigungen, Meldungen, Fotos und Nachrichten und lädt die Buchungen frisch aus Smoobu. Es werden dabei keine Push-Nachrichten verschickt.</p>
        <form id="reset-form" class="form-grid"><label class="field">Zur Bestätigung <b>ZURÜCKSETZEN</b> eingeben
          <input id="reset-confirm" autocomplete="off" placeholder="ZURÜCKSETZEN"></label>
          <button class="danger" type="submit">Alles zurücksetzen</button></form>
      </div></section>` : ''}`;
  }

  function render() {
    $('who').innerHTML = `<b>${esc(data.user.name)}</b>${data.user.role === 'owner' ? 'Übersicht' : 'Reinigungen'} · ${esc(data.time)} Uhr`;
    $('app').innerHTML = data.user.role === 'owner' ? renderOwner() : renderCleaner();
  }

  // ---- Fotos vor dem Hochladen verkleinern (spart Datenvolumen und Speicher) --
  function compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Foto konnte nicht verarbeitet werden'))), 'image/jpeg', 0.75);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden')); };
      img.src = url;
    });
  }

  // ---- Ereignisse -----------------------------------------------------------
  document.addEventListener('input', (e) => { if (e.target.closest('#app form')) e.target.setAttribute('data-dirty', ''); });

  document.addEventListener('change', (e) => {
    if (e.target.type === 'file') {
      const n = e.target.files.length;
      const preview = e.target.closest('form').querySelector('[data-preview]');
      if (preview) preview.textContent = n ? `${n} Foto${n > 1 ? 's' : ''} ausgewählt${n > 5 ? ' – bitte höchstens 5' : ''}` : '';
    }
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const submit = form.querySelector('[type=submit]');
    submit.disabled = true;
    const label = submit.textContent;
    try {
      if (form.dataset.reportForm) {
        const id = form.dataset.reportForm;
        const files = [...form.querySelector('input[type=file]').files];
        if (files.length > 5) throw new Error('Bitte höchstens 5 Fotos auswählen');
        const text = form.querySelector('textarea').value.trim();
        if (!text && !files.length) throw new Error('Bitte einen Text eingeben oder ein Foto anhängen');
        submit.textContent = files.length ? 'Fotos werden vorbereitet …' : 'Wird gesendet …';
        const body = new FormData();
        body.append('text', text);
        for (const f of files) body.append('photo', await compress(f), 'foto.jpg');
        submit.textContent = 'Wird gesendet …';
        const next = await api(`/api/tasks/${encodeURIComponent(id)}/report`, 'POST', body);
        openForms.delete(id);
        update(next);
        toast('Meldung gesendet – danke!');
      } else if (form.id === 'manual-form') {
        const next = await api('/api/manual', 'POST', { apartmentId: $('m-apt').value, date: $('m-date').value, note: $('m-note').value });
        update(next);
        toast('Reinigung eingetragen – Reinigungskraft wurde benachrichtigt');
      } else if (form.id === 'reset-form') {
        if ($('reset-confirm').value.trim() !== 'ZURÜCKSETZEN') throw new Error('Bitte genau ZURÜCKSETZEN eingeben');
        submit.textContent = 'Wird zurückgesetzt …';
        const next = await api('/api/reset', 'POST', { confirm: 'ZURÜCKSETZEN' });
        openForms.clear();
        update(next);
        toast(`Zurückgesetzt – ${next.summary.bookings} Buchungen neu aus Smoobu geladen`);
      }
    } catch (err) {
      toast(err.message);
      submit.disabled = false;
      submit.textContent = label;
    }
  });

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || b.closest('form')) return; // Formular-Knöpfe laufen über das submit-Ereignis
    const d = b.dataset;
    try {
      if (d.confirm || d.done) {
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.confirm || d.done)}/${d.confirm ? 'confirm' : 'done'}`, 'POST'));
        toast(d.confirm ? 'Bestätigt – danke!' : 'Als erledigt gemeldet');
      } else if (d.toggleReport) {
        if (openForms.has(d.toggleReport)) openForms.delete(d.toggleReport); else openForms.add(d.toggleReport);
        render();
        const ta = document.getElementById('text-' + d.toggleReport);
        if (ta) ta.focus();
      } else if (d.resolve) {
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.resolve)}/reports/${encodeURIComponent(d.report)}/resolve`, 'POST'));
        toast('Meldung als behoben markiert');
      } else if (d.cancel) {
        if (!b.classList.contains('armed')) { // zweimal tippen zur Sicherheit
          b.classList.add('armed');
          b.textContent = 'Wirklich absagen? Nochmal tippen';
          setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Reinigung absagen'; }, 4000);
          return;
        }
        b.disabled = true;
        update(await api(`/api/tasks/${encodeURIComponent(d.cancel)}/cancel`, 'POST'));
        toast('Reinigung abgesagt – Reinigungskraft wurde benachrichtigt');
      } else if (d.sync !== undefined) {
        b.disabled = true;
        b.textContent = 'Gleiche ab …';
        const next = await api('/api/sync', 'POST');
        update(next);
        toast(next.summary.syncError ? next.summary.syncError : `Abgleich fertig: ${next.summary.bookings} Buchungen`);
      } else if (d.diagnose !== undefined) {
        b.disabled = true;
        b.textContent = 'Prüfe …';
        const res = await api('/api/diagnose', 'POST');
        b.disabled = false;
        b.textContent = 'Diagnose';
        $('diagnose').innerHTML = `<div class="panel" style="margin-top:8px"><b>Smoobu-Diagnose</b>
          <p class="meta">Enthält keine Gästedaten.</p><div class="scroll"><table>${res.results.map((r) => `<tr>
            <td><b>${esc(r.variant)}</b></td>
            <td>Status ${esc(r.status ?? '–')}${r.received ? ' · ' + esc(r.received) + ' erhalten' + (r.total != null ? ' von ' + esc(r.total) : '') : ''}
            ${r.topKeys && r.topKeys.length ? '<br><span class="meta">' + esc(r.topKeys.join(', ')) + '</span>' : ''}
            ${r.error ? '<br><span style="color:var(--bad)">' + esc(r.error) + '</span>' : ''}</td></tr>`).join('')}</table></div></div>`;
      } else if (d.test !== undefined) {
        await api('/api/test-push', 'POST');
        toast('Test-Nachricht verschickt');
      } else if (d.copy) {
        const text = $(d.copy).textContent;
        try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (err) {
          const r = document.createRange(); r.selectNodeContents($(d.copy));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
      }
    } catch (err) {
      toast(err.message);
      refresh(true);
    }
  });

  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
