<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apartments Strauss">
<meta name="application-name" content="Apartments Strauss">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Apartments Strauss</title>
<style>
/* ==========================================================================
   MARKE Apartments Strauss – Logo in public/logo*.png
   ========================================================================== */
:root {
  --brand: #2E2E2C;        /* Anthrazit wie das Logo (Buttons, Überschriften) */
  --brand-ink: #FFFFFF;
  --accent: #7C8B6B;       /* Salbeigrün – passend zu den Blumen im Logo */
  --accent-soft: #EEF1EA;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #F6F4F0; --card: #FFFFFF; --text: #242422; --muted: #6E6A64; --line: #E4DFD7;
  --open: #93620E; --open-bg: #FBF0DC; --ok: #3D6B47; --ok-bg: #E4F0E6;
  --done: #5A5A56; --done-bg: #EFEDE9; --bad: #B03535; --bad-bg: #FBE6E6; --new: #B03535;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --brand: #ECE8E1; --brand-ink: #1B1B1A; --accent: #A6B594; --accent-soft: #232820;
    --bg: #151514; --card: #1F1F1D; --text: #EDEAE4; --muted: #A39E96; --line: #34332F;
    --open: #E5B460; --open-bg: #3A2D16; --ok: #8CCB98; --ok-bg: #1B2E1F;
    --done: #B3AFA8; --done-bg: #262624; --bad: #F08C8C; --bad-bg: #3D1D1D; --new: #F08C8C;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 16px/1.5 var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }

/* Kopf: immer hell, damit das schwarze Logo lesbar bleibt */
header { background: #FFFFFF; border-bottom: 1px solid #E4DFD7; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; position: sticky; top: 0; z-index: 5; }
.head { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .house { height: 46px; width: auto; }
.brand .word { height: 30px; width: auto; }
.head .who { text-align: right; font-size: 12px; color: #6E6A64; line-height: 1.3; }
.head .who b { color: #242422; display: block; font-size: 14px; }
.head .who button { margin-top: 3px; min-height: 28px; padding: 2px 10px; font-size: 12px; background: #fff; color: #242422; border-color: #D8D2C8; }

main { max-width: 820px; margin: 0 auto; padding: 8px 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
h1 { font: 400 25px/1.2 var(--sans); letter-spacing: .01em; color: var(--brand); text-wrap: balance; }
h2 { font: 500 14px/1.3 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
.section { margin-top: 28px; scroll-margin-top: 80px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section.key .section-head { border-bottom: 2px solid var(--accent); }
.meta { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.greeting { margin-top: 18px; }
.greeting p { margin-top: 2px; }

button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.danger.armed { background: var(--bad); color: #fff; }
button.small, .btn.small { min-height: 34px; padding: 5px 11px; font-size: 14px; }
button:disabled { opacity: .55; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 90px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }

/* Auf einen Blick */
.glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.glance.three { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; cursor: pointer; display: block; width: 100%; min-height: 0; }
.tile b { display: block; font: 300 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; color: var(--brand); }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.25; display: block; margin-top: 3px; }
.tile.warn { border-color: var(--bad); background: var(--bad-bg); }
.tile.warn b { color: var(--bad); }
.tile.text b { font: 600 15px/1.25 var(--sans); color: var(--text); overflow-wrap: break-word; hyphens: auto; }
.todo { margin-top: 12px; border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 14px; padding: 12px 14px; }
.todo > b { color: var(--bad); }
.todo ul { list-style: none; margin-top: 6px; display: grid; gap: 4px; }
.todo li button { justify-content: flex-start; text-align: left; width: 100%; background: var(--card); font-size: 15px; }

/* Neuigkeiten */
.news { margin-top: 14px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; }
.news-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.news ul { list-style: none; margin-top: 8px; display: grid; gap: 6px; }
.news li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.news li.unread { border-left: 4px solid var(--new); }
.news li b { display: block; font-size: 15px; }

/* Reinigungskarten */
.task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; scroll-margin-top: 80px; }
.task.urgent { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.task.is-new { border-left: 6px solid var(--new); }
.task.is-next { box-shadow: 0 0 0 2px var(--accent) inset; }
.task.muted { background: var(--done-bg); box-shadow: none; }
.task.muted h3, .task.muted .meta { color: var(--muted); }
.task-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.task h3 { font: 600 19px/1.3 var(--sans); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 99px; padding: 3px 10px; white-space: nowrap; background: var(--done-bg); color: var(--done); }
.chip.new { background: var(--new); color: #fff; letter-spacing: .05em; }
.chip.next { background: var(--accent); color: #fff; }
.chip.yes { color: var(--ok); background: var(--ok-bg); }
.chip.wait { color: var(--open); background: var(--open-bg); }
.chip.alert { color: var(--bad); background: var(--bad-bg); }
.chip.run { color: #fff; background: var(--accent); }
.chip.manual { color: var(--brand); background: transparent; border: 1px solid var(--line); }
.chip.gone { text-decoration: line-through; }
.keys-check { margin-top: 10px; padding: 12px; border: 2px solid var(--accent); border-radius: 12px; background: var(--card); }
.keys-check legend { font-weight: 700; font-size: 16px; padding: 0; }
.keys-check fieldset { border: 0; margin: 0; padding: 0; }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; font-size: 16px; cursor: pointer; }
.choice input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
.choice.no:has(input:checked) { border-color: var(--bad); background: var(--bad-bg); }
.next-guests { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.codes { margin-top: 10px; padding: 12px; border: 2px solid var(--brand); border-radius: 12px; background: var(--card); }
.codes .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.codes .big { font-size: 30px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.code-table input { width: 100%; min-width: 70px; }
.code-table td { padding: 4px; vertical-align: top; }
.chip.period { color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent); }
.request { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--open); background: var(--open-bg); border-radius: 10px; }
.cal-period { position: absolute; top: 49px; height: 6px; border-top: 3px dashed var(--accent); pointer-events: none; }
.cal-clean.req::after { content: '?'; position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 99px; background: var(--open); color: #fff; font-size: 11px; line-height: 16px; }
.origin { margin-top: 6px; font-size: 13px; color: var(--muted); }
.note { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions > * { flex: 1 1 150px; }
.phone { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-height: 36px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; white-space: nowrap; font-weight: 600; }
.phone svg { width: 16px; height: 16px; }
.assign { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: stretch; }
.assign select { flex: 1 1 180px; width: auto; }
.assign button { flex: 0 1 auto; }
.day { margin: 16px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Meldungen + Fotos */
.report { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.report.owner { border-left: 3px solid var(--accent); }
.report.resolved { opacity: .6; }
.report p { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.thumb { position: relative; width: 84px; height: 84px; }
.thumb > button:first-child { width: 84px; height: 84px; border-radius: 8px; overflow: hidden; padding: 0; min-height: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 99px; background: var(--bad); color: #fff; border: 2px solid var(--card); font-size: 15px; line-height: 1; }
.report-form { margin-top: 12px; display: grid; gap: 10px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick label { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--muted); border-radius: 10px; padding: 10px; cursor: pointer; color: var(--text); font-size: 15px; min-height: 44px; }
.pick input { display: none; }

/* Galerie */
.gallery { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 9, .95); display: flex; flex-direction: column; color: #fff; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.gallery .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 15px; }
.gallery .bar button, .gallery .nav { background: rgba(255, 255, 255, .14); color: #fff; border: 0; }
.gallery .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; touch-action: pan-y; }
.gallery .stage img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 6px; }
.gallery .navs { display: flex; justify-content: center; gap: 12px; padding: 12px; }
.gallery .nav { min-width: 110px; }

/* Übersicht / Formulare */
.notice { border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice.bad { color: var(--bad); background: var(--bad-bg); }
.empty { color: var(--muted); padding: 6px 0 2px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panel + .panel, .panel + form.panel { margin-top: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
.codebox { margin-top: 12px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--card); }
.codebox .code { font: 600 34px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--brand); margin: 6px 0; }
.person { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; padding: 10px 0; color: var(--brand); font-weight: 600; }
code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-all; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.danger-zone { border: 1px dashed var(--bad); }
.login { max-width: 400px; margin: 28px auto 0; text-align: center; }
.login .logo { width: 190px; margin: 4px auto 18px; display: block; }
.login input.pin { font: 600 32px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .35em; text-align: center; padding-left: .35em; }
.login .hint { margin-top: 12px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-weight: 600; z-index: 30; }
/* Push einrichten */
.guide { margin-top: 14px; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--card); }
.guide ol { list-style: none; display: grid; gap: 14px; margin-top: 10px; counter-reset: s; }
.guide li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.guide li::before { content: counter(s); width: 34px; height: 34px; border-radius: 99px; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.guide .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.guide .row > * { flex: 1 1 140px; }
.btn.store { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.store.other { background: var(--card); color: var(--text); border-color: var(--line); font-weight: 400; }
.topicline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.topicline code { font-size: 14px; padding: 6px 8px; }
.codeline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.codeline .code { font: 600 22px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--brand); }

/* Kalender */
.greet-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.cal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.cal-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 10px 0; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
.cal { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
.cal-grid { display: grid; grid-template-columns: 132px calc(var(--days) * var(--w)); --w: 42px; width: max-content; }
.cal-apt, .cal-corner { position: sticky; left: 0; z-index: 2; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 6px 8px; font-size: 13px; line-height: 1.25; display: flex; align-items: center; gap: 6px; min-height: 72px; }
.cal-corner { min-height: 46px; }
.cal-apt b { display: inline-flex; width: 22px; height: 22px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: 12px; align-items: center; justify-content: center; flex: none; }
.cal-apt span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cal-corner { z-index: 3; font-weight: 600; }
.cal-days, .cal-row { position: relative; display: flex; border-bottom: 1px solid var(--line); }
.cal-day { width: var(--w); flex: none; text-align: center; font-size: 11px; line-height: 1.2; padding: 4px 0; color: var(--muted); border-left: 1px solid var(--line); }
.cal-day b { display: block; font-size: 14px; color: var(--text); }
.cal-day.we { background: var(--bg); }
.cal-day.today { background: var(--accent-soft); color: var(--accent); }
.cal-day.today b { color: var(--accent); }
.cal-day.month { border-left: 2px solid var(--brand); }
.cal-cell { width: var(--w); flex: none; border-left: 1px solid var(--line); min-height: 72px; }
.cal-cell.we { background: var(--bg); }
.cal-cell.today { background: var(--accent-soft); }
.cal-bar { position: absolute; top: 6px; height: 26px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 12px; font-weight: 600;
  padding: 0 7px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: pointer; border: 0; min-height: 0; justify-content: flex-start; }
.cal-bar.blocked { background: repeating-linear-gradient(135deg, var(--done-bg) 0 6px, var(--line) 6px 12px); color: var(--muted); border: 1px solid var(--line); }
.cal-bar.cut-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.cal-bar.cut-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.cal-clean { position: absolute; top: 37px; width: 30px; height: 30px; min-height: 0; padding: 0; border-radius: 99px; transform: translateX(-50%);
  border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); color: #fff; font-weight: 800; font-size: 15px; line-height: 1; }
.cal-clean.manual { border-radius: 7px; }
.cal-clean.offen { background: #D98A1C; } .cal-clean.bestätigt { background: var(--accent); } .cal-clean.erledigt { background: #2F6B3F; }
.cal-clean.overdue { background: var(--bad); animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cal-clean.overdue { animation: none; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(176, 53, 53, .25); } }
.legend .sym { display: inline-flex; width: 20px; height: 20px; border-radius: 99px; color: #fff; font-weight: 800; font-size: 12px; align-items: center; justify-content: center; vertical-align: middle; margin-right: 5px; }
.legend .sym.sq { border-radius: 5px; }

/* Detailfenster */
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(20, 20, 18, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { font: 600 19px/1.3 var(--sans); }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 12px; font-size: 15px; }
.sheet dt { color: var(--muted); }
@media (min-width: 700px) { .modal { align-items: center; } }

@media (max-width: 520px) {
  .glance { grid-template-columns: repeat(2, 1fr); }
  .glance.three { grid-template-columns: repeat(3, 1fr); }
  .brand .house { height: 40px; } .brand .word { height: 24px; }
  .tile b { font-size: 26px; }
}
@media (max-width: 360px) { .brand .word { display: none; } }
</style>
</head>
<body>
<header><div class="head">
  <div class="brand"><img class="house" src="/logo-house.png" alt=""><img class="word" src="/logo-wordmark.png" alt="Apartments Strauss"></div>
  <div class="who" id="who"></div>
</div></header>
<main id="app"><p class="empty" style="margin-top:24px">Wird geladen …</p></main>
<div class="gallery" id="gallery" hidden role="dialog" aria-modal="true" aria-label="Fotos">
  <div class="bar"><span id="g-count"></span><button type="button" id="g-close">Schließen ✕</button></div>
  <div class="stage" id="g-stage"><img id="g-img" alt="Foto"></div>
  <div class="navs"><button type="button" class="nav" id="g-prev">‹ Zurück</button><button type="button" class="nav" id="g-next">Weiter ›</button></div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="sheet" id="modal-body"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const utc = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (iso, n) => { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const two = (n) => String(n).padStart(2, '0');
  const fmt = (iso) => { const d = utc(iso); return `${WD[d.getUTCDay()]}, ${two(d.getUTCDate())}.${two(d.getUTCMonth() + 1)}.`; };
  const fmtLong = (iso) => { const d = utc(iso); return `${WDL[d.getUTCDay()]}, ${two(d.getUTCDate())}.${two(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`; };
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr' : '–';
  const clock = (iso) => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const duration = (a, b) => { const m = Math.round((Date.parse(b) - Date.parse(a)) / 60000); return `${Math.floor(m / 60)}:${two(m % 60)} Std.`; };
  const ADMIN = location.pathname.replace(/\/+$/, '') === '/admin';
  const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

  // ---- Anmeldung: Sitzung im Browser merken ---------------------------------
  const params = new URLSearchParams(location.search);
  const store = {
    get() { try { return localStorage.getItem('team-auth'); } catch (e) { return null; } },
    set(v) { try { v ? localStorage.setItem('team-auth', v) : localStorage.removeItem('team-auth'); } catch (e) { /* ohne Speicher */ } },
  };
  let auth = store.get();
  if (params.get('u') && params.get('k')) { // Link aus der Push-Nachricht
    auth = params.get('u') + '.' + params.get('k');
    store.set(auth);
    history.replaceState(null, '', location.pathname);
  }
  const photoUrl = (id) => `/api/photos/${encodeURIComponent(id)}?a=${encodeURIComponent(auth)}`;

  let data = null;
  let newCode = null;            // gerade erzeugter Code (nur einmal anzeigen)
  let editPerson = null;         // Person, deren Name bearbeitet wird
  let editTask = null;           // manuelle Reinigung in Bearbeitung
  let periodTask = null;
  let doneTask = null;
  const shownCodes = {};         // abgerufene Zugangscodes je Reinigung (nur im Speicher, verschwinden automatisch)
  let codeEditor = null;         // Admin: Zugangscodes bearbeiten           // Reinigung mit offenem „Beenden“-Checkpunkt (Schlüssel)         // Reinigung mit offenem Zeitraum-Formular
  let lockTimer = null;
  const openForms = new Set();   // Reinigungen mit offenem Hinweis-Formular
  const pending = {};            // ausgewählte, noch nicht gesendete Fotos je Reinigung
  let toastTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
  }

  async function api(path, method, body, noAuth) {
    const headers = {};
    if (!noAuth && auth) headers.Authorization = 'Bearer ' + auth;
    let payload = body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    const res = await fetch(path, { method: method || 'GET', headers, body: payload });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error || 'Fehler ' + res.status + ' – bitte erneut versuchen'), { status: res.status, retryAfter: json.retryAfter });
    return json;
  }

  // Beim automatischen Aktualisieren nichts überschreiben, was gerade bearbeitet wird
  const busyEditing = () => openForms.size > 0 || !!editPerson || !!editTask || !!codeEditor || !!document.querySelector('#app [data-dirty]')
    || !$('gallery').hidden || !$('modal').hidden || (document.activeElement && document.activeElement.tagName === 'SELECT');

  async function refresh(force) {
    if (!auth) return showLogin();
    if (!force && busyEditing()) return;
    try {
      data = Object.assign({}, data, await api('/api/me'));
      if (ADMIN && data.user.role !== 'owner') return showLogin();
      if (view === 'calendar') { // Kalender bleibt offen, nur Kopfzeile aktualisieren
        renderWho();
        if (!cal) openCalendar(false).catch((e) => toast(e.message));
        return;
      }
      render();
    } catch (e) {
      if (e.status === 401) { store.set(null); auth = null; return showLogin(); }
      toast(e.message);
    }
  }
  function update(next) { data = Object.assign({}, data, next); render(); }

  // ---- Anmeldung --------------------------------------------------------------
  function showLogin() {
    $('who').innerHTML = '';
    $('app').innerHTML = ADMIN ? `
      <form class="panel login" id="admin-login">
        <img class="logo" src="/logo.png" alt="Apartments Strauss">
        <h1 style="margin-bottom:12px">Admin-Notzugang</h1>
        <label class="field" style="text-align:left">Passwort <input id="admin-pw" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button class="primary" type="submit">Anmelden</button></div>
        <p class="meta hint"><a href="/">Zur Anmeldung mit Code</a></p>
      </form>` : `
      <form class="panel login" id="code-login">
        <img class="logo" src="/logo.png" alt="Apartments Strauss">
        <p class="meta" style="margin-bottom:10px">Bitte persönlichen 6-stelligen Code eingeben</p>
        <input id="code" class="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Persönlicher Code" required>
        <p class="meta hint" id="login-status" role="status"></p>
      </form>`;
    const first = document.querySelector('#app input');
    if (first) first.focus();
  }

  async function tryCode() {
    const input = $('code');
    const code = input.value.replace(/\D/g, '');
    if (code.length !== 6 || input.disabled) return;
    input.disabled = true;
    $('login-status').textContent = 'Anmeldung …';
    try {
      const res = await api('/api/login', 'POST', { code }, true);
      auth = res.session; store.set(auth);
      await refresh(true);
    } catch (err) {
      input.value = '';
      $('login-status').textContent = err.message;
      if (err.status === 429) return lockLogin(err.retryAfter || 60);
      input.disabled = false;
      input.focus();
    }
  }
  function lockLogin(seconds) {
    const input = $('code');
    clearInterval(lockTimer);
    let left = seconds;
    const tick = () => {
      if (!$('code')) return clearInterval(lockTimer);
      if (left <= 0) {
        clearInterval(lockTimer);
        input.disabled = false;
        $('login-status').textContent = 'Bitte erneut versuchen.';
        input.focus();
        return;
      }
      $('login-status').textContent = `Zu viele falsche Versuche – gesperrt, noch ${left} Sekunden`;
      left--;
    };
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  // ---- Bausteine ------------------------------------------------------------
  const people = () => [...(data.leads || []), ...(data.staff || [])];
  function nameOf(id) {
    if (!id) return '';
    if (id === data.user.id) return data.user.name;
    const p = people().find((x) => x.id === id);
    return p ? p.name : (id.startsWith('buero') || id === 'owner' ? 'Apartments Strauss' : 'Unbekannt');
  }
  function dayWord(iso) {
    if (iso === data.today) return 'Heute';
    if (iso === addDays(data.today, 1)) return 'Morgen';
    if (iso === addDays(data.today, -1)) return 'Gestern';
    return fmt(iso);
  }
  const isActive = (t) => t.status === 'offen' || t.status === 'bestätigt';
  // Zeitraum: Reinigung darf vom Check-out-Tag bis latestDate stattfinden
  const lastDay = (t) => (t.latestDate && t.latestDate > t.date ? t.latestDate : t.date);
  const onDay = (t, d) => t.date === d || (isActive(t) && t.date < d && lastDay(t) >= d);
  const periodLabel = (t) => `${fmt(t.date)} – ${fmt(lastDay(t))}`;
  const role = () => data.user.role;

  function chips(t) {
    const out = [];
    if (t.status === 'storniert') return '<span class="chip gone">entfällt</span>';
    if (t.status === 'erledigt') {
      out.push(`<span class="chip yes">erledigt ✓ ${t.doneAt ? clock(t.doneAt) : ''}${t.startedAt && t.doneAt ? ' · ' + duration(t.startedAt, t.doneAt) : ''}</span>`);
      if (t.keysInBox === true) out.push('<span class="chip yes">Schlüssel in der Box ✓</span>');
      else if (t.keysInBox === false) out.push(t.keysResolvedAt ? '<span class="chip yes">Schlüssel geklärt ✓</span>' : '<span class="chip alert">Schlüssel NICHT in der Box</span>');
    }
    else {
      if (t.overdue === 'start') out.push('<span class="chip alert">überfällig – noch nicht begonnen</span>');
      else if (t.overdue === 'finish') out.push(`<span class="chip alert">überfällig – ${t.startedAt ? 'noch nicht beendet' : 'nicht begonnen'}</span>`);
      else if (t.overdue === 'past') out.push('<span class="chip alert">überfällig – nicht erledigt</span>');
      if (t.lateAlerted && t.status === 'offen') out.push('<span class="chip alert">nicht rechtzeitig bestätigt</span>');
      out.push(t.leadConfirmedAt ? '<span class="chip yes">Leitung ✓</span>' : '<span class="chip wait">Leitung offen</span>');
      if (!t.assignedTo) out.push('<span class="chip wait">nicht zugewiesen</span>');
      else out.push(`<span class="chip ${t.staffConfirmedAt ? 'yes' : 'wait'}">${esc(nameOf(t.assignedTo))} ${t.staffConfirmedAt ? '✓' : 'offen'}</span>`);
      if (t.startedAt) out.push(`<span class="chip run">läuft seit ${clock(t.startedAt)}</span>`);
    }
    if (lastDay(t) > t.date && t.status !== 'erledigt') out.push(`<span class="chip period">Zeitraum ${esc(periodLabel(t))}</span>`);
    const req = t.periodRequest;
    if (req && req.status === 'offen' && isActive(t)) out.push(`<span class="chip wait">Zeitraum bis ${esc(fmt(req.until))} beantragt</span>`);
    if (req && req.status === 'abgelehnt' && isActive(t) && role() !== 'owner') out.push('<span class="chip alert">Zeitraum abgelehnt</span>');
    if (t.sameDayArrival && isActive(t)) out.push('<span class="chip alert">Wechseltag – Anreise am selben Tag</span>');
    if (t.manual) out.push('<span class="chip manual">manuelle Reinigung</span>');
    return out.join('');
  }

  function reportHtml(t, r) {
    const mine = r.by === data.user.id || role() === 'owner';
    const author = r.byRole === 'owner' ? 'Apartments Strauss' : nameOf(r.by);
    const ids = r.photos.join(',');
    return `<div class="report${r.byRole === 'owner' ? ' owner' : ''}${r.resolved ? ' resolved' : ''}">
      <div class="meta"><b>${r.byRole === 'owner' ? 'Hinweis von ' : ''}${esc(author)}</b> · ${fmtTime(r.at)}${r.resolved ? ' · behoben' : ''}</div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ''}
      ${r.photos.length ? `<div class="thumbs">${r.photos.map((p, i) => `<div class="thumb">
        <button type="button" data-gallery="${esc(ids)}" data-index="${i}" aria-label="Foto ${i + 1} öffnen"><img src="${photoUrl(p)}" alt="" loading="lazy"></button>
        ${mine ? `<button type="button" class="x" data-delphoto="${esc(p)}" data-task="${esc(t.id)}" data-report="${esc(r.id)}" aria-label="Foto löschen">✕</button>` : ''}
      </div>`).join('')}</div>` : ''}
      ${role() === 'owner' && !r.resolved && r.byRole !== 'owner' ? `<div class="actions"><button class="small" data-resolve="${esc(t.id)}" data-report="${esc(r.id)}">Als behoben markieren</button></div>` : ''}
    </div>`;
  }

  function reportForm(t) {
    const label = role() === 'owner' ? 'Hinweis für die Reinigung' : 'Was fehlt, was ist kaputt, was ist zu tun?';
    return `<form class="report-form" data-report-form="${esc(t.id)}">
      <label class="field">${label}
        <textarea name="text" id="text-${esc(t.id)}" placeholder="${role() === 'owner' ? 'z. B. Bitte Kaffee auffüllen …' : 'z. B. Handtücher fehlen, Glühbirne im Bad defekt …'}"></textarea></label>
      <div class="pick">
        <label>Foto aufnehmen<input type="file" accept="image/*" capture="environment" data-photo-input="${esc(t.id)}"></label>
        <label>Aus Galerie<input type="file" accept="image/*" multiple data-photo-input="${esc(t.id)}"></label>
      </div>
      <div class="thumbs" data-previews="${esc(t.id)}">${previewsHtml(t.id)}</div>
      <button class="primary" type="submit">${role() === 'owner' ? 'Hinweis senden' : 'Meldung senden'}</button>
    </form>`;
  }
  function previewsHtml(taskId) {
    return (pending[taskId] || []).map((p, i) => `<div class="thumb"><button type="button" tabindex="-1"><img src="${p.url}" alt="Ausgewähltes Foto ${i + 1}"></button>
      <button type="button" class="x" data-unpick="${esc(taskId)}" data-index="${i}" aria-label="Foto entfernen">✕</button></div>`).join('');
  }

  function editForm(t) {
    return `<form class="report-form" data-edit-task="${esc(t.id)}">
      <div class="form-grid">
        <label class="field">Neues Datum <input type="date" name="date" value="${esc(t.date)}" min="${data.today}" required></label>
        <label class="field">Hinweis <input name="note" value="${esc(t.note || '')}" maxlength="500"></label>
      </div>
      <div class="actions"><button class="primary" type="submit">Speichern und Team informieren</button><button type="button" data-edit-cancel>Abbrechen</button></div>
    </form>`;
  }

  const shortGuests = (b) => (!b.adults && !b.children ? '' : `${b.adults || 0}${b.children ? '+' + b.children : ''} P.`);
  /** Nächste Anreise in der Wohnung mit erwarteter Gästezahl (zur Vorbereitung) */
  function nextGuests(t) {
    if (!isActive(t)) return '';
    const n = t.nextBooking;
    if (!n) return '<div class="next-guests meta">Nächste Anreise: noch keine Buchung</div>';
    const when = ['Heute', 'Morgen'].includes(dayWord(n.arrival)) ? `<b>${dayWord(n.arrival)}</b>, ${fmt(n.arrival)}` : `<b>${fmt(n.arrival)}</b>`;
    return `<div class="next-guests">Nächste Anreise: ${when}${n.checkIn ? ` ab ${esc(n.checkIn)} Uhr` : ''} · ${n.guests ? `<b>${esc(n.guests)}</b>` : 'Gästezahl in Smoobu nicht angegeben'}</div>`;
  }

  function codesBox(c) {
    return `<div class="codes"><b>Zugangscodes · ${esc(c.apartmentName)}</b>
      ${c.description ? `<div class="meta" style="margin-top:4px">📍 ${esc(c.description)}</div>` : ''}
      <div class="row2">
        <div><div class="meta">Gäste-Code</div><div class="big">${esc(c.guest || '–')}</div></div>
        <div><div class="meta">Service-Schlüsselbox</div><div class="big">${esc(c.service || '–')}</div></div>
      </div>
      <p class="meta" style="margin-top:6px">Bitte nicht weitergeben. Wird nach 3 Minuten automatisch ausgeblendet.</p></div>`;
  }

  // ---- Admin: Zugangscodes je Wohnung -----------------------------------------
  function codeEditorHtml() {
    if (!codeEditor) {
      return `<p class="meta">Gäste-Code, Code der Service-Schlüsselbox und Lagebeschreibung je Wohnung. Werden verschlüsselt gespeichert;
        das Reinigungsteam sieht sie per Knopf „🔑 Zugangscodes“ bei der Reinigung (jeder Abruf steht im Verlauf).</p>
        <div class="actions"><button class="primary" data-code-editor>Codes anzeigen / bearbeiten</button></div>`;
    }
    const rows = codeEditor.apartments.map((a) => { const c = codeEditor.codes[a.id] || {};
      return `<tr><td><b>${esc(a.name)}</b>${c.builtin ? '<div class="meta">fest hinterlegt</div>' : c.updatedAt ? `<div class="meta">geändert ${fmtTime(c.updatedAt)}</div>` : ''}</td>
        <td><input id="cg-${esc(a.id)}" value="${esc(c.guest || '')}" inputmode="numeric" aria-label="Gäste-Code ${esc(a.name)}"></td>
        <td><input id="cs-${esc(a.id)}" value="${esc(c.service || '')}" inputmode="numeric" aria-label="Service-Code ${esc(a.name)}"></td>
        <td><input id="cd-${esc(a.id)}" value="${esc(c.description || '')}" aria-label="Beschreibung ${esc(a.name)}"></td></tr>`; }).join('');
    return `<div class="panel">
        <label class="field">Tabelle einfügen (z. B. aus Excel/Word: Wohnung, Gäste, Service, Beschreibung)
          <textarea id="code-import" rows="4" placeholder="#EINS | Musterstraße 1&#9;1234&#9;5678&#9;EG links"></textarea></label>
        <div class="actions"><button data-code-import>In die Liste übernehmen</button></div>
        <div id="code-import-result" class="meta"></div>
      </div>
      <div class="panel scroll"><table class="code-table">
        <tr><th>Wohnung</th><th>Gäste</th><th>Service</th><th>Beschreibung</th></tr>${rows ||
          '<tr><td colspan="4" class="meta">Wohnungen erscheinen nach dem ersten Abgleich mit Smoobu.</td></tr>'}</table></div>
      <div class="actions"><button class="primary" data-code-save>Codes speichern</button><button data-code-close>Schließen</button></div>`;
  }

  /** Eingefügte Tabelle den Wohnungen zuordnen (Kürzel wie „#EINS“ oder Adresse) */
  function importCodes(text) {
    const norm = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
    const token = (x) => norm(String(x).split('|')[0]);
    const address = (x) => norm(String(x).split('|').slice(1).join('|'));
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const done = [], missing = [];
    for (const line of lines) {
      const cols = (line.includes('\t') ? line.split('\t') : line.split(/\s{2,}/)).map((c) => c.trim());
      if (cols.length < 2 || /^wohnung$/i.test(cols[0])) continue;
      const [name, guest, service, ...rest] = cols;
      const apt = codeEditor.apartments.find((a) => norm(a.name) === norm(name))
        || codeEditor.apartments.find((a) => token(a.name) && token(a.name) === token(name))
        || (address(name) && codeEditor.apartments.find((a) => norm(a.name).includes(address(name))));
      if (!apt) { missing.push(name); continue; }
      $('cg-' + apt.id).value = guest || '';
      $('cs-' + apt.id).value = service || '';
      $('cd-' + apt.id).value = rest.join(' ').trim();
      done.push(apt.name);
    }
    $('code-import-result').innerHTML = `${done.length} Wohnung(en) übernommen – bitte prüfen und „Codes speichern“ tippen.`
      + (missing.length ? `<br><b style="color:var(--bad)">Nicht zugeordnet:</b> ${missing.map(esc).join(', ')} – bitte unten von Hand eintragen.` : '');
  }

  /** Pflicht-Checkpunkt vor dem Beenden: Gästeschlüssel in der Box? */
  function doneForm(t) {
    return `<form class="keys-check" data-done-form="${esc(t.id)}">
      <fieldset><legend>Sind die Gästeschlüssel in der Box? <span style="color:var(--bad)">*</span></legend>
        <label class="choice"><input type="radio" name="keys" value="1" required> Ja, Schlüssel sind in der Box</label>
        <label class="choice no"><input type="radio" name="keys" value="0"> Nein, Schlüssel fehlen</label>
      </fieldset>
      <label class="field" style="margin-top:10px">Bei „Nein“: was ist passiert? (optional)
        <input name="note" maxlength="500" placeholder="z. B. nur 1 von 2 Schlüsseln, Gast nicht erreichbar"></label>
      <p class="meta" style="margin-top:6px">Bei „Nein“ wird Apartments Strauss sofort per Push benachrichtigt.</p>
      <div class="actions"><button class="primary" type="submit">Reinigung beenden</button><button type="button" data-done-cancel>Abbrechen</button></div>
    </form>`;
  }

  function periodForm(t) {
    const owner = role() === 'owner';
    // Nur Tage, an denen die Wohnung laut Smoobu frei ist (keine Anreise, kein Aufenthalt, keine Sperrzeit)
    const limit = t.periodLimit || { last: addDays(t.date, data.maxPeriodDays || 7), reason: '' };
    if (!limit.last) {
      return `<div class="report-form request" style="border-color:var(--bad);background:var(--bad-bg)">
        <b style="color:var(--bad)">${owner ? 'Kein späterer Tag möglich' : 'Antrag nicht möglich'}</b>
        <p style="margin:6px 0 0">${esc(limit.reason)} – die Wohnung ist nach dem Check-out nicht frei. Die Reinigung muss am
          <b>${fmtLong(t.date)} bis ${esc(data.finishBy)} Uhr</b> erledigt sein.</p>
        <div class="actions"><button type="button" data-period-close>Schließen</button></div></div>`;
    }
    const max = limit.last;
    const min = addDays(t.date, 1) > data.today ? addDays(t.date, 1) : data.today;
    let value = t.latestDate || (addDays(t.date, 1) <= max ? addDays(t.date, 1) : max);
    if (value < min) value = min;
    return `<form class="report-form" data-period-form="${esc(t.id)}">
      <p class="meta">Check-out ${fmtLong(t.date)}. Die Reinigung darf dann an jedem Tag bis einschließlich dem gewählten Datum stattfinden –
        am ${fmt(t.date)} ist natürlich weiterhin gut. Erinnerungen (${esc(data.startBy)}/${esc(data.finishBy)} Uhr) erst am letzten Tag.
        <br><b style="color:var(--bad)">Wichtig: Auch am späteren Tag muss die Reinigung bis spätestens ${esc(data.finishBy)} Uhr erledigt sein.</b>
        ${limit.reason ? `<br><b>${esc(limit.reason)}</b> – möglich nur bis ${fmtLong(max)} (nur freie Tage).` : ''}</p>
      <div class="form-grid">
        <label class="field">Reinigung spätestens am <input type="date" name="until" value="${esc(value)}" min="${esc(min)}" max="${esc(max)}" required></label>
        ${owner ? '' : '<label class="field">Kurze Begründung <input name="reason" required minlength="3" maxlength="500" placeholder="z. B. Personalengpass am 1.10."></label>'}
      </div>
      <div class="actions"><button class="primary" type="submit">${owner ? 'Zeitraum festlegen und Team informieren' : 'Antrag an Apartments Strauss senden'}</button>
        ${owner && t.latestDate ? `<button type="button" class="danger" data-period-clear="${esc(t.id)}">Zeitraum aufheben</button>` : ''}
        <button type="button" data-period-close>Abbrechen</button></div>
    </form>`;
  }

  /** Offener Antrag: Admin genehmigt / lehnt ab; alle anderen sehen den Stand */
  function requestBox(t) {
    const req = t.periodRequest;
    if (!req || req.status !== 'offen' || !isActive(t)) return '';
    const who = nameOf(req.by);
    return `<div class="request"><b>Antrag: Reinigung ${esc(fmt(t.date))} – ${esc(fmt(req.until))}</b> <span class="meta">(jeweils bis ${esc(data.finishBy)} Uhr)</span>
      <div class="meta">${esc(who)} · ${fmtTime(req.at)}</div><p style="margin:6px 0 0">${esc(req.reason)}</p>
      ${role() === 'owner' ? `<label class="field" style="margin-top:8px">Antwort (optional) <input id="pc-${esc(t.id)}" maxlength="500" placeholder="z. B. ok, aber bis 14 Uhr fertig"></label>
        <div class="actions"><button class="go" data-period-decide="${esc(t.id)}" data-approve="1">Genehmigen</button>
          <button class="danger" data-period-decide="${esc(t.id)}" data-approve="0">Ablehnen</button></div>`
        : '<div class="meta" style="margin-top:6px">Wartet auf Entscheidung von Apartments Strauss.</div>'}
    </div>`;
  }

  function assignControl(t) {
    const options = [...(data.staff || []).map((s) => [s.id, s.name]), [data.user.id, `Ich selbst (${data.user.name})`]];
    return `<div class="assign">
      <select data-assign-select="${esc(t.id)}" aria-label="Mitarbeiterin auswählen">
        <option value="">${t.assignedTo ? 'Neu zuweisen …' : 'Mitarbeiterin wählen …'}</option>
        ${options.map(([id, name]) => `<option value="${esc(id)}" ${id === t.assignedTo ? 'disabled' : ''}>${esc(name)}</option>`).join('')}
      </select>
      <button class="primary" data-assign="${esc(t.id)}">Zuweisen</button>
    </div>`;
  }

  function taskCard(t, opts) {
    opts = opts || {};
    const r = role();
    const active = isActive(t);
    const mineToDo = t.assignedTo === data.user.id;
    const isNew = r === 'staff' ? active && !t.staffConfirmedAt : r === 'lead' ? active && (!t.leadConfirmedAt || !t.assignedTo) : false;
    const urgent = active && (t.overdue || t.lateAlerted || (r === 'owner' && t.status === 'offen' && t.date <= addDays(data.today, 1)));
    const cls = ['task', active ? '' : 'muted', isNew ? 'is-new' : '', opts.next ? 'is-next' : '', urgent ? 'urgent' : ''].filter(Boolean).join(' ');
    const actions = [];
    if (r === 'lead' && active && !t.leadConfirmedAt) actions.push(`<button data-lead-confirm="${esc(t.id)}">Erhalt bestätigen</button>`);
    if (active && mineToDo && !t.staffConfirmedAt) actions.push(`<button class="primary" data-confirm="${esc(t.id)}">Erhalt bestätigen</button>`);
    // Beginn/Erledigt nur für die zugewiesene Person (auch Leitung, wenn sie selbst reinigt) nach Bestätigung
    const canWork = active && r !== 'owner' && mineToDo && !!t.staffConfirmedAt;
    if (canWork) {
      if (!t.startedAt) actions.push(`<button class="go" data-start="${esc(t.id)}">Reinigung beginnen</button>`);
      if (doneTask !== t.id) actions.push(`<button class="${t.startedAt ? 'primary' : ''}" data-done="${esc(t.id)}">Erledigt melden</button>`);
    }
    if (t.status !== 'storniert') actions.push(`<button data-toggle-report="${esc(t.id)}">${openForms.has(t.id) ? 'Schließen' : r === 'owner' ? 'Hinweis / Foto hinzufügen' : 'Hinweis / Problem melden'}</button>`);
    const doneToday = t.status === 'erledigt' && t.doneAt && t.doneAt.slice(0, 10) >= addDays(data.today, -1);
    if ((active || doneToday) && (r !== 'staff' || mineToDo)) {
      actions.push(`<button class="small" data-codes="${esc(t.id)}">${shownCodes[t.id] ? 'Codes ausblenden' : '🔑 Zugangscodes'}</button>`);
    }
    if (r === 'owner' && t.keysInBox === false && !t.keysResolvedAt) actions.push(`<button class="go" data-keys-resolved="${esc(t.id)}">Schlüssel geklärt</button>`);
    const reqOpen = t.periodRequest && t.periodRequest.status === 'offen';
    if (active && (r === 'owner' || (!reqOpen && (r === 'lead' || mineToDo)))) {
      actions.push(`<button class="small" data-period="${esc(t.id)}">${periodTask === t.id ? 'Zeitraum schließen'
        : r === 'owner' ? (t.latestDate ? 'Zeitraum ändern' : 'Zeitraum festlegen') : 'Späteren Tag beantragen'}</button>`);
    }
    if (r === 'owner' && t.manual && active) {
      actions.push(`<button class="small" data-edit-task="${esc(t.id)}">Bearbeiten / verschieben</button>`);
      actions.push(`<button class="danger small" data-cancel="${esc(t.id)}">Absagen</button>`);
    }
    const origin = `Eingetragen ${fmtTime(t.createdAt)} · ${t.source === 'manuell' ? 'manuell hinzugefügt' : 'automatisch aus Smoobu'}${t.changedAt ? ` · geändert ${fmtTime(t.changedAt)}` : ''}`;
    return `<article class="${cls}" id="task-${esc(t.id)}">
      <div class="task-top">
        <div><div class="eyebrow">${isNew ? '<span class="chip new">NEU</span> ' : ''}${opts.next ? '<span class="chip next">Als Nächstes</span> ' : ''}${esc(dayWord(t.date))}${lastDay(t) > t.date ? ' bis ' + esc(dayWord(lastDay(t))) : ''} · ${t.manual ? 'Reinigung' : 'Check-out'}</div>
        <h3>${esc(t.apartmentName)}</h3></div>
        ${t.guestPhone && active ? `<a class="phone" href="tel:${esc(t.guestPhone.replace(/[^\d+]/g, ''))}" aria-label="Gast anrufen: ${esc(t.guestPhone)}">${PHONE_ICON} Gast</a>` : ''}
      </div>
      <div class="meta">${fmtLong(t.date)}${lastDay(t) > t.date ? ' – ' + fmtLong(lastDay(t)) : ''}${t.guest ? ' · ' + esc(t.guest) : ''}${t.guestPhone && active ? ' · ' + esc(t.guestPhone) : ''}</div>
      <div class="chips">${chips(t)}</div>
      ${nextGuests(t)}
      <div class="origin">${origin}</div>
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
      ${requestBox(t)}
      ${t.reports.map((rep) => reportHtml(t, rep)).join('')}
      ${r === 'lead' && active ? assignControl(t) : ''}
      ${actions.length ? `<div class="actions">${actions.join('')}</div>` : ''}
      ${editTask === t.id ? editForm(t) : ''}
      ${shownCodes[t.id] ? codesBox(shownCodes[t.id]) : ''}
      ${periodTask === t.id ? periodForm(t) : ''}
      ${doneTask === t.id && canWork ? doneForm(t) : ''}
      ${openForms.has(t.id) ? reportForm(t) : ''}
      ${t.history ? `<details class="meta" style="margin-top:8px"><summary>Verlauf</summary>${t.history.map((h) => `<div>${fmtTime(h.at)} – ${esc(h.text)}</div>`).join('')}</details>` : ''}
    </article>`;
  }

  const list = (items, empty, nextId) => items.length ? items.map((t) => taskCard(t, { next: t.id === nextId })).join('') : `<p class="empty">${empty}</p>`;
  const section = (id, title, sub, body, cls) =>
    `<section class="section ${cls || ''}" id="${id}"><div class="section-head"><h2>${title}</h2><span class="meta">${sub || ''}</span></div>${body}</section>`;
  const tile = (target, value, label, warn, text) =>
    `<button type="button" class="tile${warn ? ' warn' : ''}${text ? ' text' : ''}" data-jump="${target}"><b>${value}</b><span>${label}</span></button>`;
  function byDay(tasks, nextId) {
    const days = {};
    for (const t of tasks) {
      const d = onDay(t, data.today) ? (t.date < data.today ? data.today : t.date) : t.date;
      (days[d] = days[d] || []).push(t);
    }
    return Object.keys(days).sort().map((d) => `<div class="day">${esc(dayWord(d))}${['Heute', 'Morgen', 'Gestern'].includes(dayWord(d)) ? ' · ' + fmt(d) : ''}</div>${list(days[d], '', nextId)}`).join('');
  }

  function newsPanel() {
    const items = data.changes || [];
    if (!items.length) return '';
    const unread = items.filter((c) => !data.seenAt || c.at > data.seenAt);
    const shown = unread.length ? unread : items.slice(0, 3);
    return `<div class="news" id="news">
      <div class="news-head"><b>${unread.length ? `Neuigkeiten (${unread.length})` : 'Letzte Änderungen'}</b>
        ${unread.length ? '<button class="small" data-seen>Alles gelesen</button>' : ''}</div>
      <ul>${shown.slice(0, 10).map((c) => `<li class="${!data.seenAt || c.at > data.seenAt ? 'unread' : ''}">
        <span class="meta">${fmtTime(c.at)}</span><b>${esc(c.title)}</b>${esc(c.body)}
        ${c.taskId ? ` <button class="small" data-jump="task-${esc(c.taskId)}" style="margin-top:6px">Zur Reinigung</button>` : ''}</li>`).join('')}</ul>
    </div>`;
  }

  // ---- Push-Nachrichten einrichten (Schritt für Schritt) -----------------------
  const STORE = { ios: 'https://apps.apple.com/de/app/ntfy/id1625396347', android: 'https://play.google.com/store/apps/details?id=io.heckel.ntfy' };
  const device = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'ios' : /Android/i.test(navigator.userAgent) ? 'android' : 'other';
  const pushDone = () => !!data.pushOk; // wird je Benutzerkonto auf dem Server gemerkt
  let pushTested = false;

  function pushGuide(inline) {
    const stores = [['ios', 'App Store (iPhone)'], ['android', 'Google Play (Android)']];
    if (device === 'android') stores.reverse(); // passender Store zuerst
    return `<div class="guide"${inline ? '' : ' id="push"'}>
      <b style="font-size:17px">Push-Nachrichten einrichten</b>
      <p class="meta">Damit du neue Reinigungen und Erinnerungen sofort aufs Handy bekommst – dauert 2 Minuten.</p>
      <ol>
        <li><div><b>App „ntfy“ herunterladen</b> (kostenlos)
          <div class="row">${stores.map(([k, label]) => `<a class="btn store${k === device || device === 'other' ? '' : ' other'}" href="${STORE[k]}" target="_blank" rel="noopener">${label}</a>`).join('')}</div></div></li>
        <li><div><b>App öffnen, Mitteilungen erlauben</b>
          <p class="meta">Beim ersten Start fragt die App – bitte „Erlauben“ tippen.</p></div></li>
        <li><div><b>Deinen Kanal abonnieren</b>
          <p class="meta">In ntfy unten rechts auf „+“ tippen, diesen Namen einfügen und „Abonnieren“ tippen:</p>
          <div class="topicline"><code id="topic">${esc(data.topic)}</code><button class="small" data-copy="topic">Kopieren</button></div>
          ${device === 'android' ? `<div class="row"><a class="btn small" href="ntfy://ntfy.sh/${esc(data.topic)}">Direkt in ntfy öffnen</a></div>` : ''}</div></li>
        <li><div><b>Testen</b>
          <div class="row"><button class="go" data-test>Test-Nachricht senden</button></div>
          ${pushTested ? `<p class="meta" style="margin-top:8px">Ist die Nachricht auf dem Handy angekommen?</p>
            <div class="row"><button class="primary" data-push-ok>Ja, angekommen ✓</button><button data-push-help>Nein</button></div>` : ''}
          <p class="meta" id="push-help" hidden style="margin-top:8px">Tipps: Kanalname genau so eingetragen? In den Handy-Einstellungen → ntfy → Mitteilungen erlauben
            (iPhone zusätzlich „Sofortige Mitteilungen“). Android: Akku-Optimierung für ntfy ausschalten. Danach nochmals testen.</p></div></li>
      </ol>
    </div>`;
  }
  /** Oben als Hinweis, bis bestätigt wurde, dass die Test-Nachricht ankommt; sonst unten aufklappbar */
  const pushBanner = () => (pushDone() ? '' : pushGuide(false));
  function pushSetup() {
    return pushDone() ? `<details class="more"><summary>Push-Nachrichten (eingerichtet ✓)</summary>${pushGuide(true)}</details>` : '';
  }

  // ---- Team -------------------------------------------------------------------
  function teamList(kind, persons, title) {
    const rows = persons.map((p) => editPerson === p.id ? `
      <form class="panel" data-edit-person="${esc(p.id)}">
        <label class="field">Name <input name="name" value="${esc(p.name)}" required maxlength="60"></label>
        <div class="actions"><button class="primary" type="submit">Speichern</button><button type="button" data-edit-cancel>Abbrechen</button></div>
      </form>` : `
      <div class="panel"><div class="person"><b style="font-size:17px">${esc(p.name)}</b><span class="meta">${kind === 'lead' ? 'Reinigungsleitung' : 'Mitarbeiterin'}</span></div>
        ${'code' in p ? `<div class="codeline"><span class="meta">Anmeldecode:</span>${p.code
          ? `<span class="code" id="code-${esc(p.id)}">${esc(p.code.slice(0, 3))} ${esc(p.code.slice(3))}</span><button class="small" data-copy="code-${esc(p.id)}">Kopieren</button>`
          : '<span class="meta">nicht mehr sichtbar – bitte „Neuen Code erzeugen“</span>'}</div>` : ''}
        <div class="actions">
          <button class="small" data-edit-person="${esc(p.id)}">Name ändern</button>
          <button class="small" data-newcode="${esc(p.id)}">Neuen Code erzeugen</button>
          <button class="small danger" data-remove="${esc(p.id)}">Entfernen</button>
        </div></div>`).join('');
    return `<h3 style="margin:14px 0 8px; font-size:16px">${title}</h3>
      ${rows || '<p class="empty">Noch niemand angelegt.</p>'}
      <form class="panel" data-add-person="${kind}" style="margin-top:10px">
        <div class="form-grid"><label class="field">${kind === 'lead' ? 'Reinigungsleitung hinzufügen' : 'Mitarbeiterin hinzufügen'}
          <input name="name" required maxlength="60" placeholder="Name"></label>
          <button class="primary" type="submit">Anlegen und Code erzeugen</button></div>
      </form>`;
  }
  function codeBox() {
    return newCode ? `<div class="codebox"><div class="eyebrow">Anmeldecode für ${esc(newCode.name)}</div>
      <div class="code">${esc(newCode.code.slice(0, 3))} ${esc(newCode.code.slice(3))}</div>
      <p class="meta">Persönlich weitergeben. Anmeldung unter <b>${esc(location.host)}</b>. Der Code bleibt unten in der Liste jederzeit sichtbar.
      „Neuen Code erzeugen“ meldet alle bisherigen Geräte dieser Person ab.</p>
      <div class="actions"><button class="small" data-hide-code>Verstanden, ausblenden</button></div></div>` : '';
  }

  // ---- Mitarbeiterin ----------------------------------------------------------
  function renderStaff() {
    const t0 = data.today;
    const upcoming = data.tasks.filter((t) => lastDay(t) >= t0 && (isActive(t) || t.date === t0 || t.status === 'storniert'));
    const past = data.tasks.filter((t) => !upcoming.includes(t) && t.date < t0).reverse();
    const fresh = upcoming.filter((t) => isActive(t) && !t.staffConfirmedAt);
    const planned = upcoming.filter((t) => !(isActive(t) && !t.staffConfirmedAt));
    const today = data.tasks.filter((t) => onDay(t, t0) && t.status !== 'storniert');
    const next = upcoming.find(isActive);
    return `
      <div class="greeting"><h1>Hallo ${esc(data.user.name)}</h1><p class="meta">${fmtLong(t0)}</p></div>
      <div class="glance three">
        ${tile('neu', fresh.length, 'neu – bitte bestätigen', fresh.length > 0)}
        ${tile('plan', today.length ? `${today.filter((t) => t.status === 'erledigt').length}/${today.length}` : '0', today.length ? 'heute erledigt' : 'heute nichts')}
        ${tile(next ? 'task-' + next.id : 'plan', next ? esc(next.apartmentName) : '–', next ? 'als Nächstes · ' + esc(dayWord(next.date)) : 'nichts geplant', false, true)}
      </div>
      ${pushBanner()}
      ${newsPanel()}
      ${fresh.length ? section('neu', 'Neu – bitte bestätigen', fresh.length + ' offen', list(fresh, '', next && next.id), 'key') : ''}
      ${section('plan', 'Mein Plan', 'bestätigt & erledigt', byDay(planned, next && next.id) || `<p class="empty">${fresh.length ? 'Bitte oben bestätigen.' : 'Keine Reinigungen zugewiesen.'}</p>`, 'key')}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, '')}</details>` : ''}
      ${pushSetup()}`;
  }

  // ---- Reinigungsleitung -----------------------------------------------------
  function renderLead() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const active = data.tasks.filter(isActive);
    const todo = active.filter((t) => lastDay(t) >= t0 && (!t.leadConfirmedAt || !t.assignedTo));
    const waiting = active.filter((t) => t.assignedTo && !t.staffConfirmedAt);
    const rest = data.tasks.filter((t) => !todo.includes(t));
    const today = rest.filter((t) => onDay(t, t0));
    const tomorrow = rest.filter((t) => t.date === t1);
    const soon = rest.filter((t) => t.date > t1 && t.date <= t14);
    const later = rest.filter((t) => t.date > t14);
    const past = rest.filter((t) => t.date < t0 && !today.includes(t)).reverse();
    const reports = data.openReports || [];
    return `
      <div class="greeting greet-row"><div><h1>Hallo ${esc(data.user.name)}</h1><p class="meta">Reinigungsleitung · ${fmtLong(t0)}</p></div>
        <button class="primary" data-open-calendar>Kalender</button></div>
      <div class="glance">
        ${tile('neu', todo.length, 'zu bestätigen / zuweisen', todo.length > 0)}
        ${tile('heute', waiting.length, 'warten auf Mitarbeiterin', waiting.some((t) => t.date <= t1))}
        ${tile('heute', data.tasks.filter((t) => onDay(t, t0) && t.status !== 'storniert').length, 'Reinigungen heute')}
        ${tile('meldungen', reports.length, 'offene Meldungen', reports.length > 0)}
      </div>
      ${pushBanner()}
      ${newsPanel()}
      ${todo.length ? section('neu', 'Neu – bestätigen & zuweisen', todo.length + ' offen', list(todo, ''), 'key') : ''}
      ${section('heute', 'Heute', fmt(t0), list(today, 'Heute stehen keine weiteren Reinigungen an.'), 'key')}
      ${section('morgen', 'Morgen', fmt(t1), list(tomorrow, 'Keine Reinigungen.'))}
      ${section('bald', 'Nächste 14 Tage', '', list(soon, 'Keine Reinigungen.'))}
      ${later.length ? `<details class="more"><summary>Später (${later.length})</summary>${list(later, '')}</details>` : ''}
      ${past.length ? `<details class="more"><summary>Letzte 7 Tage (${past.length})</summary>${list(past, '')}</details>` : ''}
      ${section('meldungen', 'Offene Meldungen', '', reportsBlock(reports))}
      ${section('team', 'Mein Team', (data.staff || []).length + ' Mitarbeiterinnen', codeBox() + teamList('staff', data.staff || [], 'Mitarbeiterinnen'))}
      ${pushSetup()}`;
  }

  function reportsBlock(reports) {
    return reports.length ? reports.map((r) => `<article class="task"><div class="eyebrow">${esc(dayWord(r.date))} · ${fmtLong(r.date)}</div>
      <h3>${esc(r.apartmentName)}</h3>${reportHtml({ id: r.taskId }, r)}</article>`).join('') : '<p class="empty">Keine offenen Meldungen.</p>';
  }

  const pushFailedRecently = () => data.pushReport && data.pushReport.failed > 0 && Date.now() - Date.parse(data.pushReport.at) < 3 * 3600000;

  // ---- Admin ------------------------------------------------------------------
  function renderOwner() {
    const t0 = data.today, t1 = addDays(t0, 1), t14 = addDays(t0, 14);
    const tasks = data.tasks;
    const active = tasks.filter(isActive);
    // Reinigungen mit offenem Antrag stehen oben im eigenen Abschnitt (nicht doppelt)
    const requests = data.openRequests || [];
    const keys = data.missingKeys || [];
    const reqIds = new Set(requests.map((q) => q.taskId));
    const shown = tasks.filter((t) => !reqIds.has(t.id));
    const today = shown.filter((t) => onDay(t, t0));
    const tomorrow = shown.filter((t) => t.date === t1);
    const soon = shown.filter((t) => t.date > t1 && t.date <= t14);
    const later = shown.filter((t) => t.date > t14);
    const past = shown.filter((t) => t.date < t0 && !today.includes(t)).reverse();
    const unconfirmed = active.filter((t) => t.status === 'offen' && lastDay(t) >= t0);
    const alarms = active.filter((t) => t.overdue || t.lateAlerted);
    const reports = data.openReports || [];
    const apartments = data.apartments || [];
    const urgent = [
      ...keys.map((k) => [`task-${k.taskId}`, `Schlüssel fehlen: ${k.apartmentName} (gemeldet ${clock(k.doneAt)} von ${nameOf(k.doneBy)})${k.note ? ' – ' + k.note : ''}`]),
      ...requests.map((q) => [`task-${q.taskId}`, `Antrag: ${q.apartmentName} – Reinigung bis ${fmt(q.until)} (${nameOf(q.by)})`]),
      ...alarms.map((t) => [`task-${t.id}`, `${t.apartmentName} – ${dayWord(t.date)}: ${
        t.overdue === 'start' ? 'noch nicht begonnen' : t.overdue ? (t.startedAt ? 'noch nicht beendet' : 'nicht erledigt') : 'nicht rechtzeitig bestätigt'}`]),
      ...unconfirmed.filter((t) => !t.lateAlerted && t.date <= t1).map((t) => [`task-${t.id}`, `${t.apartmentName} – ${dayWord(t.date)}: noch nicht vollständig bestätigt`]),
      ...(!data.hasOwnerCode ? [['team', 'Eigenen 6-stelligen Admin-Code festlegen']] : []),
      ...(!(data.leads || []).length ? [['team', 'Noch keine Reinigungsleitung angelegt']] : []),
    ];
    const manualForm = `<form class="panel" id="manual-form">
      <div class="form-grid">
        <label class="field">Wohnung / Einheit
          <select id="m-apt" required><option value="">Bitte wählen …</option>${apartments.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label>
        <label class="field">Datum <input id="m-date" type="date" required min="${t0}" value="${t1}"></label>
      </div>
      <label class="field" style="margin-top:10px">Hinweis für die Reinigung (optional)
        <input id="m-note" maxlength="500" placeholder="z. B. Zwischenreinigung, Fenster putzen, Bettwäsche wechseln"></label>
      <div class="actions"><button class="primary" type="submit">Eintragen und Reinigungsleitung benachrichtigen</button></div>
    </form>`;
    const ownerCode = `<form class="panel" id="owner-code">
        <b>Mein Admin-Code</b>
        <p class="meta" style="margin:4px 0 8px">${data.hasOwnerCode ? 'Eingerichtet ✓ – hier ändern.' : 'Noch nicht eingerichtet – damit reicht auf der Startseite der Code.'}</p>
        <div class="form-grid"><label class="field">Neuer 6-stelliger Code
          <input id="owner-code-input" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="z. B. 482913" required></label>
          <button class="primary" type="submit">${data.hasOwnerCode ? 'Code ändern' : 'Code festlegen'}</button></div>

  function renderCalendar() {
    const days = Array.from({ length: cal.days }, (_, i) => addDays(cal.from, i));
    const cls = (d) => [utc(d).getUTCDay() % 6 === 0 ? 'we' : '', d === cal.today ? 'today' : ''].filter(Boolean).join(' ');
    const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    const head = days.map((d, i) => { const u = utc(d); const first = u.getUTCDate() === 1 || i === 0;
      return `<div class="cal-day ${cls(d)}${u.getUTCDate() === 1 ? ' month' : ''}">${first ? MON[u.getUTCMonth()] : WD[u.getUTCDay()]}<b>${u.getUTCDate()}</b></div>`; }).join('');
    const W = 42;
    const rows = cal.apartments.map((a) => {
      const bars = cal.bookings.filter((b) => b.apartmentId === a.id).map((b) => {
        const start = Math.max(0, diffDays(cal.from, b.arrival) + 0.5);
        const end = Math.min(cal.days, diffDays(cal.from, b.departure) + 0.5);
        if (end <= start) return '';
        const nights = diffDays(b.arrival, b.departure);
        const label = b.blocked ? 'blockiert' : [shortGuests(b), b.guest || (shortGuests(b) ? '' : 'Buchung')].filter(Boolean).join(' · ');
        const info = `${a.name}: ${b.blocked ? 'blockiert' : b.guest || 'Buchung'}${b.guests ? ' · ' + b.guests : ''} · ${fmt(b.arrival)} – ${fmt(b.departure)} (${nights} ${nights === 1 ? 'Nacht' : 'Nächte'})`;
        return `<button type="button" class="cal-bar${b.blocked ? ' blocked' : ''}${diffDays(cal.from, b.arrival) < 0 ? ' cut-l' : ''}${diffDays(cal.from, b.departure) >= cal.days ? ' cut-r' : ''}"
          style="left:${start * W}px;width:${(end - start) * W - 2}px" data-cal-booking="${esc(b.id)}" aria-label="${esc(info)}">${esc(label)}</button>`;
      }).join('');
      const marks = cal.cleanings.filter((c) => c.apartmentId === a.id).map((c) => {
        const sym = c.overdue ? '!' : c.status === 'erledigt' ? '✓' : c.status === 'bestätigt' ? '✓' : '!';
        const period = c.latestDate ? `<div class="cal-period" style="left:${(diffDays(cal.from, c.date) + 0.5) * W}px;width:${diffDays(c.date, c.latestDate) * W}px"></div>` : '';
        return period + `<button type="button" class="cal-clean ${esc(c.status)}${c.manual ? ' manual' : ''}${c.overdue ? ' overdue' : ''}${c.periodRequest ? ' req' : ''}"
          style="left:${(diffDays(cal.from, c.date) + 0.5) * W}px" data-cal-clean="${esc(c.id)}"
          aria-label="Reinigung ${esc(a.name)} ${fmt(c.date)}: ${esc(c.status)}">${sym}</button>`;
      }).join('');
      return `<div class="cal-apt"><b>${a.number}</b><span>${esc(a.name)}</span></div>
        <div class="cal-row">${days.map((d) => `<div class="cal-cell ${cls(d)}"></div>`).join('')}${bars}${marks}</div>`;
    }).join('');
    $('app').innerHTML = `
      <div class="cal-top">
        <button data-close-calendar>‹ Zurück zur Übersicht</button>
        <div class="cal-nav"><button class="small" data-cal-shift="-14">‹ 2 Wochen</button><button class="small" data-cal-shift="0">Heute</button><button class="small" data-cal-shift="14">2 Wochen ›</button></div>
      </div>
      <h1 style="margin-top:14px">Belegungskalender</h1>
      <p class="meta">${fmtLong(cal.from)} – ${fmtLong(addDays(cal.from, cal.days - 1))} · Buchung oder Reinigung antippen für Details</p>
      <div class="legend"><span><i style="background:var(--brand)"></i>Buchung (z. B. „2+1 P.“ = 2 Erwachsene, 1 Kind)</span>
        <span><i style="background:repeating-linear-gradient(135deg,var(--done-bg) 0 4px,var(--line) 4px 8px)"></i>blockiert</span></div>
      <div class="legend" style="margin-top:0"><b style="color:var(--text)">Reinigung:</b>
        <span><span class="sym" style="background:#D98A1C">!</span>offen</span>
        <span><span class="sym" style="background:var(--accent)">✓</span>bestätigt</span>
        <span><span class="sym" style="background:#2F6B3F">✓</span>erledigt</span>
        <span><span class="sym" style="background:var(--bad)">!</span>überfällig (12 Uhr nicht begonnen / 15 Uhr nicht fertig)</span>
        <span><span class="sym sq" style="background:var(--muted)">■</span>manuelle Reinigung</span>
        <span>● Check-out</span>
        <span><i style="border-top:3px dashed var(--accent);height:0;background:none"></i>Zeitraum (späterer Tag erlaubt)</span>
        <span><span class="sym" style="background:var(--open)">?</span>Antrag offen</span></div>
      ${cal.apartments.length ? `<div class="cal" id="cal-scroll"><div class="cal-grid" style="--days:${cal.days}">
        <div class="cal-corner">Wohnung</div><div class="cal-days">${head}</div>
        ${rows}
      </div></div>` : '<p class="empty">Noch keine Wohnungen – bitte zuerst mit Smoobu abgleichen.</p>'}
      <div class="actions" style="margin-top:16px"><button data-close-calendar>‹ Zurück zur Übersicht</button></div>`;
    const idx = diffDays(cal.from, cal.today);
    const box = $('cal-scroll');
    if (box && idx > 1) box.scrollLeft = (idx - 1) * W;
  }

  // ---- Galerie ----------------------------------------------------------------
  const gallery = { ids: [], index: 0, x: null };
  function showPhoto() {
    $('g-img').src = photoUrl(gallery.ids[gallery.index]);
    $('g-count').textContent = `Foto ${gallery.index + 1} von ${gallery.ids.length}`;
    $('g-prev').hidden = $('g-next').hidden = gallery.ids.length < 2;
  }
  function openGallery(ids, index) {
    gallery.ids = ids; gallery.index = index;
    showPhoto();
    $('gallery').hidden = false;
    document.body.style.overflow = 'hidden';
    $('g-close').focus();
  }
  function closeGallery() { $('gallery').hidden = true; document.body.style.overflow = ''; $('g-img').removeAttribute('src'); }
  function step(d) { gallery.index = (gallery.index + d + gallery.ids.length) % gallery.ids.length; showPhoto(); }
  $('g-close').onclick = closeGallery;
  $('g-prev').onclick = () => step(-1);
  $('g-next').onclick = () => step(1);
  $('g-stage').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeGallery(); });
  $('g-stage').addEventListener('touchstart', (e) => { gallery.x = e.touches[0].clientX; }, { passive: true });
  $('g-stage').addEventListener('touchend', (e) => {
    if (gallery.x == null) return;
    const dx = e.changedTouches[0].clientX - gallery.x;
    gallery.x = null;
    if (Math.abs(dx) > 40 && gallery.ids.length > 1) step(dx < 0 ? 1 : -1);
  });
  $('modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('modal').hidden) return closeModal();
    if ($('gallery').hidden) return;
    if (e.key === 'Escape') closeGallery();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  // ---- Fotos vor dem Hochladen verkleinern ------------------------------------
  function compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Foto konnte nicht verarbeitet werden'))), 'image/jpeg', 0.75);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden')); };
      img.src = url;
    });
  }
  function redrawPreviews(taskId) {
    const box = document.querySelector(`[data-previews="${CSS.escape(taskId)}"]`);
    if (box) box.innerHTML = previewsHtml(taskId);
