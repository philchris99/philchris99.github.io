<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Anfahrt &amp; Zugang – Apartments Strauss</title>
<link rel="icon" type="image/png" href="/icon-512.png">
<style>
:root {
  --brand: #2E2E2C; --brand-ink: #FFFFFF; --accent: #7C8B6B; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #F6F4F0; --card: #FFFFFF; --text: #242422; --muted: #6E6A64; --line: #E4DFD7;
  --warn: #B85C00; --warn-bg: #FFF1E0; --bad: #B03535; --bad-bg: #FBE6E6;
}
@media (prefers-color-scheme: dark) {
  :root { --brand: #ECE8E1; --brand-ink: #1B1B1A; --accent: #A6B594; --bg: #151514; --card: #1F1F1D; --text: #EDEAE4; --muted: #A39E96;
    --line: #34332F; --warn: #FFB566; --warn-bg: #3A2A14; --bad: #F08C8C; --bad-bg: #3D1D1D; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); padding: 0 16px 40px; }
main { max-width: 640px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header img { height: 40px; }
@media (prefers-color-scheme: dark) { header img { filter: invert(1); } }
header small { display: block; color: var(--muted); font-size: 13px; }
h1 { font-size: 24px; line-height: 1.25; margin-bottom: 4px; }
.meta { color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.service { border: 3px solid var(--warn); background: var(--warn-bg); }
.service .label { font-weight: 800; color: var(--warn); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
.service .code { font-size: 44px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0; }
.service p { font-size: 15px; }
.door .label { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
.door .code { font-size: 36px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.job { border: 3px solid var(--brand); }
.job .label { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
.jobmedia { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
.jobmedia img, .jobmedia video { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #000; display: block; }
.job textarea { width: 100%; margin: 4px 0 6px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
.btn.go { background: #3D6B47; color: #fff; border-color: #3D6B47; cursor: pointer; }
.donebox { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #E4F0E6; color: #1F4A2A; font-weight: 600; }
@media (prefers-color-scheme: dark) { .donebox { background: #1B2E1F; color: #8CCB98; } }
.dont { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-weight: 700; font-size: 15px; }
ol { list-style: none; counter-reset: s; margin-top: 4px; }
ol li { counter-increment: s; position: relative; padding: 10px 0 10px 40px; border-bottom: 1px solid var(--line); }
ol li:last-child { border-bottom: 0; }
ol li::before { content: counter(s); position: absolute; left: 0; top: 9px; width: 28px; height: 28px; border-radius: 99px; background: var(--brand); color: var(--brand-ink);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
ol li.svc { background: var(--warn-bg); border-radius: 10px; margin: 4px 0; padding-right: 8px; font-weight: 600; }
ol li.svc::before { background: var(--warn); color: #fff; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; margin-top: 8px; }
.photos { display: grid; gap: 12px; margin-top: 8px; }
.photos figure { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.photos img { width: 100%; display: block; max-height: 70vh; object-fit: contain; background: #000; }
.photos figcaption { padding: 8px 12px; font-size: 14px; }
.error { text-align: center; padding: 40px 10px; }
.error b { display: block; font-size: 20px; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <header><img src="/logo.png" alt="Apartments Strauss"><div><b>Anfahrt &amp; Zugang</b><small>für Handwerker &amp; Dienstleister</small></div></header>
  <div id="app"><p class="meta">Wird geladen …</p></div>
</main>
<script>
(async () => {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = document.getElementById('app');
  const token = location.pathname.split('/').pop();
  let g;
  try {
    const res = await fetch('/api/guide/' + encodeURIComponent(token), { cache: 'no-store' });
    g = await res.json();
    if (!res.ok) throw new Error(g.error || 'Fehler');
  } catch (e) {
    app.innerHTML = `<div class="card error"><b>🔒 Nicht verfügbar</b><p>${esc(e.message === 'Failed to fetch' ? 'Keine Verbindung – bitte später erneut öffnen.' : e.message)}</p></div>`;
    return;
  }
  const until = new Date(g.expiresAt).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const maps = g.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.address)}` : '';
  const code = String(g.serviceCode || '');
  const when = (iso) => new Date(iso).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  function jobCard(j) {
    return `<div class="card job"><div class="label">🔧 Ihr Auftrag</div>
      <p style="white-space:pre-line;margin-top:4px">${esc(j.text)}</p>
      ${j.media.length ? `<div class="jobmedia">${j.media.map((m) => m.video
        ? `<video src="${esc(m.url)}" controls playsinline preload="metadata"></video>`
        : `<a href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" alt="Foto zur Meldung" loading="lazy"></a>`).join('')}</div>` : ''}
      ${j.doneAt ? `<div class="donebox">✅ Als erledigt gemeldet am ${esc(when(j.doneAt))} Uhr${j.doneNote ? ` – ${esc(j.doneNote)}` : ''}. Vielen Dank!</div>`
        : `<form id="done-form" style="margin-top:10px"><label class="meta" for="done-note">Kurze Notiz (freiwillig)</label>
          <textarea id="done-note" rows="2" maxlength="1000" placeholder="z. B. Dichtung getauscht"></textarea>
          <button class="btn go" type="submit">✅ Auftrag erledigt melden</button></form>`}
    </div>`;
  }
  app.innerHTML = `
    <h1>${esc(g.title)}</h1>
    <p class="meta">${g.name ? `Für ${esc(g.name)} · ` : ''}Link gültig bis ${esc(until)} Uhr</p>
    ${g.job ? jobCard(g.job) : ''}
    <div class="card">
      ${g.address ? `<div><b>📍 ${esc(g.address)}</b></div>` : ''}
      ${g.location ? `<div class="meta">Lage: ${esc(g.location)}</div>` : ''}
      ${maps ? `<a class="btn" href="${maps}" target="_blank" rel="noopener">🗺️ In Google Maps öffnen</a>` : ''}
    </div>
    ${g.door ? `<div class="card door"><div class="label">🚪 Zuerst: Türcode</div><div class="code">${esc(g.door.code)}</div><p>${esc(g.door.text)}</p></div>` : ''}
    <div class="card service">
      <div class="label">🔑 Bitte die SERVICE-Schlüsselbox benutzen</div>
      <div class="code">${code ? esc(code) : '–'}</div>
      <p>${esc(g.serviceBox)}</p>
      <div class="dont">⛔ Bitte NICHT die Gäste-Schlüsselbox öffnen – die Schlüssel dort sind für die Gäste.</div>
    </div>
    <div class="card"><b>So kommen Sie zur Wohnung</b>
      <ol>${g.steps.map((s) => `<li class="${s.service ? 'svc' : ''}">${s.service ? '🔑 ' : ''}${esc(s.text)}</li>`).join('')}</ol>
    </div>
    ${g.photos.length ? `<div class="photos">${g.photos.map((p) => `<figure><img src="${esc(p.url)}" alt="${esc(p.caption)}" loading="lazy"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')}</div>` : ''}
    <p class="meta" style="margin-top:16px">Fragen? Bitte bei Apartments Strauss melden. Diesen Link bitte nicht weitergeben.</p>`;
  const form = document.getElementById('done-form');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Wird gesendet …';
    try {
      const res = await fetch(`/api/guide/${encodeURIComponent(token)}/done`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: document.getElementById('done-note').value }) });
      const r = await res.json();
      if (!res.ok) throw new Error(r.error || 'Fehler');
      form.outerHTML = `<div class="donebox">✅ Als erledigt gemeldet am ${esc(when(r.doneAt))} Uhr. Vielen Dank!</div>`;
    } catch (err) { btn.disabled = false; btn.textContent = '✅ Auftrag erledigt melden'; alert(err.message === 'Failed to fetch' ? 'Keine Verbindung – bitte erneut versuchen.' : err.message); }
  });
})();
</script>
</body>
</html>
